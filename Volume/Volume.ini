; Control-Plaine | Volume
; What it shows: the output volume as a ring, the % (or MUTED) and the output
;   device name. Hover and scroll anywhere to change the volume, click on the
;   ring to jump to that level, click the % to mute, click the device name to
;   switch to the next output, click the speaker to open the volume mixer.
; Designed for: Windows 10/11 with Rainmeter's bundled Win7AudioPlugin, so
;   nothing needs installing. The device name is the name in Windows Sound
;   settings: rename the device there to change what shows here.
; Adjust (Settings > VOLUME, or Volume\Defaults.inc): VolumeAlign (left or
;   right), VolumeDetails (hover or always), VolumeStep, VolumeScrollUnmutes,
;   VolumeRingStroke, VolumeMixer.
[Rainmeter]
; VolumeTooltips=0 hides every tooltip of this skin (see Core.inc).
ToolTipHidden=#TipHidden[#VolumeTooltips]#
Update=500
AccurateText=1
DynamicWindowSize=1
Group=ControlPlaine
ContextTitle=Control-Plaine settings
ContextAction=[!ActivateConfig "#ROOTCONFIG#\Settings" "Volume.ini"]
MouseOverAction=[!SetVariable Hov 1][!CommandMeasure mFade "Stop 2"][!CommandMeasure mFade "Execute 1"]
MouseLeaveAction=[!SetVariable Hov 0][!CommandMeasure mFade "Stop 1"][!CommandMeasure mFade "Execute 2"]
MouseScrollUpAction=[!CommandMeasure mVolume "Scroll(1)"]
MouseScrollDownAction=[!CommandMeasure mVolume "Scroll(-1)"]

[Metadata]
Name=Control-Plaine | Volume
Author=Vishnu A
Information=Volume ring with %, mute, output switching and a shortcut to the volume mixer.
Version=2.0.1
License=MIT

[Variables]
@include=#@#Theme.inc
@include2=#@#Defaults.inc
@include3=#ROOTCONFIGPATH#Volume\Defaults.inc
@include4=#@#User.inc
@include5=#@#State.inc
; 1 while the pointer is over the skin; the ring takes the accent from it when details are always shown.
Hov=0
; Read by Core.inc (Scripts\Core.lua) to arrange the skin; see specs/alignment.md.
SkinSide=#VolumeAlign#
SkinDetails=#VolumeDetails#
SkinTheme=#VolumeTheme#
; Text column width and gap to the ring, px at scale 1.
ColW=170
Gap=12
; Bar and text inset from both ends of the column, as on Media.
Inset=12
; Ring geometry (px, already scaled): stroke, radius, centre.
RingWidth=#VolumeRingStroke#
SW=(#RingWidth#*#Scale#)
RR=(#RingRadius#*#Scale#)
C=((#RingRadius#+#RingWidth#/2+1)*#Scale#)
@include6=#@#Core.inc
; The fixed box. Left and right use the same one, so flipping the side never
; changes the skin's footprint or hit area. Whole pixels. Left: the ring at
; X=0 and the text after it. Right: the same, mirrored inside the box.
BoxW=(Round((#ColW#+#Gap#)*#Scale#+2*#C#))
; What a click on the speaker does: opens VolumeMixer while VolumeHasMixer=1
; (the needs check, Needs.lua, sets it), nothing while it is 0.
MixerAct1=["#VolumeMixer#"]
MixerAct0=
@include7=#@#Styles.inc

; ---------- Measures ----------

[mAudio]
; Number: volume 0-100, or -1 while muted. String: output device name.
Measure=Plugin
Plugin=Win7AudioPlugin
; With no playback device (e.g. the only output is a monitor that is off) the
; plugin's string is "ERROR - Getting Default Device".
RegExpSubstitute=1
Substitute="(?i)^ERROR.*Default Device.*$":"NO OUTPUT DEVICE"
Group=Volume

[mMuted]
Measure=Calc
Formula=mAudio < 0 ? 1 : 0
Group=Volume

[mLevel]
; Last known level; keeps it while muted (the plugin reports -1 then).
Measure=Calc
Formula=mAudio < 0 ? mLevel : mAudio
Group=Volume

[mArc]
; Ring fill, 0 to 0.999 (an arc whose ends meet draws nothing; the round
; caps close the last 0.1%).
Measure=Calc
Formula=Clamp(mLevel/100,0,0.999)
Group=Volume

[mPct]
Measure=String
String=[mAudio:0]%
RegExpSubstitute=1
Substitute="^-1%$":"MUTED"
DynamicVariables=1
Group=Volume

[mIcon]
Measure=String
String=[mMuted:0]
Substitute="0":"speaker","1":"speaker-muted"
DynamicVariables=1
Group=Volume

[mVolume]
Measure=Script
ScriptFile=#@#Scripts\Volume.lua

[mNeedGate]
; The skin cannot read the volume without its audio plugin: while the needs
; check says BLOCKED (VolumeNeedBlocked=1) it hides itself through SelfHidden.
Measure=Calc
Formula=#VolumeNeedBlocked#
DynamicVariables=1
IfCondition=mNeedGate = 1
IfTrueAction=[!SetVariable SelfHidden 1][!UpdateMeasure mVisible]
IfFalseAction=[!SetVariable SelfHidden 0][!UpdateMeasure mVisible]

; ---------- Meters ----------

[Back]
; Hover and scroll area for the whole skin.
Meter=Image
MeterStyle=sHit
W=#BoxW#
H=(2*#C#)

[Pct]
Meter=String
MeterStyle=sValue
MeasureName=mPct
; Against the ring: left of it when the ring is on the right, right of it when
; the ring is on the left. Only shown on hover (or always, per VolumeDetails).
StringAlign=#TAT#
X=(#Mir#*Round((#ColW#-#Inset#)*#Scale#)+(1-#Mir#)*Round(#BoxW#-(#ColW#-#Inset#)*#Scale#))
Y=(2*#Scale#)
InlineSetting=CharacterSpacing | (#Lead#*#TrackValue#*#Scale#) | (#Trail#*#TrackValue#*#Scale#)
FontColor=#Ink#,(#AlphaHover#*#Reveal#)
FontEffectColor=#ShadowRGB#,((#AlphaHover#*#Reveal#)*#ShadowK#)
SolidColor=0,0,0,1
MouseActionCursor=1
ToolTipText=Mute or unmute
LeftMouseUpAction=[!CommandMeasure mAudio "ToggleMute"][!UpdateMeasureGroup Volume][!UpdateMeterGroup Volume][!Redraw]
Text=%1
Group=Reveal | Volume

[Label]
; VOL on the outer side of the %, small, bottom-aligned with the number.
; Hidden while muted (the % then reads MUTED). Placed from the % anchor and
; its width, not from [Pct:X], so nothing depends on how Rainmeter reports
; the X of right-aligned text.
Meter=String
MeterStyle=sDetail
StringAlign=#TAT#
X=(Round(#Mir#*(Round((#ColW#-#Inset#)*#Scale#)-[Pct:W]-7*#Scale#)+(1-#Mir#)*(Round(#BoxW#-(#ColW#-#Inset#)*#Scale#)+[Pct:W]+7*#Scale#)))
Y=([Pct:Y]+[Pct:H]-(#SizeDetail#*1.75+3)*#Scale#)
FontColor=#Ink#,(#AlphaHover#*#Reveal#*(1-[mMuted:0]))
FontEffectColor=0,0,0,0
InlineSetting=CharacterSpacing | (#Lead#*#TrackDetail#*#Scale#) | (#Trail#*#TrackDetail#*#Scale#)
Text=VOL
Group=Reveal | Volume

[Hairline]
Meter=Image
X=(#Mir#*Round(#Inset#*#Scale#)+(1-#Mir#)*Round(#BoxW#-#Inset#*#Scale#-Round((#ColW#-2*#Inset#)*#Scale#)))
Y=(30*#Scale#)
W=(Round((#ColW#-2*#Inset#)*#Scale#))
H=(1*#Scale#)
SolidColor=#Ink#,(#AlphaTrack#*#Reveal#)
DynamicVariables=1
Group=Reveal

[Device]
Meter=String
MeterStyle=sDetail
MeasureName=mAudio
StringAlign=#TAT#
X=(#Mir#*Round((#ColW#-#Inset#)*#Scale#)+(1-#Mir#)*Round(#BoxW#-(#ColW#-#Inset#)*#Scale#))
Y=(35*#Scale#)
ClipString=2
; Up to the skin's outer edge, so a name a bit longer than the bar stays
; on one line.
ClipStringW=((#ColW#-#Inset#)*#Scale#)
InlineSetting=CharacterSpacing | (#Lead#*#TrackDetail#*#Scale#) | (#Trail#*#TrackDetail#*#Scale#)
FontColor=#Ink#,(#AlphaHover#*#Reveal#)
FontEffectColor=#ShadowRGB#,((#AlphaHover#*#Reveal#)*#ShadowK#)
SolidColor=0,0,0,1
MouseActionCursor=1
ToolTipText=Switch output
LeftMouseUpAction=[!CommandMeasure mAudio "ToggleNext"][!UpdateMeasureGroup Volume][!UpdateMeterGroup Volume][!Redraw]
Text=%1
Group=Reveal | Volume

[Ring]
; Track, the level in the same brightness as the small grey text (dimmer while muted), and the level in accent fading
; in while the skin is hovered. The grey level fades out as the accent fades in: two translucent strokes on the same
; path leave a pale fringe at their anti-aliased edges, which read as a rough ring.
Meter=Shape
MeterStyle=sRing
X=(#Mir#*Round(#BoxW#-2*#C#))
Y=0
Shape=Ellipse #C#,#C#,#RR# | Fill Color 0,0,0,0 | StrokeWidth #SW# | Stroke Color #Ink#,#AlphaTrack#
Shape2=Arc (#C#-#RR#),#C#,(#C#-#RR#*Cos(2*PI*[mArc:4])),(#C#-#RR#*Sin(2*PI*[mArc:4])),#RR#,#RR#,0,0,([mArc:4]>0.5 ? 1 : 0) | Fill Color 0,0,0,0 | StrokeWidth #SW# | Stroke Color #Ink#,([mArc:4]>0 ? ((1-[mMuted:0])*(#AlphaDetail#+(#AlphaHover#-#AlphaDetail#)*(#RevealMin#=1 ? #Hov# : #Reveal#))+[mMuted:0]*#AlphaOff#)*(1-(#RevealMin#=1 ? #Hov# : #Reveal#)*(1-[mMuted:0])) : 0) | StrokeStartCap Round | StrokeEndCap Round
Shape3=Arc (#C#-#RR#),#C#,(#C#-#RR#*Cos(2*PI*[mArc:4])),(#C#-#RR#*Sin(2*PI*[mArc:4])),#RR#,#RR#,0,0,([mArc:4]>0.5 ? 1 : 0) | Fill Color 0,0,0,0 | StrokeWidth #SW# | Stroke Color #Accent#,(([mArc:4]>0)*(1-[mMuted:0])*(#RevealMin#=1 ? #Hov# : #Reveal#)*255) | StrokeStartCap Round | StrokeEndCap Round
Group=Reveal | Volume

[RingHit]
; Click on the ring band sets the level at that angle (Volume.lua). Same box as
; the Ring on either side, so the angle maths never depends on the side.
Meter=Image
MeterStyle=sHit
X=r
Y=r
W=(2*#C#)
H=(2*#C#)
MouseActionCursor=1
ToolTipText=Set volume
LeftMouseUpAction=[!CommandMeasure mVolume "RingClick($MouseX$,$MouseY$)"]

[Speaker]
Meter=Image
MeterStyle=sIconFade
ImageName=#@#Icons\[mIcon].png
; Rounded: a meter at a half pixel is truncated, so round to the nearest one.
X=(Round(#Mir#*(#BoxW#-2*#C#)+#C#-#IconBox#/2*#Scale#))
Y=(Round(#C#-#IconBox#/2*#Scale#))
ToolTipText=Open volume mixer
ToolTipHidden=(Clamp((1-#VolumeHasMixer#)+(#VolumeTooltips#=1 ? #TipHidden1# : #TipHidden0#),0,1))
MouseActionCursor=#VolumeHasMixer#
LeftMouseUpAction=#MixerAct[#VolumeHasMixer]#
DynamicVariables=1
Group=Reveal | Volume
