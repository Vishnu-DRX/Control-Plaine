; Control-Plaine | Volume
; What it shows: the output volume as a ring, the % (or MUTED) and the output
;   device name. Hover and scroll anywhere to change the volume, click on the
;   ring to jump to that level, click the % to mute, click the device name to
;   switch to the next output, click the speaker to open the volume mixer.
; Designed for: Windows 10/11 with Rainmeter's bundled Win7AudioPlugin, so
;   nothing needs installing. The device name is the name in Windows Sound
;   settings: rename the device there to change what shows here.
; Adjust (Settings > VOLUME, or Volume\Defaults.inc): VolumeStep,
;   VolumeScrollUnmutes, VolumeRingStroke, VolumeMixer.
[Rainmeter]
Update=500
AccurateText=1
DynamicWindowSize=1
Group=ControlPlaine
ContextTitle=Control-Plaine settings
ContextAction=[!ActivateConfig "#ROOTCONFIG#\Settings" "Volume.ini"]
MouseOverAction=[!CommandMeasure mFade "Stop 2"][!CommandMeasure mFade "Execute 1"]
MouseLeaveAction=[!CommandMeasure mFade "Stop 1"][!CommandMeasure mFade "Execute 2"]
MouseScrollUpAction=[!CommandMeasure mVolume "Scroll(1)"]
MouseScrollDownAction=[!CommandMeasure mVolume "Scroll(-1)"]

[Metadata]
Name=Control-Plaine | Volume
Author=Vishnu A
Information=Volume ring with %, mute, output switching and a shortcut to the volume mixer.
Version=2.0.0
License=CC BY-NC-SA 4.0

[Variables]
@include=#@#Theme.inc
@include2=#@#Defaults.inc
@include3=#ROOTCONFIGPATH#Volume\Defaults.inc
@include4=#@#User.inc
@include5=#@#State.inc
; Text column width and gap to the ring, px at scale 1.
ColW=170
Gap=12
; Bar and text inset from both ends of the column, as on Media.
Inset=12
; Ring geometry (px, already scaled): stroke, radius, centre.
RingWidth=#VolumeRingStroke#
SW=(#RingWidth#*#Scale#)
RR=(#RingRadius#*#Scale#)
C=((#RingRadius#+#RingWidth#/2+1)*#Scale#)
@include6=#@#Core.inc
@include7=#@#Styles.inc

; ---------- Measures ----------

[mAudio]
; Number: volume 0-100, or -1 while muted. String: output device name.
Measure=Plugin
Plugin=Win7AudioPlugin
; With no playback device (e.g. the only output is a monitor that is off) the
; plugin's string is "ERROR - Getting Default Device".
RegExpSubstitute=1
Substitute="(?i)^ERROR.*Default Device.*$":"NO OUTPUT DEVICE"
Group=Volume

[mMuted]
Measure=Calc
Formula=mAudio < 0 ? 1 : 0
Group=Volume

[mLevel]
; Last known level; keeps it while muted (the plugin reports -1 then).
Measure=Calc
Formula=mAudio < 0 ? mLevel : mAudio
Group=Volume

[mArc]
; Ring fill, 0 to 0.999 (an arc whose ends meet draws nothing; the round
; caps close the last 0.1%).
Measure=Calc
Formula=Clamp(mLevel/100,0,0.999)
Group=Volume

[mPct]
Measure=String
String=[mAudio:0]%
RegExpSubstitute=1
Substitute="^-1%$":"MUTED"
DynamicVariables=1
Group=Volume

[mIcon]
Measure=String
String=[mMuted:0]
Substitute="0":"speaker","1":"speaker-muted"
DynamicVariables=1
Group=Volume

[mVolume]
Measure=Script
ScriptFile=#@#Scripts\Volume.lua

; ---------- Meters ----------

[Back]
; Hover and scroll area for the whole skin.
Meter=Image
MeterStyle=sHit
W=((#ColW#+#Gap#)*#Scale#+2*#C#)
H=(2*#C#)

[Pct]
Meter=String
MeterStyle=sValue
MeasureName=mPct
; Right-aligned against the ring, as on the canvas.
StringAlign=Right
X=((#ColW#-#Inset#)*#Scale#)
Y=(2*#Scale#)
InlineSetting=CharacterSpacing | (#TrackValue#*#Scale#) | 0
SolidColor=0,0,0,1
MouseActionCursor=1
ToolTipText=Click to mute or unmute
LeftMouseUpAction=[!CommandMeasure mAudio "ToggleMute"][!UpdateMeasureGroup Volume][!UpdateMeterGroup Volume][!Redraw]
Text=%1
Group=Reveal | Volume

[Label]
; VOL before the %, small and dim, bottom-aligned with the number. Hidden
; while muted (the % then reads MUTED).
Meter=String
MeterStyle=sDetail
StringAlign=Right
X=([Pct:X]-7*#Scale#)
Y=([Pct:Y]+[Pct:H]-(#SizeDetail#*1.75+3)*#Scale#)
FontColor=#Ink#,((#AlphaDetail#+(#AlphaHover#-#AlphaDetail#)*#Reveal#)*(1-[mMuted:0]))
FontEffectColor=0,0,0,0
InlineSetting=CharacterSpacing | (#TrackDetail#*#Scale#) | 0
Text=VOL
Group=Reveal | Volume

[Hairline]
Meter=Image
X=(#Inset#*#Scale#)
Y=(30*#Scale#)
W=((#ColW#-2*#Inset#)*#Scale#)
H=(1*#Scale#)
SolidColor=#Ink#,#AlphaTrack#
DynamicVariables=1

[Device]
Meter=String
MeterStyle=sDetail
MeasureName=mAudio
StringAlign=Right
X=((#ColW#-#Inset#)*#Scale#)
Y=(35*#Scale#)
ClipString=2
; Up to the skin's left edge, so a name a bit longer than the bar stays
; on one line.
ClipStringW=((#ColW#-#Inset#)*#Scale#)
InlineSetting=CharacterSpacing | (#TrackDetail#*#Scale#) | 0
SolidColor=0,0,0,1
MouseActionCursor=1
ToolTipText=Click to switch to the next output
LeftMouseUpAction=[!CommandMeasure mAudio "ToggleNext"][!UpdateMeasureGroup Volume][!UpdateMeterGroup Volume][!Redraw]
Text=%1
Group=Reveal | Volume

[Ring]
; Track, the level in the same brightness as the % (grey while muted), and the level in accent fading
; in on top while the skin is hovered.
Meter=Shape
MeterStyle=sRing
X=((#ColW#+#Gap#)*#Scale#)
Y=0
Shape=Ellipse #C#,#C#,#RR# | Fill Color 0,0,0,0 | StrokeWidth #SW# | Stroke Color #Ink#,#AlphaTrack#
Shape2=Arc (#C#-#RR#),#C#,(#C#-#RR#*Cos(2*PI*[mArc:4])),(#C#-#RR#*Sin(2*PI*[mArc:4])),#RR#,#RR#,0,0,([mArc:4]>0.5 ? 1 : 0) | Fill Color 0,0,0,0 | StrokeWidth #SW# | Stroke Color #Ink#,([mArc:4]>0 ? (1-[mMuted:0])*(#AlphaValue#+(#AlphaHover#-#AlphaValue#)*#Reveal#)+[mMuted:0]*#AlphaOff# : 0) | StrokeStartCap Round | StrokeEndCap Round
Shape3=Arc (#C#-#RR#),#C#,(#C#-#RR#*Cos(2*PI*[mArc:4])),(#C#-#RR#*Sin(2*PI*[mArc:4])),#RR#,#RR#,0,0,([mArc:4]>0.5 ? 1 : 0) | Fill Color 0,0,0,0 | StrokeWidth #SW# | Stroke Color #Accent#,(([mArc:4]>0)*(1-[mMuted:0])*#Reveal#*255) | StrokeStartCap Round | StrokeEndCap Round
Group=Reveal | Volume

[RingHit]
; Click on the ring band sets the level at that angle (Volume.lua).
Meter=Image
MeterStyle=sHit
X=r
Y=r
W=(2*#C#)
H=(2*#C#)
MouseActionCursor=1
ToolTipText=Click to set the volume
LeftMouseUpAction=[!CommandMeasure mVolume "RingClick($MouseX$,$MouseY$)"]

[Speaker]
Meter=Image
MeterStyle=sIconFade
ImageName=#@#Icons\[mIcon].png
; Rounded: a meter at a half pixel is truncated, so round to the nearest one.
X=(Round((#ColW#+#Gap#)*#Scale#+#C#-#IconBox#/2*#Scale#))
Y=(Round(#C#-#IconBox#/2*#Scale#))
ToolTipText=Open the volume mixer
LeftMouseUpAction=["#VolumeMixer#"]
Group=Reveal | Volume
