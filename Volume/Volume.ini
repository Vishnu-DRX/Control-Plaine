[Rainmeter]
Update=500
AccurateText=1
DynamicWindowSize=1
MouseOverAction=[!CommandMeasure mFade "Stop 2"][!CommandMeasure mFade "Execute 1"]
MouseLeaveAction=[!CommandMeasure mFade "Stop 1"][!CommandMeasure mFade "Execute 2"]
MouseScrollUpAction=[!CommandMeasure mAudio "Unmute"][!CommandMeasure mAudio "ChangeVolume +#VolumeStep#"][!Update]
MouseScrollDownAction=[!CommandMeasure mAudio "ChangeVolume -#VolumeStep#"][!Update]

[Metadata]
Name=Control-Plaine | Volume
Author=Vishnu A
Information=Thin ring showing the volume. Hover and scroll to change it (scrolling up also unmutes). Click the ring to mute. Hover shows the output device; click it to switch to the next one.
Version=1.0.0
License=CC BY-NC-SA 4.0

[Variables]
@include=#@#Theme.inc
@include2=#@#User.inc
Reveal=0
Muted=0
; Ring radius and stroke, in px.
R=17
RingWidth=3
DeviceW=170

@include3=#@#Styles.inc
@include4=#@#Fade.inc

; ---------- Measures ----------

[mAudio]
; Number: volume 0-100, or -1 when muted. String: output device name.
Measure=Plugin
Plugin=Win7AudioPlugin

[mVol]
Measure=Calc
Formula=mAudio
Substitute="-1":"off"
IfCondition=mAudio < 0
IfTrueAction=[!SetVariable Muted 1][!UpdateMeterGroup Reveal][!Redraw]
IfFalseAction=[!SetVariable Muted 0][!UpdateMeterGroup Reveal][!Redraw]

[mLevel]
Measure=Calc
Formula=Max(mAudio,0)
MinValue=0
MaxValue=100

; ---------- Meters ----------

[Track]
Meter=Shape
X=0
Y=0
Shape=Ellipse (#R#*#Scale#),(#R#*#Scale#),((#R#-#RingWidth#/2)*#Scale#) | Fill Color 0,0,0,1 | StrokeWidth (#RingWidth#*#Scale#) | Stroke Color #Ink#,#AlphaFaint#
DynamicVariables=1
MouseActionCursor=1
ToolTipText=Scroll to change, click to mute
LeftMouseUpAction=[!CommandMeasure mAudio "ToggleMute"][!Update]

[Level]
Meter=Roundline
MeasureName=mLevel
X=0
Y=0
W=(#R#*2*#Scale#)
H=(#R#*2*#Scale#)
StartAngle=4.71239
RotationAngle=6.28318
LineStart=((#R#-#RingWidth#)*#Scale#)
LineLength=(#R#*#Scale#)
Solid=1
LineColor=#Ink#,(#AlphaRest#+(#AlphaHover#-#AlphaRest#)*#Reveal#)
AntiAlias=1
DynamicVariables=1
Group=Reveal

[Pct]
Meter=String
MeterStyle=sReveal
MeasureName=mVol
FontSize=(#SizeXS#*#Scale#)
FontColor=#Ink#,(#AlphaHover#*Max(#Reveal#,#Muted#))
StringAlign=CenterCenter
X=(#R#*#Scale#)
Y=(#R#*#Scale#)
Text=%1
LeftMouseUpAction=[!CommandMeasure mAudio "ToggleMute"][!Update]

[Device]
Meter=String
MeterStyle=sReveal
MeasureName=mAudio
StringAlign=LeftCenter
ClipString=1
W=(#DeviceW#*#Scale#)
X=((#R#*2+10)*#Scale#)
Y=(#R#*#Scale#)
SolidColor=0,0,0,1
MouseActionCursor=1
ToolTipText=Click to switch output device
LeftMouseUpAction=[!CommandMeasure mAudio "ToggleNext"][!Update]
Text=%1
