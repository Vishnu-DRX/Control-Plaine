[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
MouseOverAction=[!CommandMeasure mFade "Stop 2"][!CommandMeasure mFade "Execute 1"]
MouseLeaveAction=[!CommandMeasure mFade "Stop 1"][!CommandMeasure mFade "Execute 2"]

[Metadata]
Name=Control-Plaine | Power
Author=Vishnu A
Information=Lock, sleep, restart and shut down. Hover an icon for its name. Restart and shut down ask for a second click. Uptime shows on hover, and stays visible as a reminder after a few days.
Version=1.0.0
License=CC BY-NC-SA 4.0

[Variables]
@include=#@#Theme.inc
@include2=#@#User.inc
Reveal=0
UpWarn=0
UpColor=#Ink#
; How long a restart or shut down waits for the second click (ms).
ConfirmTimeout=3000

@include3=#@#Styles.inc
@include4=#@#Fade.inc

; ---------- Measures ----------

[mUptime]
Measure=Uptime

[mPower]
Measure=Script
ScriptFile=#@#Scripts\Power.lua
UpdateDivider=30

[mDisarm]
Measure=Plugin
Plugin=ActionTimer
ActionList1=Wait #ConfirmTimeout# | Disarm
Disarm=[!CommandMeasure mPower "Disarm()"]

[mDoLock]
Measure=Plugin
Plugin=RunCommand
Program=rundll32.exe
Parameter=user32.dll,LockWorkStation
State=Hide

[mDoSleep]
; Sleeps, or hibernates if hibernation is turned on in Windows.
Measure=Plugin
Plugin=RunCommand
Program=rundll32.exe
Parameter=powrprof.dll,SetSuspendState 0,1,0
State=Hide

[mDoRestart]
Measure=Plugin
Plugin=RunCommand
Program=shutdown.exe
Parameter=/r /t 0
State=Hide

[mDoShutdown]
Measure=Plugin
Plugin=RunCommand
Program=shutdown.exe
Parameter=/s /t 0
State=Hide

; ---------- Meters ----------

[Hit]
; Invisible backing so the gaps between icons still count as hovering the skin.
Meter=Image
X=0
Y=0
W=((#IconSize#*4+#IconGap#*3)*#Scale#)
H=((#IconSize#+30)*#Scale#)
SolidColor=0,0,0,1

[Lock]
Meter=Image
MeterStyle=sIcon
ImageName=#@#Icons\lock.png
X=(0*(#IconSize#+#IconGap#)*#Scale#)
Y=0
MouseOverAction=[!CommandMeasure mPower "Hover('lock')"]
MouseLeaveAction=[!CommandMeasure mPower "Leave('lock')"]
LeftMouseUpAction=[!CommandMeasure mPower "Click('lock')"]

[Sleep]
Meter=Image
MeterStyle=sIcon
ImageName=#@#Icons\sleep.png
X=(1*(#IconSize#+#IconGap#)*#Scale#)
Y=0
MouseOverAction=[!CommandMeasure mPower "Hover('sleep')"]
MouseLeaveAction=[!CommandMeasure mPower "Leave('sleep')"]
LeftMouseUpAction=[!CommandMeasure mPower "Click('sleep')"]

[Restart]
Meter=Image
MeterStyle=sIcon
ImageName=#@#Icons\restart.png
X=(2*(#IconSize#+#IconGap#)*#Scale#)
Y=0
MouseOverAction=[!CommandMeasure mPower "Hover('restart')"]
MouseLeaveAction=[!CommandMeasure mPower "Leave('restart')"]
LeftMouseUpAction=[!CommandMeasure mPower "Click('restart')"]

[Shutdown]
Meter=Image
MeterStyle=sIcon
ImageName=#@#Icons\power.png
X=(3*(#IconSize#+#IconGap#)*#Scale#)
Y=0
MouseOverAction=[!CommandMeasure mPower "Hover('shutdown')"]
MouseLeaveAction=[!CommandMeasure mPower "Leave('shutdown')"]
LeftMouseUpAction=[!CommandMeasure mPower "Click('shutdown')"]

[Uptime]
Meter=String
MeterStyle=sReveal
FontColor=#UpColor#,(#AlphaHover#*Max(#Reveal#,#UpWarn#))
X=0
Y=((#IconSize#+10)*#Scale#)
Text=

[Name]
Meter=String
MeterStyle=sText
FontSize=(#SizeS#*#Scale#)
X=0
Y=((#IconSize#+10)*#Scale#)
Hidden=1
Text=
