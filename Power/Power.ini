; Control-Plaine | Power
; What it shows: four icons, hibernate (or sleep), shut down, restart, lock.
;   Hover an icon for its name and a SCHEDULE link (not for lock). Shut down
;   and restart need a second click within 3 s. SCHEDULE opens a picker:
;   scroll to pick 15 M to 24 H in 15 minute steps, then SET (the X closes it
;   without scheduling). While something
;   is scheduled its icon is accent, the countdown stays visible and CANCEL
;   undoes it. Only one schedule at a time; a new one replaces the old one.
;   Clicking hibernate, sleep, shut down or restart cancels any schedule first.
; How: shut down and restart use shutdown.exe /s or /r /t N, cancelled with
;   shutdown /a. Scheduled shut down closes open apps without asking (/t
;   implies /f). Hibernate and sleep cannot be delayed by shutdown.exe, so
;   they use a one-time Windows task (ControlPlaineHibernate or
;   ControlPlaineSleep) made by @Resources\Scripts\Power.ps1. A task missed
;   while the PC was asleep or off does not run later. The schedule is kept in
;   @Resources\State.inc, so it survives a refresh; a restart of the PC clears
;   a pending shut down or restart.
; Designed for: Windows 10/11, no admin rights needed. Hibernate must be
;   available (powercfg /a).
; Adjust (Settings > POWER): PowerFirst (hibernate or sleep), PowerConfirm
;   (second click for shut down and restart), PowerPickerStart (minutes).
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
Group=ControlPlaine
ContextTitle=Control-Plaine settings
ContextAction=[!ActivateConfig "#ROOTCONFIG#\Settings" "Power.ini"]
MouseOverAction=[!CommandMeasure mFade "Stop 2"][!CommandMeasure mFade "Execute 1"][!CommandMeasure mPower "Enter()"]
MouseLeaveAction=[!CommandMeasure mFade "Stop 1"][!CommandMeasure mFade "Execute 2"][!CommandMeasure mPower "Exit()"]

[Metadata]
Name=Control-Plaine | Power
Author=Vishnu A
Information=Hibernate, shut down, restart and lock, with a second click for shut down and restart, and a schedule from 15 minutes to 24 hours with a countdown.
Version=2.0.0
License=CC BY-NC-SA 4.0

[Variables]
@include=#@#Theme.inc
@include2=#@#Defaults.inc
@include3=#ROOTCONFIGPATH#Power\Defaults.inc
@include4=#@#User.inc
@include5=#@#State.inc
; Skin-local (not settings).
; How long shut down and restart wait for the second click (ms).
ConfirmTimeout=3000
; How long the picker or an error stays after the mouse leaves (ms).
PickerTimeout=3000
; Layout at scale 1 (px): icon pitch, side margin, rows.
Pitch=44
Margin=10
IconY=20
LinkY=54
PickLinkY=58
SkinW=176
SkinH=72
; Set by Power.lua.
Tint1=255,255,255
Tint2=255,255,255
Tint3=255,255,255
Tint4=255,255,255
Alpha1=153
Alpha2=153
Alpha3=153
Alpha4=153
LabelRGB=255,255,255
LabelKeep=0
; 1 while a schedule is pending: CANCEL stays visible at rest.
LinkKeep=0
PickBoxW=80
PickBoxH=30
ShutArgs=/a
PSArgs=query hibernate
@include6=#@#Core.inc
@include7=#@#Styles.inc

; ---------- Measures ----------

[mUptime]
; Used to tell whether the PC restarted since a shut down was scheduled.
Measure=Uptime

[mPower]
Measure=Script
ScriptFile=#@#Scripts\Power.lua

[mTimer]
Measure=Plugin
Plugin=ActionTimer
ActionList1=Wait #ConfirmTimeout# | Disarm
ActionList2=Wait #PickerTimeout# | ClosePicker
ActionList3=Wait #PickerTimeout# | ClearError
Disarm=[!CommandMeasure mPower "Disarm()"]
ClosePicker=[!CommandMeasure mPower "ClosePicker()"]
ClearError=[!CommandMeasure mPower "ClearError()"]
IgnoreWarnings=1

[mShut]
; shutdown.exe with the arguments Power.lua puts in ShutArgs.
Measure=Plugin
Plugin=RunCommand
; Through cmd so the exit code is printed (RunCommand's value is not the
; exit code); !errorlevel! needs delayed expansion (/v:on).
Program=cmd.exe
Parameter=/v:on /c "shutdown.exe #ShutArgs# & echo !errorlevel!"
OutputType=ANSI
State=Hide
DynamicVariables=1
FinishAction=[!CommandMeasure mPower "Done()"]

[mPS]
; Power.ps1 (sleep now, schedule, cancel or check a hibernate or sleep task).
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "#@#Scripts\Power.ps1" #PSArgs#
OutputType=ANSI
State=Hide
DynamicVariables=1
FinishAction=[!CommandMeasure mPower "Done()"]

[mLock]
Measure=Plugin
Plugin=RunCommand
Program=rundll32.exe
Parameter=user32.dll,LockWorkStation
State=Hide

; ---------- Meters ----------

[Hit]
; Invisible backing so the whole skin counts as hovered.
Meter=Image
MeterStyle=sHit
X=0
Y=0
W=(#SkinW#*#Scale#)
H=(#SkinH#*#Scale#)

[Col1]
; Hover column for icon 1: covers label, icon and link rows so moving from
; the icon to its SCHEDULE link never counts as leaving it.
Meter=Image
MeterStyle=sHit
X=((#Margin#+0*#Pitch#-#Pitch#/2+#IconSize#/2)*#Scale#)
Y=0
W=(#Pitch#*#Scale#)
H=(#SkinH#*#Scale#)
Group=Main
MouseOverAction=[!CommandMeasure mPower "Over('c1')"]
MouseLeaveAction=[!CommandMeasure mPower "Out('c1')"]

[Icon1]
; Hibernate, or Sleep when PowerFirst=sleep (Lua swaps the image).
Meter=Image
MeterStyle=sIcon
ImageName=#@#Icons\power-hibernate.png
X=((#Margin#+0*#Pitch#-#IconPad#)*#Scale#)
Y=((#IconY#-#IconPad#)*#Scale#)
ImageTint=#Tint1#
ImageAlpha=#Alpha1#
Group=Main
MouseOverAction=[!CommandMeasure mPower "Over('i1')"]
MouseLeaveAction=[!CommandMeasure mPower "Out('i1')"]
LeftMouseUpAction=[!CommandMeasure mPower "Click(1)"]

[Col2]
; Hover column for icon 2: covers label, icon and link rows so moving from
; the icon to its SCHEDULE link never counts as leaving it.
Meter=Image
MeterStyle=sHit
X=((#Margin#+1*#Pitch#-#Pitch#/2+#IconSize#/2)*#Scale#)
Y=0
W=(#Pitch#*#Scale#)
H=(#SkinH#*#Scale#)
Group=Main
MouseOverAction=[!CommandMeasure mPower "Over('c2')"]
MouseLeaveAction=[!CommandMeasure mPower "Out('c2')"]

[Icon2]
; Shut down
Meter=Image
MeterStyle=sIcon
ImageName=#@#Icons\power-shutdown.png
X=((#Margin#+1*#Pitch#-#IconPad#)*#Scale#)
Y=((#IconY#-#IconPad#)*#Scale#)
ImageTint=#Tint2#
ImageAlpha=#Alpha2#
Group=Main
MouseOverAction=[!CommandMeasure mPower "Over('i2')"]
MouseLeaveAction=[!CommandMeasure mPower "Out('i2')"]
LeftMouseUpAction=[!CommandMeasure mPower "Click(2)"]

[Col3]
; Hover column for icon 3: covers label, icon and link rows so moving from
; the icon to its SCHEDULE link never counts as leaving it.
Meter=Image
MeterStyle=sHit
X=((#Margin#+2*#Pitch#-#Pitch#/2+#IconSize#/2)*#Scale#)
Y=0
W=(#Pitch#*#Scale#)
H=(#SkinH#*#Scale#)
Group=Main
MouseOverAction=[!CommandMeasure mPower "Over('c3')"]
MouseLeaveAction=[!CommandMeasure mPower "Out('c3')"]

[Icon3]
; Restart
Meter=Image
MeterStyle=sIcon
ImageName=#@#Icons\power-restart.png
X=((#Margin#+2*#Pitch#-#IconPad#)*#Scale#)
Y=((#IconY#-#IconPad#)*#Scale#)
ImageTint=#Tint3#
ImageAlpha=#Alpha3#
Group=Main
MouseOverAction=[!CommandMeasure mPower "Over('i3')"]
MouseLeaveAction=[!CommandMeasure mPower "Out('i3')"]
LeftMouseUpAction=[!CommandMeasure mPower "Click(3)"]

[Col4]
; Hover column for icon 4: covers label, icon and link rows so moving from
; the icon to its SCHEDULE link never counts as leaving it.
Meter=Image
MeterStyle=sHit
X=((#Margin#+3*#Pitch#-#Pitch#/2+#IconSize#/2)*#Scale#)
Y=0
W=(#Pitch#*#Scale#)
H=(#SkinH#*#Scale#)
Group=Main
MouseOverAction=[!CommandMeasure mPower "Over('c4')"]
MouseLeaveAction=[!CommandMeasure mPower "Out('c4')"]

[Icon4]
; Lock
Meter=Image
MeterStyle=sIcon
ImageName=#@#Icons\power-lock.png
X=((#Margin#+3*#Pitch#-#IconPad#)*#Scale#)
Y=((#IconY#-#IconPad#)*#Scale#)
ImageTint=#Tint4#
ImageAlpha=#Alpha4#
Group=Main
MouseOverAction=[!CommandMeasure mPower "Over('i4')"]
MouseLeaveAction=[!CommandMeasure mPower "Out('i4')"]
LeftMouseUpAction=[!CommandMeasure mPower "Click(4)"]

[Label]
; Name of the hovered icon, CLICK AGAIN, the countdown or an error.
; Power.lua sets the text, colour and X (centred over the icon).
Meter=String
MeterStyle=sDetail
FontColor=#LabelRGB#,(#LabelKeep#*#AlphaValue#+(#AlphaHover#-#LabelKeep#*#AlphaValue#)*#Reveal#)
FontEffectColor=#ShadowRGB#,((#LabelKeep#*#AlphaValue#+(#AlphaHover#-#LabelKeep#*#AlphaValue#)*#Reveal#)*#ShadowK#)
InlineSetting=CharacterSpacing | 0 | (#TrackDetail#*#Scale#)
X=0
Y=0
Group=Reveal | Main
Text=

[Link]
; SCHEDULE or CANCEL under the hovered (or scheduled) icon.
Meter=String
MeterStyle=sLink
FontColor=#Ink#,(#LinkKeep#*#AlphaValue#+(#AlphaHover#-#LinkKeep#*#AlphaValue#)*#Reveal#)
FontEffectColor=#ShadowRGB#,((#LinkKeep#*#AlphaValue#+(#AlphaHover#-#LinkKeep#*#AlphaValue#)*#Reveal#)*#ShadowK#)
InlineSetting=CharacterSpacing | 0 | (#TrackDetail#*#Scale#)
X=0
Y=(#LinkY#*#Scale#)
Group=Reveal | Main
Hidden=1
Text=SCHEDULE
MouseOverAction=[!CommandMeasure mPower "Over('link')"]
MouseLeaveAction=[!CommandMeasure mPower "Out('link')"]
LeftMouseUpAction=[!CommandMeasure mPower "LinkClick()"]

; ---------- Schedule picker (hidden until SCHEDULE is clicked) ----------

[PickHit]
; Scroll anywhere on the skin to change the time.
Meter=Image
MeterStyle=sHit
X=0
Y=0
W=(#SkinW#*#Scale#)
H=(#SkinH#*#Scale#)
Group=Pick
Hidden=1
MouseScrollUpAction=[!CommandMeasure mPower "PickStep(15)"]
MouseScrollDownAction=[!CommandMeasure mPower "PickStep(-15)"]

[PickTitle]
Meter=String
MeterStyle=sDetail
InlineSetting=CharacterSpacing | 0 | (#TrackDetail#*#Scale#)
X=0
Y=0
Group=Reveal | Pick
Hidden=1
Text=SHUT DOWN IN

[PickBox]
; 1px outline round the value, as in the Settings value boxes.
; Power.lua sets X, PickBoxW and PickBoxH around PickValue.
Meter=Shape
X=0
Y=(18*#Scale#)
Shape=Rectangle 0.5,0.5,#PickBoxW#,#PickBoxH#,(6*#Scale#) | Fill Color 0,0,0,1 | StrokeWidth 1 | Stroke Color #Ink#,77
AntiAlias=1
DynamicVariables=1
Group=Pick
Hidden=1
MouseScrollUpAction=[!CommandMeasure mPower "PickStep(15)"]
MouseScrollDownAction=[!CommandMeasure mPower "PickStep(-15)"]

[PickValue]
Meter=String
MeterStyle=sValue
InlineSetting=CharacterSpacing | 0 | (#TrackValue#*#Scale#)
X=0
Y=(20*#Scale#)
Group=Reveal | Pick
Hidden=1
Text=1 H
MouseScrollUpAction=[!CommandMeasure mPower "PickStep(15)"]
MouseScrollDownAction=[!CommandMeasure mPower "PickStep(-15)"]

[PickSet]
Meter=String
MeterStyle=sLink
InlineSetting=CharacterSpacing | 0 | (#TrackDetail#*#Scale#)
X=0
Y=(#PickLinkY#*#Scale#)
Group=Reveal | Pick
Hidden=1
Text=SET
LeftMouseUpAction=[!CommandMeasure mPower "SetSchedule()"]

[PickClose]
; X in the top-right corner: closes the picker without scheduling.
Meter=Shape
X=((#SkinW#-18)*#Scale#)
Y=0
Shape=Rectangle 0,0,(18*#Scale#),(18*#Scale#) | Fill Color 0,0,0,1 | StrokeWidth 0
Shape2=Line (5*#Scale#),(5*#Scale#),(13*#Scale#),(13*#Scale#) | StrokeWidth (1.5*#Scale#) | Stroke Color #Ink#,(#AlphaDetail#+(#AlphaHover#-#AlphaDetail#)*#Reveal#) | StrokeStartCap Round | StrokeEndCap Round
Shape3=Line (13*#Scale#),(5*#Scale#),(5*#Scale#),(13*#Scale#) | StrokeWidth (1.5*#Scale#) | Stroke Color #Ink#,(#AlphaDetail#+(#AlphaHover#-#AlphaDetail#)*#Reveal#) | StrokeStartCap Round | StrokeEndCap Round
AntiAlias=1
DynamicVariables=1
MouseActionCursor=1
ToolTipText=Cancel
Group=Reveal | Pick
Hidden=1
LeftMouseUpAction=[!CommandMeasure mPower "ClosePicker()"]
