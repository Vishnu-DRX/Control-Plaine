; Control-Plaine | Playnite
; What it shows: the white controller icon; hover brightens it and adds PLAYNITE.
; Click opens Playnite.
; Designed for: Playnite (playnite.link), desktop mode.
; Adjust (Settings > PLAYNITE, or User.inc):
;   PlayniteTheme=auto, dark or light   colours for this skin
;   PlayniteAlign=left or right   which screen edge it sits on (art first, or
;                               label first with the art last)
;   PlayniteDetails=hover or always   when the PLAYNITE label shows
;   PlaynitePath=...            the program to start; point it at any other
;                               .exe to launch something else
;   PlayniteSkipSplash=1 or 0   start without Playnite's splash screen
[Rainmeter]
; PlayniteTooltips=0 hides every tooltip of this skin (see Core.inc).
ToolTipHidden=#TipHidden[#PlayniteTooltips]#
Update=1000
AccurateText=1
DynamicWindowSize=1
Group=ControlPlaine
ContextTitle=Control-Plaine settings
ContextAction=[!ActivateConfig "#ROOTCONFIG#\Settings" "Playnite.ini"]
MouseOverAction=[!CommandMeasure mFade "Stop 2"][!CommandMeasure mFade "Execute 1"]
MouseLeaveAction=[!CommandMeasure mFade "Stop 1"][!CommandMeasure mFade "Execute 2"]

[Metadata]
Name=Control-Plaine | Playnite
Author=Vishnu A
Information=Opens Playnite.
Version=2.0.0
License=CC BY-NC-SA 4.0

[Variables]
@include=#@#Theme.inc
@include2=#@#Defaults.inc
@include3=#ROOTCONFIGPATH#Playnite\Defaults.inc
@include4=#@#User.inc
@include5=#@#State.inc
; Read by Core.inc (Scripts\Core.lua) to arrange the skin; see specs/alignment.md.
SkinSide=#PlayniteAlign#
SkinDetails=#PlayniteDetails#
SkinTheme=#PlayniteTheme#
; Command-line argument per PlayniteSkipSplash value.
SplashArg1=--hidesplashscreen
SplashArg0=
; Controller art (docs\icons\playnite-controller-src.png, 764 x 511), stored
; pre-shrunk to 49 x 33 so Rainmeter shows it 1:1 (resampling made it soft).
ArtW=49
ArtH=33
@include6=#@#Core.inc
; Text only is boosted; the controller art stays at its pre-shrunk size.
Sz=(#Scale#*#SizeBoost#)
@include7=#@#Styles.inc

; ---------- Measures ----------

[mBlocked]
; A missing Playnite program (PlayniteNeedBlocked=1, set by the needs check in
; Core.lua) hides the whole skin through the shared mVisible (Core.inc).
Measure=Calc
Formula=#PlayniteNeedBlocked#
DynamicVariables=1
IfCondition=mBlocked = 1
IfTrueAction=[!SetVariable SelfHidden 1][!UpdateMeasure mVisible]
IfFalseAction=[!SetVariable SelfHidden 0][!UpdateMeasure mVisible]

; ---------- Meters ----------

[RefLabel]
; Invisible copy of the label. The label never changes, so its width fixes the
; box: Hit is art + gap + this width on both sides. Its X keeps the text inside
; the box when right-aligned (an upper bound on the label width), and it only
; sets the width, it is never seen.
Meter=String
MeterStyle=sReveal
FontColor=0,0,0,0
FontEffectColor=0,0,0,0
InlineSetting=CharacterSpacing | (#Lead#*#TrackDetail#*#Scale#) | (#Trail#*#TrackDetail#*#Scale#)
X=(#Mir#*120*#Scale#)
Y=(#ArtH#*#Scale#/2)
StringAlign=#TA#
Text=PLAYNITE

[Hit]
Meter=Image
MeterStyle=sHit
X=0
Y=0
W=(Round((#ArtW#+8)*#Scale#+[RefLabel:W]))
H=(#ArtH#*#Scale#)

[Icon]
Meter=Image
MeterStyle=sIconFade
ImageName=#@#Icons\playnite-controller.png
W=(#ArtW#*#Scale#)
H=(#ArtH#*#Scale#)
PreserveAspectRatio=1
X=(#Mir#*Round([Hit:W]-#ArtW#*#Scale#))
Y=0
ToolTipText=Open Playnite
LeftMouseUpAction=["#PlaynitePath#" [#SplashArg[#PlayniteSkipSplash]]]

[Label]
Meter=String
MeterStyle=sReveal
InlineSetting=CharacterSpacing | (#Lead#*#TrackDetail#*#Scale#) | (#Trail#*#TrackDetail#*#Scale#)
X=(#Mir#*Round([Hit:W]-(#ArtW#+8)*#Scale#)+(1-#Mir#)*(#ArtW#+8)*#Scale#)
Y=(#ArtH#*#Scale#/2)
StringAlign=#TA#
SolidColor=0,0,0,1
MouseActionCursor=1
Text=PLAYNITE
ToolTipText=Open Playnite
LeftMouseUpAction=["#PlaynitePath#" [#SplashArg[#PlayniteSkipSplash]]]
