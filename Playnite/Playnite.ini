[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
MouseOverAction=[!CommandMeasure mFade "Stop 2"][!CommandMeasure mFade "Execute 1"]
MouseLeaveAction=[!CommandMeasure mFade "Stop 1"][!CommandMeasure mFade "Execute 2"]

[Metadata]
Name=Control-Plaine | Playnite
Author=Vishnu A
Information=Opens Playnite. The path lives in @Resources\User.inc.
Version=1.0.0
License=CC BY-NC-SA 4.0

[Variables]
@include=#@#Theme.inc
@include2=#@#User.inc
Reveal=0

@include3=#@#Styles.inc
@include4=#@#Fade.inc

; ---------- Meters ----------

[Icon]
Meter=Image
MeterStyle=sIconFade
ImageName=#@#Icons\gamepad.png
X=0
Y=0
LeftMouseUpAction=["#PlaynitePath#" --hidesplashscreen]

[Label]
Meter=String
MeterStyle=sReveal
X=((#IconSize#+8)*#Scale#)
Y=((#IconSize#/2)*#Scale#)
StringAlign=LeftCenter
SolidColor=0,0,0,1
LeftMouseUpAction=["#PlaynitePath#" --hidesplashscreen]
MouseActionCursor=1
Text=Playnite
