; Control-Plaine | Uptime
; What it shows: how long Windows has been running. Invisible until hovered
;   (UPTIME over 14 H 32 M). Past UptimeWarnDays it shows itself in orange:
;   RESTART RECOMMENDED over 6 DAYS 3 H.
; Note: the count matches Task Manager and includes time asleep. With Fast
;   Startup on, Shut down does not reset it (only Restart does); turn Fast
;   Startup off in Power Options > Choose what the power buttons do if Shut
;   down should reset it.
; Click: opens UptimeClick, Task Manager by default (the uptime there is the
;   same number).
; Designed for: Windows 10/11, any PC.
; Adjust (Settings > UPTIME): UptimeTheme (auto, dark or light: colours for
;   this skin), UptimeAlign (left or right), UptimeDetails
;   (hover or always), UptimeWarnDays (days before the reminder), UptimeClick
;   (what a click opens).
[Rainmeter]
; UptimeTooltips=0 hides every tooltip of this skin (see Core.inc).
ToolTipHidden=#TipHidden[#UptimeTooltips]#
Update=1000
AccurateText=1
DynamicWindowSize=1
Group=ControlPlaine
ContextTitle=Control-Plaine settings
ContextAction=[!ActivateConfig "#ROOTCONFIG#\Settings" "Uptime.ini"]
MouseOverAction=[!UpdateMeasure mScript][!CommandMeasure mFade "Stop 2"][!CommandMeasure mFade "Execute 1"]
MouseLeaveAction=[!CommandMeasure mFade "Stop 1"][!CommandMeasure mFade "Execute 2"]

[Metadata]
Name=Control-Plaine | Uptime
Author=Vishnu A
Information=Uptime on hover. Shows itself as a restart reminder after a few days.
Version=2.0.0
License=MIT

[Variables]
@include=#@#Theme.inc
@include2=#@#Defaults.inc
@include3=#ROOTCONFIGPATH#Uptime\Defaults.inc
@include4=#@#User.inc
@include5=#@#State.inc
; Read by Core.inc (Scripts\Core.lua) to arrange the skin; see specs/alignment.md.
SkinSide=#UptimeAlign#
SkinDetails=#UptimeDetails#
SkinTheme=#UptimeTheme#
; Skin-local (set by Uptime.lua): 1 = visible at rest, and the text colour.
Shown=0
UpRGB=#Ink#
@include6=#@#Core.inc
; The fixed box. Left and right use the same one, so flipping the side never
; changes the footprint or hit area. Wide enough for RESTART RECOMMENDED and
; the longest value (99 DAYS 23 H) at any Scale.
BoxW=(Round(200*#Scale#))
; What a click does: opens UptimeClick while UptimeHasClick=1 (the needs check,
; Needs.lua, sets it), nothing while it is 0.
ClickAct1=["#UptimeClick#"]
ClickAct0=
@include7=#@#Styles.inc

; ---------- Measures ----------

[mUptime]
Measure=Uptime

[mScript]
; Sets the text and the state on every run, not only when something changes
; (the old skin used IfTrueAction, which only fires on a change, and went stale).
Measure=Script
ScriptFile=#@#Scripts\Uptime.lua
UpdateDivider=15

; ---------- Meters ----------

[Hit]
; Invisible but hoverable: alpha 1, not 0.
Meter=Image
MeterStyle=sHit
X=0
Y=0
W=#BoxW#
H=([UpValue:Y]+[UpValue:H])
ToolTipText=Open Task Manager
ToolTipHidden=(1-#UptimeHasClick#)
LeftMouseUpAction=#ClickAct[#UptimeHasClick]#
MouseActionCursor=#UptimeHasClick#

[UpLabel]
Meter=String
MeterStyle=sDetail
FontColor=#UpRGB#,(#Shown#*#AlphaDetail#+(#AlphaHover#-#Shown#*#AlphaDetail#)*#Reveal#)
FontEffectColor=#ShadowRGB#,((#Shown#*#AlphaDetail#+(#AlphaHover#-#Shown#*#AlphaDetail#)*#Reveal#)*#ShadowK#)
InlineSetting=CharacterSpacing | (#Lead#*#TrackDetail#*#Scale#) | (#Trail#*#TrackDetail#*#Scale#)
X=(#Mir#*#BoxW#)
Y=0
StringAlign=#TAT#
Text=UPTIME

[UpValue]
Meter=String
MeterStyle=sValue
FontColor=#UpRGB#,(#Shown#*#AlphaValue#+(#AlphaHover#-#Shown#*#AlphaValue#)*#Reveal#)
FontEffectColor=#ShadowRGB#,((#Shown#*#AlphaValue#+(#AlphaHover#-#Shown#*#AlphaValue#)*#Reveal#)*#ShadowK#)
InlineSetting=CharacterSpacing | (#Lead#*#TrackValue#*#Scale#) | (#Trail#*#TrackValue#*#Scale#)
X=(#Mir#*#BoxW#)
Y=(2*#Scale#)R
StringAlign=#TAT#
Text=
