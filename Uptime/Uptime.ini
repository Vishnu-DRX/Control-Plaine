; Control-Plaine | Uptime
; What it shows: how long Windows has been running. Invisible until hovered
;   (UPTIME over 14 H 32 M). Past UptimeWarnDays it shows itself in orange:
;   RESTART RECOMMENDED over 6 DAYS 3 H.
; Note: the count matches Task Manager and includes time asleep. With Fast
;   Startup on, Shut down does not reset it (only Restart does); turn Fast
;   Startup off in Power Options > Choose what the power buttons do if Shut
;   down should reset it.
; Designed for: Windows 10/11, any PC.
; Adjust (Settings > UPTIME): UptimeWarnDays (days before the reminder),
;   UptimeAlways (1 = always visible).
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
Group=ControlPlaine
ContextTitle=Control-Plaine settings
ContextAction=[!ActivateConfig "#ROOTCONFIG#\Settings" "Uptime.ini"]
MouseOverAction=[!UpdateMeasure mScript][!CommandMeasure mFade "Stop 2"][!CommandMeasure mFade "Execute 1"]
MouseLeaveAction=[!CommandMeasure mFade "Stop 1"][!CommandMeasure mFade "Execute 2"]

[Metadata]
Name=Control-Plaine | Uptime
Author=Vishnu A
Information=Uptime on hover. Shows itself as a restart reminder after a few days.
Version=2.0.0
License=CC BY-NC-SA 4.0

[Variables]
@include=#@#Theme.inc
@include2=#@#Defaults.inc
@include3=#ROOTCONFIGPATH#Uptime\Defaults.inc
@include4=#@#User.inc
@include5=#@#State.inc
; Skin-local (set by Uptime.lua): 1 = visible at rest, and the text colour.
Shown=0
UpRGB=255,255,255
@include6=#@#Core.inc
@include7=#@#Styles.inc

; ---------- Measures ----------

[mUptime]
Measure=Uptime

[mScript]
; Sets the text and the state on every run, not only when something changes
; (the old skin used IfTrueAction, which only fires on a change, and went stale).
Measure=Script
ScriptFile=#@#Scripts\Uptime.lua
UpdateDivider=15

; ---------- Meters ----------

[Hit]
; Invisible but hoverable: alpha 1, not 0.
Meter=Image
MeterStyle=sHit
X=0
Y=0
W=(Max(120*#Scale#,Max([UpValue:W],[UpLabel:W])))
H=([UpValue:Y]+[UpValue:H])

[UpLabel]
Meter=String
MeterStyle=sDetail
FontColor=#UpRGB#,(#Shown#*#AlphaDetail#+(#AlphaHover#-#Shown#*#AlphaDetail#)*#Reveal#)
FontEffectColor=#ShadowRGB#,((#Shown#*#AlphaDetail#+(#AlphaHover#-#Shown#*#AlphaDetail#)*#Reveal#)*#ShadowK#)
InlineSetting=CharacterSpacing | 0 | (#TrackDetail#*#Scale#)
X=0
Y=0
Text=UPTIME

[UpValue]
Meter=String
MeterStyle=sValue
FontColor=#UpRGB#,(#Shown#*#AlphaValue#+(#AlphaHover#-#Shown#*#AlphaValue#)*#Reveal#)
FontEffectColor=#ShadowRGB#,((#Shown#*#AlphaValue#+(#AlphaHover#-#Shown#*#AlphaValue#)*#Reveal#)*#ShadowK#)
InlineSetting=CharacterSpacing | 0 | (#TrackValue#*#Scale#)
X=0
Y=(2*#Scale#)R
Text=
