[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
MouseOverAction=[!CommandMeasure mFade "Stop 2"][!CommandMeasure mFade "Execute 1"]
MouseLeaveAction=[!CommandMeasure mFade "Stop 1"][!CommandMeasure mFade "Execute 2"]

[Metadata]
Name=Control-Plaine | Day-Date
Author=Vishnu A
Information=Day name with the date under it. Hover to see the time and week number.
Version=1.0.0
License=CC BY-NC-SA 4.0

[Variables]
@include=#@#Theme.inc
@include2=#@#User.inc
Reveal=0
; Right edge of the text. Text grows to the left from here.
Right=805
DaySpacing=9

@include3=#@#Styles.inc
@include4=#@#Fade.inc

; ---------- Measures ----------

[mDay]
Measure=Time
Format=%A

[mDate]
Measure=Time
Format=%#d  %B  %Y

[mTime]
Measure=Time
Format=#TimeFormat#

[mWeek]
Measure=Time
Format=%V

; ---------- Meters ----------

[Day]
Meter=String
MeterStyle=sText
MeasureName=mDay
FontFace=#FontDisplay#
FontSize=(#SizeXL#*#Scale#)
StringAlign=Right
StringCase=Upper
InlineSetting=CharacterSpacing | (#DaySpacing#*#Scale#) | (#DaySpacing#*#Scale#)
X=(#Right#*#Scale#)
Y=0
SolidColor=0,0,0,1
Text=%1

[Date]
Meter=String
MeterStyle=sText
MeasureName=mDate
FontSize=(#SizeM#*#Scale#)
StringAlign=Right
StringCase=Upper
InlineSetting=CharacterSpacing | (2*#Scale#) | (2*#Scale#)
X=((#Right#-#DaySpacing#-8)*#Scale#)
Y=(4*#Scale#)R
SolidColor=0,0,0,1
Text=%1

[Detail]
Meter=String
MeterStyle=sReveal
MeasureName=mTime
MeasureName2=mWeek
StringAlign=Right
StringCase=Upper
InlineSetting=CharacterSpacing | (2*#Scale#) | (2*#Scale#)
X=((#Right#-#DaySpacing#-8)*#Scale#)
Y=(6*#Scale#)R
SolidColor=0,0,0,1
Text=%1    Week %2
