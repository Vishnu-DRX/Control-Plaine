; Control-Plaine | DayDate
; What it shows: the day name over the date. Click to open the calendar.
; Designed for: any Windows PC, nothing to install.
; Adjust (Settings > DAY-DATE, or User.inc):
;   DayDateAlign=right or left
;   DayDateClick              what a click opens (DayDate\Defaults.inc)
; The text lines up to a fixed edge sized for the widest day name (DayRef below),
; so the skin does not shift at midnight. Using another language? Set DayRef
; to its widest day name.
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
Group=ControlPlaine
ContextTitle=Control-Plaine settings
ContextAction=[!ActivateConfig "#ROOTCONFIG#\Settings" "DayDate.ini"]
MouseOverAction=[!CommandMeasure mFade "Stop 2"][!CommandMeasure mFade "Execute 1"]
MouseLeaveAction=[!CommandMeasure mFade "Stop 1"][!CommandMeasure mFade "Execute 2"]

[Metadata]
Name=Control-Plaine | DayDate
Author=Vishnu A
Information=Day name over the date. Click to open the calendar.
Version=2.0.0
License=CC BY-NC-SA 4.0

[Variables]
@include=#@#Theme.inc
@include2=#@#Defaults.inc
@include3=#ROOTCONFIGPATH#DayDate\Defaults.inc
@include4=#@#User.inc
@include5=#@#State.inc
; Widest day name; sets the fixed edge.
DayRef=WEDNESDAY
; Per alignment (picked with [#Name[#DayDateAlign]]): where the edge is, and
; which side of each letter gets the tracking (right-aligned text puts it
; before the letter so the last letter touches the edge).
Anchorright=1
Anchorleft=0
Leadright=1
Trailright=0
Leadleft=0
Trailleft=1
; Vertical gap between the lines (px at scale 1).
DateGap=0
@include6=#@#Core.inc
@include7=#@#Styles.inc

; ---------- Measures ----------

[mDay]
Measure=Time
Format=%A

[mDate]
Measure=Time
Format=%#d  %B  %Y

; ---------- Meters ----------

[Hit]
Meter=Image
MeterStyle=sHit
X=0
Y=0
W=[RefDay:W]
H=([Date:Y]+[Date:H])
MouseActionCursor=1
ToolTipText=Open the calendar
LeftMouseUpAction=["#DayDateClick#"]

[RefDay]
; Invisible copy of the widest day name: its width is the skin's fixed edge.
Meter=String
MeterStyle=sDisplay
FontColor=0,0,0,0
FontEffectColor=0,0,0,0
StringEffect=None
X=0
Y=0
InlineSetting=CharacterSpacing | (#TrackDisplay#*#Scale#) | 0
Text=#DayRef#

[Day]
Meter=String
MeterStyle=sDisplay
MeasureName=mDay
StringAlign=#DayDateAlign#
X=([#Anchor[#DayDateAlign]]*[RefDay:W])
Y=0
InlineSetting=CharacterSpacing | ([#Lead[#DayDateAlign]]*#TrackDisplay#*#Scale#) | ([#Trail[#DayDateAlign]]*#TrackDisplay#*#Scale#)
Text=%1

[Date]
Meter=String
MeterStyle=sTitle
MeasureName=mDate
StringAlign=#DayDateAlign#
X=([#Anchor[#DayDateAlign]]*[RefDay:W])
Y=(#DateGap#*#Scale#)R
InlineSetting=CharacterSpacing | ([#Lead[#DayDateAlign]]*#TrackTitle#*#Scale#) | ([#Trail[#DayDateAlign]]*#TrackTitle#*#Scale#)
Text=%1
