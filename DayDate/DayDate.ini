; Control-Plaine | DayDate
; What it shows: the day name over the date. Click to open the calendar.
; Designed for: any Windows PC, nothing to install.
; Adjust (Settings > DAY-DATE, or User.inc):
;   DayDateAlign=left or right   which edge the two lines line up to
;   DayDateDetails=hover or always   hover: brightness rests dim and rises on
;                                hover (as always). always: both lines stay at
;                                the hover brightness (suite-wide meaning)
;   DayDateDateLine=show or hover    show: the small date line is always
;                                visible (default). hover: it is hidden until
;                                the mouse is over the skin.
;   DayDateTheme=auto, dark or light   colours: auto follows the global Theme
;   DayDateClick              what a click opens (DayDate\Defaults.inc)
; DetailsAll (General) overrides DayDateDetails only. It does not hide the date
; line; DetailsAll=always lifts Reveal to 1, so the date line then shows too.
; The text lines up to a fixed edge sized for the widest day name (DayRef below),
; so the skin does not shift at midnight. Using another language? Set DayRef
; to its widest day name.
[Rainmeter]
; DayDateTooltips=0 hides every tooltip of this skin (see Core.inc).
ToolTipHidden=#TipHidden[#DayDateTooltips]#
Update=1000
AccurateText=1
DynamicWindowSize=1
Group=ControlPlaine
ContextTitle=Control-Plaine settings
ContextAction=[!ActivateConfig "#ROOTCONFIG#\Settings" "DayDate.ini"]
MouseOverAction=[!CommandMeasure mFade "Stop 2"][!CommandMeasure mFade "Execute 1"]
MouseLeaveAction=[!CommandMeasure mFade "Stop 1"][!CommandMeasure mFade "Execute 2"]

[Metadata]
Name=Control-Plaine | DayDate
Author=Vishnu A
Information=Day name over the date. Click to open the calendar.
Version=2.0.1
License=MIT

[Variables]
@include=#@#Theme.inc
@include2=#@#Defaults.inc
@include3=#ROOTCONFIGPATH#DayDate\Defaults.inc
@include4=#@#User.inc
@include5=#@#State.inc
; Widest day name; sets the fixed edge.
DayRef=WEDNESDAY
; Read by Core.inc (Scripts\Core.lua) to arrange the skin; see specs/alignment.md.
SkinSide=#DayDateAlign#
SkinDetails=#DayDateDetails#
SkinTheme=#DayDateTheme#
; Rest level of the date line (1 = as the day name, 0 = hidden until hover),
; picked with [#DateRest[#DayDateDateLine]].
DateRestshow=1
DateResthover=0
; Vertical gap between the lines (px at scale 1).
DateGap=0
; What a click does: the run action while DayDateHasClick=1 (the needs check,
; Needs.lua, sets it), nothing while it is 0.
ClickAct1=[!CommandMeasure mClick "Run"]
ClickAct0=
@include6=#@#Core.inc
@include7=#@#Styles.inc

; ---------- Measures ----------

[mDay]
Measure=Time
Format=%A

[mDate]
Measure=Time
Format=%#d  %B  %Y

[mClick]
; Opens DayDateClick through Calendar.ps1: "calendar" presses Win+N (the
; Windows calendar), anything else is opened as a program, file or URI.
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -NonInteractive -ExecutionPolicy Bypass -WindowStyle Hidden -File "#@#Scripts\Calendar.ps1" -Target "#DayDateClick#"
State=Hide
Disabled=(1-#DayDateHasClick#)
DynamicVariables=1

; ---------- Meters ----------

[Hit]
Meter=Image
MeterStyle=sHit
X=0
Y=0
W=[RefDay:W]
H=([Date:Y]+[Date:H])
MouseActionCursor=#DayDateHasClick#
ToolTipText=Open calendar
ToolTipHidden=(Clamp((1-#DayDateHasClick#)+#TipHidden[#DayDateTooltips]#,0,1))
LeftMouseUpAction=#ClickAct[#DayDateHasClick]#

[RefDay]
; Invisible copy of the widest day name: its width is the skin's fixed edge.
Meter=String
MeterStyle=sDisplay
FontColor=0,0,0,0
FontEffectColor=0,0,0,0
StringEffect=None
X=0
Y=0
InlineSetting=CharacterSpacing | (#TrackDisplay#*#Scale#) | 0
Text=#DayRef#

[Day]
Meter=String
MeterStyle=sDisplay
MeasureName=mDay
StringAlign=#TAT#
X=(#Mir#*Round([RefDay:W]))
Y=0
InlineSetting=CharacterSpacing | (#Lead#*#TrackDisplay#*#Scale#) | (#Trail#*#TrackDisplay#*#Scale#)
Text=%1

[Date]
Meter=String
MeterStyle=sTitle
MeasureName=mDate
StringAlign=#TAT#
X=(#Mir#*Round([RefDay:W]))
Y=(#DateGap#*#Scale#)R
InlineSetting=CharacterSpacing | (#Lead#*#TrackTitle#*#Scale#) | (#Trail#*#TrackTitle#*#Scale#)
FontColor=#Ink#,([#DateRest[#DayDateDateLine]]*#AlphaValue#+(#AlphaHover#-[#DateRest[#DayDateDateLine]]*#AlphaValue#)*#Reveal#)
FontEffectColor=#ShadowRGB#,(([#DateRest[#DayDateDateLine]]*#AlphaValue#+(#AlphaHover#-[#DateRest[#DayDateDateLine]]*#AlphaValue#)*#Reveal#)*#ShadowK#)
Text=%1
