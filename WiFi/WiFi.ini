; Control-Plaine | WiFi
; What it shows: Wi-Fi icon (lit arcs = signal) and the network name. Copies the
;   taskbar's states: NO INTERNET, NOT CONNECTED, ETHERNET, AIRPLANE MODE.
;   The network name shows on hover (warnings always), with a meter icon at
;   its right: a manual speed test with the Ookla Speedtest CLI. While it runs
;   the name hides, a spinner and the live speed take its place; the result
;   is a down arrow and speed, an up arrow and speed and the ping, which fade
;   out after ResultHold and the name comes back. Click the icon or name to open Windows Wi-Fi
;   settings.
; Designed for: Windows 10/11 networking (WiFiStatus, SysInfo and Registry
;   measures) and Ookla Speedtest CLI 1.x (speedtest.exe,
;   winget install Ookla.Speedtest.CLI).
; Adjust: WiFiClick, WiFiSpeedtestPath (Settings > WI-FI).
;   WiFiInterface below if the network name stays blank on a PC with more
;   than one wireless adapter.
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
Group=ControlPlaine
ContextTitle=Control-Plaine settings
ContextAction=[!ActivateConfig "#ROOTCONFIG#\Settings" "WiFi.ini"]
ContextTitle2=Run speed test
ContextAction2=[!CommandMeasure mWiFi "LinkClick()"]
MouseOverAction=[!CommandMeasure mFade "Stop 2"][!CommandMeasure mFade "Execute 1"]
MouseLeaveAction=[!CommandMeasure mFade "Stop 1"][!CommandMeasure mFade "Execute 2"]

[Metadata]
Name=Control-Plaine | WiFi
Author=Vishnu A
Version=2.0.0
License=CC BY-NC-SA 4.0

[Variables]
@include=#@#Theme.inc
@include2=#@#Defaults.inc
@include3=#ROOTCONFIGPATH#WiFi\Defaults.inc
@include4=#@#User.inc
@include5=#@#State.inc
; Which wireless interface WiFiStatus reads (0 = first).
WiFiInterface=0
; Width of the text column (fits the longest speed test result with ping). The skin is always this wide, so a longer line never resizes the
; window: with AnchorX=100% a resize shifted everything left.
LineW=262
; How long a speed test result stays up (ms).
ResultHold=15000
; Set by WiFi.lua: Hold is 1 while a speed test runs or its result shows (then
; fades to 0) and the network name is hidden; Result is 1 while the result shows.
Hold=0
Result=0
; Colour of the speed test icon: the accent while the mouse is over it.
GaugeInk=#Ink#
; What a click on the icon or name runs (set by WiFi.lua from WiFiClick).
OpenTarget=ms-settings:network-wifi
@include6=#@#Core.inc
Sz=(#Scale#*#SizeBoost#)
@include7=#@#Styles.inc

; ---------- Measures ----------

[mSSID]
Measure=WiFiStatus
WiFiInfoType=SSID
WiFiIntfID=#WiFiInterface#
UpdateDivider=2

[mQuality]
Measure=WiFiStatus
WiFiInfoType=Quality
WiFiIntfID=#WiFiInterface#
UpdateDivider=2

[mType]
; Best = the active adapter, wired first. Number: 6 Ethernet, 71 Wireless.
Measure=SysInfo
SysInfoType=ADAPTER_TYPE
SysInfoData=Best
DynamicVariables=1
UpdateDivider=2

[mState]
; 1 connected, -1 disconnected, 0 unknown.
Measure=SysInfo
SysInfoType=ADAPTER_STATE
SysInfoData=Best
DynamicVariables=1
UpdateDivider=2

[mInternet]
; 1 internet, -1 none (Windows' own check, the one the taskbar uses).
Measure=SysInfo
SysInfoType=INTERNET_CONNECTIVITY
UpdateDivider=2

[mAirplane]
; (Default) value: 1 = airplane mode on.
Measure=Registry
RegHKey=HKEY_LOCAL_MACHINE
RegKey=SYSTEM\CurrentControlSet\Control\RadioManagement\SystemRadioState
UpdateDivider=2

[mWiFi]
; Picks the state and runs the speed test. Measures above must come first.
Measure=Script
ScriptFile=#@#Scripts\WiFi.lua
UpdateDivider=2

[mSpeedRun]
; WiFi.lua sets Parameter (cmd line writing to a temp file) before each run.
Measure=Plugin
Plugin=RunCommand
Parameter=
State=Hide
Timeout=120000
FinishAction=[!CommandMeasure mWiFi "Finished()"]

[mSpeedTimer]
; 1: read the test's progress 4 times a second (up to 120 s).
; 2: after ResultHold, 3: fade the result out.
Measure=Plugin
Plugin=ActionTimer
ActionList1=Repeat Poll,250,480
Poll=[!CommandMeasure mWiFi "Poll()"]
ActionList2=Wait #ResultHold# | Clear
Clear=[!CommandMeasure mWiFi "Clear()"]
ActionList3=Repeat HoldStep,#FadeStep#,#FadeSteps#
HoldStep=[!CommandMeasure mWiFi "HoldStep()"]
DynamicVariables=1
IgnoreWarnings=1

[mSpin]
; Turns the spinner while a speed test runs (WiFi.lua).
Measure=Plugin
Plugin=ActionTimer
ActionList1=Repeat Spin,40,100000
Spin=[!CommandMeasure mWiFi "Spin()"]
IgnoreWarnings=1

; ---------- Meters ----------

[Hit]
; Makes the gap between icon and name clickable too.
Meter=Image
MeterStyle=sHit
X=0
Y=0
W=((#IconBox#+4+#LineW#)*#Sz#)
H=(#IconBox#*#Sz#)
MouseActionCursor=1
LeftMouseUpAction=["#OpenTarget#"]

[Icon]
Meter=Image
MeterStyle=sIconFade
ImageName=#@#Icons\wifi.png
; Full brightness while a speed test runs or its result shows (Hold).
ImageAlpha=(#AlphaDetail#+(#AlphaHover#-#AlphaDetail#)*Max(#Reveal#,#Hold#))
X=0
Y=0
LeftMouseUpAction=["#OpenTarget#"]

[Name]
; Same type and gap as the other app skins (DeepCool, Playnite): detail text,
; hover only. WiFi.lua keeps warnings (NO INTERNET) visible at rest, and the
; name visible while a speed test runs.
Meter=String
MeterStyle=sReveal
InlineSetting=CharacterSpacing | 0 | (#TrackDetail#*#Sz#)
StringAlign=LeftCenter
X=((#IconBox#+4)*#Sz#)
Y=((#IconBox#/2)*#Sz#)
SolidColor=0,0,0,1
MouseActionCursor=1
LeftMouseUpAction=["#OpenTarget#"]
MeasureName=mWiFi
Text=%1

[Gauge]
; Speed test button, right of the name. Hidden while a test runs or shows.
Meter=Image
ImageName=#@#Icons\gauge.png
X=([Name:XW]+8*#Sz#)
Y=(((#IconBox#-24)/2)*#Sz#)
W=(24*#Sz#)
H=(24*#Sz#)
ImageTint=#GaugeInk#
ImageAlpha=(#AlphaHover#*#Reveal#*(1-#Hold#))
SolidColor=0,0,0,1
AntiAlias=1
MouseActionCursor=1
DynamicVariables=1
Group=Reveal
MouseOverAction=[!SetVariable GaugeInk "#Accent#"][!UpdateMeter Gauge][!Redraw]
MouseLeaveAction=[!SetVariable GaugeInk "#Ink#"][!UpdateMeter Gauge][!Redraw]
LeftMouseUpAction=[!CommandMeasure mWiFi "LinkClick()"]
ToolTipText=Speed test

[Live]
; Speed so far while the test runs (WiFi.lua sets the text); FAILED if it fails.
Meter=String
MeterStyle=sReveal
FontColor=#Accent#,(#AlphaHover#*(1-#Result#)*Max(#Reveal#,#Hold#))
InlineSetting=CharacterSpacing | 0 | (#TrackDetail#*#Sz#)
StringAlign=LeftCenter
X=((#IconBox#+4)*#Sz#)
Y=((#IconBox#/2)*#Sz#)
Text=

[Spinner]
; Loader right of the live speed while a test runs (Spinner.lua draws it).
Meter=Shape
X=(8*#Sz#)R
Y=(Round(#IconBox#/2*#Sz#)-Round(5*#Sz#)-Max(1,Round(1.5*#Sz#)))
Shape=Ellipse 0,0,0 | StrokeWidth 0
AntiAlias=1
DynamicVariables=1
Hidden=1

[DownIcon]
; Result: down arrow and download speed, up arrow and upload speed. Takes the
; network name's place.
Meter=Image
ImageName=#@#Icons\arrow-down.png
X=((#IconBox#+4)*#Sz#)
Y=(((#IconBox#-16)/2)*#Sz#)
W=(16*#Sz#)
H=(16*#Sz#)
ImageTint=#Ink#
ImageAlpha=(#AlphaHover#*#Result#*Max(#Reveal#,#Hold#))
SolidColor=0,0,0,1
AntiAlias=1
DynamicVariables=1
Group=Reveal

[Down]
Meter=String
MeterStyle=sReveal
FontColor=#Ink#,(#AlphaHover#*#Result#*Max(#Reveal#,#Hold#))
InlineSetting=CharacterSpacing | 0 | (#TrackDetail#*#Sz#)
StringAlign=LeftCenter
X=([DownIcon:X]+18*#Sz#)
Y=((#IconBox#/2)*#Sz#)
Text=

[UpIcon]
Meter=Image
ImageName=#@#Icons\arrow-up.png
X=([Down:XW]+12*#Sz#)
Y=(((#IconBox#-16)/2)*#Sz#)
W=(16*#Sz#)
H=(16*#Sz#)
ImageTint=#Ink#
ImageAlpha=(#AlphaHover#*#Result#*Max(#Reveal#,#Hold#))
SolidColor=0,0,0,1
AntiAlias=1
DynamicVariables=1
Group=Reveal

[Up]
Meter=String
MeterStyle=sReveal
FontColor=#Ink#,(#AlphaHover#*#Result#*Max(#Reveal#,#Hold#))
InlineSetting=CharacterSpacing | 0 | (#TrackDetail#*#Sz#)
StringAlign=LeftCenter
X=([UpIcon:X]+18*#Sz#)
Y=((#IconBox#/2)*#Sz#)
Text=

[Ping]
Meter=String
MeterStyle=sReveal
FontColor=#Ink#,(#AlphaHover#*#Result#*Max(#Reveal#,#Hold#))
InlineSetting=CharacterSpacing | 0 | (#TrackDetail#*#Sz#)
StringAlign=LeftCenter
X=([Up:XW]+12*#Sz#)
Y=((#IconBox#/2)*#Sz#)
Text=
