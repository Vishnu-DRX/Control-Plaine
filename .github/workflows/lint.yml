name: lint
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/lint.py
      - run: pip install lupa
      - run: for t in tools/test_*.py; do python "$t" || exit 1; done
