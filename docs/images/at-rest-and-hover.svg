<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Illustration of four skins at rest and on hover">
  <style>
    text{font-family:Segoe UI,Arial,sans-serif;fill:#fff}
    .m{fill-opacity:.6}.s{font-size:11px;letter-spacing:2px}.v{font-size:18px;letter-spacing:2px}
    .h{font-size:11px;letter-spacing:3px;fill-opacity:.45}
    .t{fill:none;stroke:#fff;stroke-opacity:.14;stroke-width:3}.f{fill:none;stroke:#00e5ff;stroke-width:3;stroke-linecap:round}
    .i{fill:none;stroke:#fff;stroke-opacity:.7;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  </style>
  <rect width="900" height="300" rx="14" fill="#0b0c0f"/>
  <text x="30" y="34" class="h">AT REST</text>
  <text x="30" y="170" class="h">ON HOVER</text>
  <g transform="translate(60,70)">
    <text x="0" y="12" class="v">SUNDAY</text><text x="0" y="34" class="s m">18 OCTOBER 2026</text>
  </g>
  <g transform="translate(300,60)">
    <circle cx="20" cy="20" r="14" class="t"/><circle cx="20" cy="20" r="14" class="f" stroke-dasharray="55 88" transform="rotate(-90 20 20)"/>
  </g>
  <g transform="translate(520,66)" class="i">
    <path d="M10 6v12M5 12a9 9 0 1 0 10 0" transform="translate(0,0)"/>
    <path d="M44 14a9 9 0 1 1-3-6M44 4v6h-6" />
    <path d="M70 6v9m-7-9v9m-5 4h24"/>
  </g>
  <g transform="translate(760,70)" class="i">
    <path d="M2 14a14 14 0 0 1 24 0M7 19a8 8 0 0 1 14 0"/><circle cx="14" cy="24" r="1.5"/>
  </g>
  <g transform="translate(60,200)">
    <text x="0" y="12" class="v">SUNDAY</text><text x="0" y="34" class="s m">18 OCTOBER 2026</text>
    <text x="0" y="56" class="s">OPEN CALENDAR</text>
  </g>
  <g transform="translate(300,190)">
    <circle cx="20" cy="20" r="14" class="t"/><circle cx="20" cy="20" r="14" class="f" stroke-dasharray="55 88" transform="rotate(-90 20 20)"/>
    <text x="48" y="18" class="v">64%</text><text x="48" y="36" class="s m">SPEAKERS</text>
  </g>
  <g transform="translate(520,196)">
    <text x="0" y="30" class="v">HIBERNATE</text><text x="0" y="50" class="s m">SCHEDULE</text>
  </g>
  <g transform="translate(760,196)">
    <text x="0" y="14" class="v">HOME NETWORK</text><text x="0" y="34" class="s m">SPEED TEST</text>
  </g>
  <text x="870" y="288" text-anchor="end" class="h">ILLUSTRATION</text>
</svg>
