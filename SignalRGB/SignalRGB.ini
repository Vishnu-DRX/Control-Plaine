; Control-Plaine | SignalRGB
; What it shows: the SignalRGB logo (accent while the case lights are on). On
;   hover, "Case lights 40%" and a double arrow. Scroll anywhere on the skin to
;   change the brightness, down to 0 for OFF. Click the arrow to start the
;   cyan move effect; click the logo to open SignalRGB.
; Designed for: SignalRGB 2.5 (WhirlwindFX). With Pro, brightness uses
;   SignalRGB's local API (http://localhost:16038/api/v1/lighting) and shows
;   the real state. Without Pro it applies SignalRGBEffect (Solid Color)
;   through the signalrgb://effect/apply link, SignalRGBColor scaled to the
;   brightness (0 = black). The free tier can't be read back, so the number is
;   what the skin last sent. SignalRGB's window is hidden again right away
;   (Scripts\SignalRGBApply.ps1); its tray icon stays.
; Adjust (Settings > SIGNALRGB, or User.inc):
;   SignalRGBAlign      - left or right: which screen edge it sits on
;   SignalRGBDetails    - hover or always: when the text shows
;   SignalRGBTheme      - auto, dark or light: colours for this skin
;   SignalRGBPath       - what a click on the logo opens: auto (the SignalRGB
;                         launcher found through its signalrgb:// registration,
;                         so updates don't break it), a program path, or a link
;   SignalRGBStep       - % per scroll notch
;   SignalRGBApi        - auto, or 0 to never use the API
;   SignalRGBPort       - API port
;   SignalRGBEffect     - effect brightness is applied to (empty: no scrolling)
;   SignalRGBColor      - its full-brightness color, six hex digits
;   SignalRGBMoveEffect - effect the double arrow starts (empty: no arrow)
;   SignalRGBMoveParams - extra link parameters for it, e.g. speed=60
[Rainmeter]
; SignalRGBTooltips=0 hides every tooltip of this skin (see Core.inc).
ToolTipHidden=#TipHidden[#SignalRGBTooltips]#
Update=1000
AccurateText=1
DynamicWindowSize=1
Group=ControlPlaine
ContextTitle=Control-Plaine settings
ContextAction=[!ActivateConfig "#ROOTCONFIG#\Settings" "SignalRGB.ini"]
MouseOverAction=[!CommandMeasure mFade "Stop 2"][!CommandMeasure mFade "Execute 1"]
MouseLeaveAction=[!CommandMeasure mFade "Stop 1"][!CommandMeasure mFade "Execute 2"]

[Metadata]
Name=Control-Plaine | SignalRGB
Author=Vishnu A
Information=Case light brightness and an effect button for SignalRGB.
Version=2.1.0
License=CC BY-NC-SA 4.0

[Variables]
@include=#@#Theme.inc
@include2=#@#Defaults.inc
@include3=#ROOTCONFIGPATH#SignalRGB\Defaults.inc
@include4=#@#User.inc
@include5=#@#State.inc
; Set by SignalRGB.lua.
IconTint=#Ink#
BrightText=
ApiMode=0
ApiOff=0
MoveOn=0
; Read by Core.inc (Scripts\Core.lua) to arrange the skin; see specs/alignment.md.
SkinSide=#SignalRGBAlign#
SkinDetails=#SignalRGBDetails#
SkinTheme=#SignalRGBTheme#
@include6=#@#Core.inc
Sz=(#Scale#*#SizeBoost#)
; The fixed box. Left and right use the same one, so flipping the side never
; changes the skin's footprint or hit area. Whole pixels, so right-anchored
; text and icons land on whole pixels too.
BoxW=(Round(230*#Sz#))
@include7=#@#Styles.inc

; ---------- Measures ----------

[mSignalRGB]
Measure=Script
ScriptFile=#@#Scripts\SignalRGB.lua

[mBlocked]
; A missing required need (SignalRGBNeedBlocked=1, set by the needs check) hides the
; whole skin through the shared mVisible (Core.inc). Only on a change.
Measure=Calc
Formula=#SignalRGBNeedBlocked#
DynamicVariables=1
IfCondition=mBlocked = 1
IfTrueAction=[!SetVariable SelfHidden 1][!UpdateMeasure mVisible]
IfFalseAction=[!SetVariable SelfHidden 0][!UpdateMeasure mVisible]
IfConditionMode=1

; Reads lighting state. 403 (no Pro) or no answer means launcher mode. Off when
; SignalRGBApi=0 (ApiOff=1, set by SignalRGB.lua) or the needs check says the
; Pro API is not expected (SignalRGBHasApi=0).
[mApi]
Measure=WebParser
URL=http://localhost:#SignalRGBPort#/api/v1/lighting
Disabled=Max(1-#SignalRGBHasApi#,#ApiOff#)
DynamicVariables=1
RegExp=(?s)^(.*)$
UpdateRate=2
ForceReload=1
LogSubstringErrors=0
FinishAction=[!CommandMeasure mSignalRGB "Parsed()"]
OnConnectErrorAction=[!CommandMeasure mSignalRGB "Offline()"]
OnRegExpErrorAction=[!CommandMeasure mSignalRGB "Offline()"]

[mApiText]
Measure=WebParser
URL=[mApi]
StringIndex=1

; The launcher SignalRGB registers for signalrgb:// links, e.g.
; "C:\...\VortxEngine\app-2.5.74\SignalRgbLauncher.exe" "--url=%1".
; Squirrel rewrites it on every update, so it always points at the current build.
[mProtocol]
Measure=Registry
RegHKey=HKEY_CLASSES_ROOT
RegKey=signalrgb\shell\open\command
UpdateDivider=-1

[mOpen]
Measure=Plugin
Plugin=RunCommand
Program=
Parameter=
State=Show
DynamicVariables=1

; Sends changes (curl.exe ships with Windows 10 1803 and later).
[mSend]
Measure=Plugin
Plugin=RunCommand
Program=curl.exe
Parameter=
State=Hide
DynamicVariables=1

; Free mode: applies an effect link and hides the SignalRGB window again. cmd
; starts the script detached and exits, so this measure is never "still
; running" when the next change comes.
[mApply]
Measure=Plugin
Plugin=RunCommand
Program=cmd.exe
Parameter=
State=Hide
DynamicVariables=1

; One request after the last scroll notch, not one per notch.
[mDebounce]
Measure=Plugin
Plugin=ActionTimer
ActionList1=Wait 250 | Send
Send=[!CommandMeasure mSignalRGB "Send()"]
IgnoreWarnings=1

; ---------- Meters ----------

[Hit]
; The whole box, wide enough for the longest text and the arrow, so the window
; never resizes.
Meter=Image
MeterStyle=sHit
X=0
Y=0
W=#BoxW#
H=(#IconBox#*#Sz#)
MouseScrollUpAction=[!CommandMeasure mSignalRGB "Scroll(1)"]
MouseScrollDownAction=[!CommandMeasure mSignalRGB "Scroll(-1)"]

[Icon]
; Accent while the lights are on.
Meter=Image
MeterStyle=sIconFade
ImageName=#@#Icons\signalrgb.png
ImageTint=#IconTint#
X=(#Mir#*Round(#BoxW#-#IconBox#*#Sz#))
Y=0
ToolTipText=Open SignalRGB
LeftMouseUpAction=[!CommandMeasure mSignalRGB "Open()"]
MouseScrollUpAction=[!CommandMeasure mSignalRGB "Scroll(1)"]
MouseScrollDownAction=[!CommandMeasure mSignalRGB "Scroll(-1)"]

[Value]
; Same type as the DeepCool state text. Hidden when the brightness control is
; off (SignalRGBHasBrightness=0) unless the Pro API answers (ApiMode=1).
Meter=String
MeterStyle=sReveal
Hidden=(1-Max(#SignalRGBHasBrightness#,#ApiMode#))
FontColor=#Ink#,(#AlphaHover#*#Reveal#)
InlineSetting=CharacterSpacing | (#Lead#*#TrackDetail#*#Sz#) | (#Trail#*#TrackDetail#*#Sz#)
X=(#Mir#*Round(#BoxW#-(#IconBox#+4)*#Sz#)+(1-#Mir#)*(#IconBox#+4)*#Sz#)
Y=((#IconBox#/2)*#Sz#)
StringAlign=#TA#
Text=#BrightText#
ToolTipText=Scroll to change brightness
MouseScrollUpAction=[!CommandMeasure mSignalRGB "Scroll(1)"]
MouseScrollDownAction=[!CommandMeasure mSignalRGB "Scroll(-1)"]

[RefValue]
; Invisible widest text: the arrow sits on the inner side of it, so it never
; moves as the number changes.
Meter=String
MeterStyle=sReveal
FontColor=0,0,0,0
FontEffectColor=0,0,0,0
InlineSetting=CharacterSpacing | (#Lead#*#TrackDetail#*#Sz#) | (#Trail#*#TrackDetail#*#Sz#)
X=(#Mir#*Round(#BoxW#-(#IconBox#+4)*#Sz#)+(1-#Mir#)*(#IconBox#+4)*#Sz#)
Y=((#IconBox#/2)*#Sz#)
StringAlign=#TA#
Text=Case lights 100%

[Move]
; Starts the move effect (SignalRGBMoveEffect). Hidden when none is set
; (SignalRGBHasMove=0).
Meter=Image
Hidden=(1-#SignalRGBHasMove#)
ImageName=#@#Icons\move-horizontal.png
ImageTint=#Ink#
ImageAlpha=(#AlphaHover#*#Reveal#*#MoveOn#)
X=(#Mir#*Round(#BoxW#-(#IconBox#+4)*#Sz#-[RefValue:W]-8*#Sz#-24*#Sz#)+(1-#Mir#)*([RefValue:XW]+8*#Sz#))
Y=(((#IconBox#-24)/2)*#Sz#)
W=(24*#Sz#)
H=(24*#Sz#)
SolidColor=0,0,0,1
AntiAlias=1
MouseActionCursor=1
DynamicVariables=1
Group=Reveal
ToolTipText=Start move effect
MouseOverAction=[!SetOption Move ImageTint "#HoverTint#"][!UpdateMeter Move][!Redraw]
MouseLeaveAction=[!SetOption Move ImageTint "#Ink#"][!UpdateMeter Move][!Redraw]
LeftMouseUpAction=[!CommandMeasure mSignalRGB "Move()"]
MouseScrollUpAction=[!CommandMeasure mSignalRGB "Scroll(1)"]
MouseScrollDownAction=[!CommandMeasure mSignalRGB "Scroll(-1)"]
