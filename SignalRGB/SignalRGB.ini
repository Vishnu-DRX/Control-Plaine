; Control-Plaine | SignalRGB
; What it shows: a monochrome RGB icon, in the accent colour while the lights
;   are on. On hover, a thin ring with the brightness (%); scroll to change it,
;   scroll down to 0 to turn the lights off (OFF). Click the icon to open
;   SignalRGB.
; Designed for: SignalRGB 2.5 (WhirlwindFX). Brightness and on/off use
;   SignalRGB's local API (http://localhost:16038/api/v1/lighting), which only
;   SignalRGB Pro answers. Without Pro (or with the app closed) the skin is a
;   plain launcher: grey icon, SIGNALRGB on hover, click to open. It checks
;   again on its own and switches over when the API answers.
; Adjust (Settings > SIGNALRGB, or User.inc):
;   SignalRGBPath - what a click opens: auto (the SignalRGB launcher found
;                   through its signalrgb:// registration, so updates don't
;                   break it), a program path, or a link
;   SignalRGBStep - % per scroll notch
;   SignalRGBApi  - auto, or 0 to never use the API
;   SignalRGBPort - API port
; Other RGB software: set SignalRGBApi=0 and SignalRGBPath to its program for a
;   launcher, or change the URLs and JSON in Scripts\SignalRGB.lua.
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
Group=ControlPlaine
ContextTitle=Control-Plaine settings
ContextAction=[!ActivateConfig "#ROOTCONFIG#\Settings" "SignalRGB.ini"]
MouseOverAction=[!CommandMeasure mFade "Stop 2"][!CommandMeasure mFade "Execute 1"]
MouseLeaveAction=[!CommandMeasure mFade "Stop 1"][!CommandMeasure mFade "Execute 2"]

[Metadata]
Name=Control-Plaine | SignalRGB
Author=Vishnu A
Information=SignalRGB brightness ring and on/off (Pro), or a launcher.
Version=2.0.0
License=CC BY-NC-SA 4.0

[Variables]
@include=#@#Theme.inc
@include2=#@#Defaults.inc
@include3=#ROOTCONFIGPATH#SignalRGB\Defaults.inc
@include4=#@#User.inc
@include5=#@#State.inc
; Ring around the icon (scale 1): centre, radius, stroke.
RingC=21
RingR=18
RingWidth=2.5
; Set by SignalRGB.lua.
IconTint=#Ink#
BrightText=
ApiMode=0
@include6=#@#Core.inc
@include7=#@#Styles.inc

; ---------- Measures ----------

[mSignalRGB]
Measure=Script
ScriptFile=#@#Scripts\SignalRGB.lua

; Reads lighting state. 403 (no Pro) or no answer means launcher mode.
[mApi]
Measure=WebParser
URL=http://localhost:#SignalRGBPort#/api/v1/lighting
RegExp=(?s)^(.*)$
UpdateRate=2
ForceReload=1
LogSubstringErrors=0
FinishAction=[!CommandMeasure mSignalRGB "Parsed()"]
OnConnectErrorAction=[!CommandMeasure mSignalRGB "Offline()"]
OnRegExpErrorAction=[!CommandMeasure mSignalRGB "Offline()"]

[mApiText]
Measure=WebParser
URL=[mApi]
StringIndex=1

; The launcher SignalRGB registers for signalrgb:// links, e.g.
; "C:\...\VortxEngine\app-2.5.74\SignalRgbLauncher.exe" "--url=%1".
; Squirrel rewrites it on every update, so it always points at the current build.
[mProtocol]
Measure=Registry
RegHKey=HKEY_CLASSES_ROOT
RegKey=signalrgb\shell\open\command
UpdateDivider=-1

[mOpen]
Measure=Plugin
Plugin=RunCommand
Program=
Parameter=
State=Show
DynamicVariables=1

; Sends changes (curl.exe ships with Windows 10 1803 and later).
[mSend]
Measure=Plugin
Plugin=RunCommand
Program=curl.exe
Parameter=
State=Hide
DynamicVariables=1

; One request after the last scroll notch, not one per notch.
[mDebounce]
Measure=Plugin
Plugin=ActionTimer
ActionList1=Wait 250 | Send
Send=[!CommandMeasure mSignalRGB "Send()"]
IgnoreWarnings=1

; ---------- Meters ----------

[Hit]
Meter=Image
MeterStyle=sHit
X=0
Y=0
W=(130*#Scale#)
H=((#RingC#*2)*#Scale#)
MouseScrollUpAction=[!CommandMeasure mSignalRGB "Scroll(1)"]
MouseScrollDownAction=[!CommandMeasure mSignalRGB "Scroll(-1)"]

; Track and fill; SignalRGB.lua writes Shape2 for the current brightness.
[Ring]
Meter=Shape
MeterStyle=sRing
X=0
Y=0
Shape=Ellipse (#RingC#*#Scale#),(#RingC#*#Scale#),(#RingR#*#Scale#) | Fill Color 0,0,0,0 | StrokeWidth (#RingWidth#*#Scale#) | Stroke Color #Ink#,(#AlphaTrack#*#Reveal#*#ApiMode#)
Shape2=Ellipse 0,0,0 | StrokeWidth 0
Group=Reveal
MouseScrollUpAction=[!CommandMeasure mSignalRGB "Scroll(1)"]
MouseScrollDownAction=[!CommandMeasure mSignalRGB "Scroll(-1)"]

[Icon]
Meter=Image
MeterStyle=sIconFade
ImageName=#@#Icons\rgb.png
ImageTint=#IconTint#
X=((#RingC#-#IconBox#/2)*#Scale#)
Y=((#RingC#-#IconBox#/2)*#Scale#)
ToolTipText=Open SignalRGB
LeftMouseUpAction=[!CommandMeasure mSignalRGB "Open()"]
MouseScrollUpAction=[!CommandMeasure mSignalRGB "Scroll(1)"]
MouseScrollDownAction=[!CommandMeasure mSignalRGB "Scroll(-1)"]

; API mode: 70% over BRIGHTNESS.
[Value]
Meter=String
MeterStyle=sValue
FontColor=#Ink#,(#AlphaHover#*#Reveal#*#ApiMode#)
InlineSetting=CharacterSpacing | 0 | (#TrackValue#*#Scale#)
X=((#RingC#*2+8)*#Scale#)
Y=((#RingC#+2)*#Scale#)
StringAlign=LeftBottom
Text=#BrightText#

[Label]
Meter=String
MeterStyle=sReveal
FontColor=#Ink#,(#AlphaHover#*#Reveal#*#ApiMode#)
InlineSetting=CharacterSpacing | 0 | (#TrackDetail#*#Scale#)
X=((#RingC#*2+8)*#Scale#)
Y=((#RingC#+3)*#Scale#)
Text=BRIGHTNESS

; Launcher mode: just the name.
[Name]
Meter=String
MeterStyle=sReveal
FontColor=#Ink#,(#AlphaHover#*#Reveal#*(1-#ApiMode#))
InlineSetting=CharacterSpacing | 0 | (#TrackDetail#*#Scale#)
X=((#RingC#*2+4)*#Scale#)
Y=(#RingC#*#Scale#)
StringAlign=LeftCenter
SolidColor=0,0,0,1
MouseActionCursor=1
LeftMouseUpAction=[!CommandMeasure mSignalRGB "Open()"]
Text=SignalRGB
