; Control-Plaine | Settings: VOLUME
; One page of the Settings window. Each tab is a variant of the Settings
; config; see @Resources\Settings\Controls.inc for how to build rows.
[Rainmeter]
Update=1000
AccurateText=1
Group=ControlPlaineSettings
OnRefreshAction=[!ZPos 1]
ContextTitle=Close settings
ContextAction=[!DeactivateConfig]

[Metadata]
Name=Control-Plaine | Settings
Author=Vishnu A
Information=Settings for the Control-Plaine suite. Opened from any skin's right-click menu.
Version=2.0.0
License=MIT

[Variables]
@include=#@#Theme.inc
@include2=#@#Defaults.inc
@include3=#ROOTCONFIGPATH#Volume\Defaults.inc
@include4=#@#User.inc
Tab=Volume
@include5=#@#Core.inc
@include6=#@#Styles.inc
@include7=#@#Settings\Controls.inc
@include8=#@#Settings\Chrome.inc
AlignKey=VolumeAlign
DetailsKey=VolumeDetails
@include9=#@#Settings\Align.inc
ThemeKey=VolumeTheme
ThemeY=436
@include10=#@#Settings\Theme.inc
TipKey=VolumeTooltips
TipY=500
@include11=#@#Settings\Tooltips.inc

[StepLabel]
Meter=String
MeterStyle=sRowLabel
Y=(180*#PS#)
Text=SCROLL STEP

[StepDesc]
Meter=String
MeterStyle=sRowDesc
Y=(4*#PS#)R
Text=How much one scroll notch changes the volume.

[StepValue]
Meter=String
MeterStyle=sValueText
X=((#ColR#-10)*#PS#)
Y=(184*#PS#)
Text=[&mSettings:Show('VolumeStep','pct')]
MouseScrollUpAction=[!CommandMeasure mSettings "Step('VolumeStep',1,1,10,'Volume')"]
MouseScrollDownAction=[!CommandMeasure mSettings "Step('VolumeStep',-1,1,10,'Volume')"]

[StepBox]
Meter=Shape
MeterStyle=sBox
X=([StepValue:X]-10*#PS#)
Y=([StepValue:Y]-3*#PS#)
Shape=Rectangle 0.5,0.5,([StepValue:W]+20*#PS#),([StepValue:H]+6*#PS#),(6*#PS#) | Extend Box

[UnmuteLabel]
Meter=String
MeterStyle=sRowLabel
Y=(244*#PS#)
Text=SCROLL UP UNMUTES

[UnmuteDesc]
Meter=String
MeterStyle=sRowDesc
Y=(4*#PS#)R
Text=Turning the volume up while muted unmutes. Scrolling down never does.

[UnmuteToggle]
Meter=Shape
MeterStyle=sToggle
X=((#ColR#-30)*#PS#)
Y=(250*#PS#)
Shape=Rectangle 0,0,(30*#PS#),(16*#PS#),(8*#PS#) | StrokeWidth 0 | Fill Color [&mSettings:Fill('VolumeScrollUnmutes')]
Shape2=Ellipse ([&mSettings:Knob('VolumeScrollUnmutes')]*#PS#),(8*#PS#),(6*#PS#) | StrokeWidth 0 | Fill Color 255,255,255,255
LeftMouseUpAction=[!CommandMeasure mSettings "Toggle('VolumeScrollUnmutes','Volume')"]

[RingLabel]
Meter=String
MeterStyle=sRowLabel
Y=(308*#PS#)
Text=RING THICKNESS

[RingDesc]
Meter=String
MeterStyle=sRowDesc
Y=(4*#PS#)R
Text=Width of the volume ring. Scroll to change.

[RingValue]
Meter=String
MeterStyle=sValueText
X=((#ColR#-10)*#PS#)
Y=(312*#PS#)
Text=[&mSettings:Show('VolumeRingStroke','px')]
MouseScrollUpAction=[!CommandMeasure mSettings "Step('VolumeRingStroke',1,2,8,'Volume')"]
MouseScrollDownAction=[!CommandMeasure mSettings "Step('VolumeRingStroke',-1,2,8,'Volume')"]

[RingBox]
Meter=Shape
MeterStyle=sBox
X=([RingValue:X]-10*#PS#)
Y=([RingValue:Y]-3*#PS#)
Shape=Rectangle 0.5,0.5,([RingValue:W]+20*#PS#),([RingValue:H]+6*#PS#),(6*#PS#) | Extend Box

[MixerLabel]
Meter=String
MeterStyle=sRowLabel
Y=(372*#PS#)
Text=SPEAKER OPENS

[MixerDesc]
Meter=String
MeterStyle=sRowDesc
Y=(4*#PS#)R
Text=What clicking the speaker opens: ms-settings:apps-volume or sndvol.exe.

[MixerPath]
Meter=String
MeterStyle=sPathText
X=((#ColR#-10)*#PS#)
Y=(378*#PS#)
Text=[&mSettings:Show('VolumeMixer','plain')]
LeftMouseUpAction=[!CommandMeasure mSettings "EditPath('VolumeMixer','Volume','MixerPath')"]

[MixerPathBox]
Meter=Shape
MeterStyle=sBox
X=([MixerPath:X]-10*#PS#)
Y=([MixerPath:Y]-3*#PS#)
Shape=Rectangle 0.5,0.5,([MixerPath:W]+20*#PS#),([MixerPath:H]+6*#PS#),(6*#PS#) | Extend Box
