; Control-Plaine | Settings: SIGNALRGB
; One page of the Settings window. Each tab is a variant of the Settings
; config; see @Resources\Settings\Controls.inc for how to build rows.
[Rainmeter]
Update=1000
AccurateText=1
Group=ControlPlaineSettings
OnRefreshAction=[!ZPos 1]
ContextTitle=Close settings
ContextAction=[!DeactivateConfig]

[Metadata]
Name=Control-Plaine | Settings
Author=Vishnu A
Information=Settings for the Control-Plaine suite. Opened from any skin's right-click menu.
Version=2.0.0
License=CC BY-NC-SA 4.0

[Variables]
@include=#@#Theme.inc
@include2=#@#Defaults.inc
@include3=#ROOTCONFIGPATH#SignalRGB\Defaults.inc
@include4=#@#User.inc
Tab=SignalRGB
@include5=#@#Core.inc
@include6=#@#Styles.inc
@include7=#@#Settings\Controls.inc
@include8=#@#Settings\Chrome.inc
AlignKey=SignalRGBAlign
DetailsKey=SignalRGBDetails
@include9=#@#Settings\Align.inc

[OpenLabel]
Meter=String
MeterStyle=sRowLabel
Y=(180*#PS#)
Text=OPENS

[OpenDesc]
Meter=String
MeterStyle=sRowDesc
Y=(4*#PS#)R
Text=Auto finds the SignalRGB launcher. Or a program path.

[OpenPath]
Meter=String
MeterStyle=sPathText
X=((#ColR#-10)*#PS#)
Y=(186*#PS#)
Text=[&mSettings:Show('SignalRGBPath','plain')]
LeftMouseUpAction=[!CommandMeasure mSettings "EditPath('SignalRGBPath','SignalRGB','OpenPath')"]

[OpenPathBox]
Meter=Shape
MeterStyle=sBox
X=([OpenPath:X]-10*#PS#)
Y=([OpenPath:Y]-3*#PS#)
Shape=Rectangle 0.5,0.5,([OpenPath:W]+20*#PS#),([OpenPath:H]+6*#PS#),(6*#PS#) | Extend Box

[StepLabel]
Meter=String
MeterStyle=sRowLabel
Y=(244*#PS#)
Text=SCROLL STEP

[StepDesc]
Meter=String
MeterStyle=sRowDesc
Y=(4*#PS#)R
Text=Brightness change per scroll notch.

[StepValue]
Meter=String
MeterStyle=sValueText
X=((#ColR#-10)*#PS#)
Y=(250*#PS#)
Text=[&mSettings:Show('SignalRGBStep','pct')]
MouseScrollUpAction=[!CommandMeasure mSettings "Step('SignalRGBStep',1,1,20,'SignalRGB')"]
MouseScrollDownAction=[!CommandMeasure mSettings "Step('SignalRGBStep',-1,1,20,'SignalRGB')"]

[StepBox]
Meter=Shape
MeterStyle=sBox
X=([StepValue:X]-10*#PS#)
Y=([StepValue:Y]-3*#PS#)
Shape=Rectangle 0.5,0.5,([StepValue:W]+20*#PS#),([StepValue:H]+6*#PS#),(6*#PS#) | Extend Box

[ApiLabel]
Meter=String
MeterStyle=sRowLabel
Y=(308*#PS#)
Text=BRIGHTNESS CONTROL

[ApiDesc]
Meter=String
MeterStyle=sRowDesc
Y=(4*#PS#)R
Text=Needs SignalRGB Pro. Auto turns it on when the API answers.

[Api1]
Meter=String
MeterStyle=sChoice
X=(#ColR#*#PS#)
Y=(316*#PS#)
FontColor=#Ink#,[&mSettings:ChoiceAlpha('SignalRGBApi','0')]
Text=OFF
LeftMouseUpAction=[!CommandMeasure mSettings "Set('SignalRGBApi','0','SignalRGB')"]

[Api1Line]
Meter=Image
MeterStyle=sChoiceLine
X=[Api1:X]
Y=([Api1:Y]+[Api1:H])
W=([Api1:W]-2*#PS#)
SolidColor=#Accent#,[&mSettings:ChoiceLine('SignalRGBApi','0')]

[Api0]
Meter=String
MeterStyle=sChoice
X=([Api1:X]-16*#PS#)
Y=(316*#PS#)
FontColor=#Ink#,[&mSettings:ChoiceAlpha('SignalRGBApi','auto')]
Text=AUTO
LeftMouseUpAction=[!CommandMeasure mSettings "Set('SignalRGBApi','auto','SignalRGB')"]

[Api0Line]
Meter=Image
MeterStyle=sChoiceLine
X=[Api0:X]
Y=([Api0:Y]+[Api0:H])
W=([Api0:W]-2*#PS#)
SolidColor=#Accent#,[&mSettings:ChoiceLine('SignalRGBApi','auto')]

[PortLabel]
Meter=String
MeterStyle=sRowLabel
Y=(372*#PS#)
Text=API PORT

[PortDesc]
Meter=String
MeterStyle=sRowDesc
Y=(4*#PS#)R
Text=Port of SignalRGB's local API.

[PortPath]
Meter=String
MeterStyle=sPathText
X=((#ColR#-10)*#PS#)
Y=(378*#PS#)
Text=[&mSettings:Show('SignalRGBPort','plain')]
LeftMouseUpAction=[!CommandMeasure mSettings "EditPath('SignalRGBPort','SignalRGB','PortPath')"]

[PortPathBox]
Meter=Shape
MeterStyle=sBox
X=([PortPath:X]-10*#PS#)
Y=([PortPath:Y]-3*#PS#)
Shape=Rectangle 0.5,0.5,([PortPath:W]+20*#PS#),([PortPath:H]+6*#PS#),(6*#PS#) | Extend Box
