; Control-Plaine | Settings: RECYCLE BIN
; One page of the Settings window. Each tab is a variant of the Settings
; config; see @Resources\Settings\Controls.inc for how to build rows.
[Rainmeter]
ToolTipHidden=#TipHide#
Update=1000
AccurateText=1
Group=ControlPlaineSettings
OnRefreshAction=[!ZPos 1]
ContextTitle=Close settings
ContextAction=[!DeactivateConfig]

[Metadata]
Name=Control-Plaine | Settings
Author=Vishnu A
Information=Settings for the Control-Plaine suite. Opened from any skin's right-click menu.
Version=2.0.1
License=MIT

[Variables]
@include=#@#Theme.inc
@include2=#@#Defaults.inc
@include3=#ROOTCONFIGPATH#RecycleBin\Defaults.inc
@include4=#@#User.inc
Tab=RecycleBin
@include5=#@#Core.inc
; One resolved tooltip switch: hidden only when TooltipsAll is off.
TipHide=#TipHidden1#
@include6=#@#Styles.inc
@include7=#@#Settings\Controls.inc
@include8=#@#Settings\Chrome.inc
AlignKey=RecycleBinAlign
DetailsKey=RecycleBinDetails
@include9=#@#Settings\Align.inc
ThemeKey=RecycleBinTheme
ThemeY=308
@include10=#@#Settings\Theme.inc
TipKey=RecycleBinTooltips
TipY=372
@include11=#@#Settings\Tooltips.inc

[ConfirmLabel]
Meter=String
MeterStyle=sRowLabel
Y=(180*#PS#)
Text=ASK BEFORE EMPTYING

[ConfirmDesc]
Meter=String
MeterStyle=sRowDesc
Y=(4*#PS#)R
Text=Windows asks to confirm when you click Empty.

[ConfirmToggle]
Meter=Shape
MeterStyle=sToggle
X=((#ColR#-30)*#PS#)
Y=(188*#PS#)
Shape=Rectangle 0,0,(30*#PS#),(16*#PS#),(8*#PS#) | StrokeWidth 0 | Fill Color [&mSettings:Fill('RecycleBinConfirm')]
Shape2=Ellipse ([&mSettings:Knob('RecycleBinConfirm')]*#PS#),(8*#PS#),(6*#PS#) | StrokeWidth 0 | Fill Color 255,255,255,255
LeftMouseUpAction=[!CommandMeasure mSettings "Toggle('RecycleBinConfirm','RecycleBin')"]

[WarnLabel]
Meter=String
MeterStyle=sRowLabel
Y=(244*#PS#)
Text=WARN ABOVE

[WarnDesc]
Meter=String
MeterStyle=sRowDesc
Y=(4*#PS#)R
Text=The size turns orange above this many GB. Scroll to change.

[WarnValue]
Meter=String
MeterStyle=sValueText
X=((#ColR#-10)*#PS#)
Y=(250*#PS#)
Text=[&mSettings:Show('RecycleBinWarnGB','plain')] GB
MouseScrollUpAction=[!CommandMeasure mSettings "Step('RecycleBinWarnGB',1,1,500,'RecycleBin')"]
MouseScrollDownAction=[!CommandMeasure mSettings "Step('RecycleBinWarnGB',-1,1,500,'RecycleBin')"]

[WarnBox]
Meter=Shape
MeterStyle=sBox
X=([WarnValue:X]-10*#PS#)
Y=([WarnValue:Y]-3*#PS#)
Shape=Rectangle 0.5,0.5,([WarnValue:W]+20*#PS#),([WarnValue:H]+6*#PS#),(6*#PS#) | Extend Box
