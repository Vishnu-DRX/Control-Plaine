; Control-Plaine | Settings: ADVANCED
; One page of the Settings window. Each tab is a variant of the Settings
; config; see @Resources\Settings\Controls.inc for how to build rows.
[Rainmeter]
Update=1000
AccurateText=1
Group=ControlPlaineSettings
OnRefreshAction=[!ZPos 1]
ContextTitle=Close settings
ContextAction=[!DeactivateConfig]

[Metadata]
Name=Control-Plaine | Settings
Author=Vishnu A
Information=Settings for the Control-Plaine suite. Opened from any skin's right-click menu.
Version=2.0.1
License=MIT

[Variables]
@include=#@#Theme.inc
@include2=#@#Defaults.inc
@include3=#@#User.inc
Tab=Advanced
@include4=#@#Core.inc
@include5=#@#Styles.inc
@include6=#@#Settings\Controls.inc
@include7=#@#Settings\Chrome.inc

[AlignAllLabel]
Meter=String
MeterStyle=sRowLabel
Y=(52*#PS#)
Text=ALIGN ALL SKINS

[AlignAllDesc]
Meter=String
MeterStyle=sRowDesc
Y=(4*#PS#)R
Text=Per skin, or force every skin to the left or right edge.

[AlignAll3]
Meter=String
MeterStyle=sChoice
X=(#ColR#*#PS#)
Y=(60*#PS#)
FontColor=#Ink#,[&mSettings:ChoiceAlpha('AlignAll','right')]
Text=RIGHT
LeftMouseUpAction=[!CommandMeasure mSettings "Set('AlignAll','right','all')"]

[AlignAll3Line]
Meter=Image
MeterStyle=sChoiceLine
X=[AlignAll3:X]
Y=([AlignAll3:Y]+[AlignAll3:H])
W=([AlignAll3:W]-2*#PS#)
SolidColor=#Accent#,[&mSettings:ChoiceLine('AlignAll','right')]

[AlignAll2]
Meter=String
MeterStyle=sChoice
X=([AlignAll3:X]-16*#PS#)
Y=(60*#PS#)
FontColor=#Ink#,[&mSettings:ChoiceAlpha('AlignAll','left')]
Text=LEFT
LeftMouseUpAction=[!CommandMeasure mSettings "Set('AlignAll','left','all')"]

[AlignAll2Line]
Meter=Image
MeterStyle=sChoiceLine
X=[AlignAll2:X]
Y=([AlignAll2:Y]+[AlignAll2:H])
W=([AlignAll2:W]-2*#PS#)
SolidColor=#Accent#,[&mSettings:ChoiceLine('AlignAll','left')]

[AlignAll1]
Meter=String
MeterStyle=sChoice
X=([AlignAll2:X]-16*#PS#)
Y=(60*#PS#)
FontColor=#Ink#,[&mSettings:ChoiceAlpha('AlignAll','skin')]
Text=PER SKIN
LeftMouseUpAction=[!CommandMeasure mSettings "Set('AlignAll','skin','all')"]

[AlignAll1Line]
Meter=Image
MeterStyle=sChoiceLine
X=[AlignAll1:X]
Y=([AlignAll1:Y]+[AlignAll1:H])
W=([AlignAll1:W]-2*#PS#)
SolidColor=#Accent#,[&mSettings:ChoiceLine('AlignAll','skin')]

[DetailsAllLabel]
Meter=String
MeterStyle=sRowLabel
Y=(104*#PS#)
Text=DETAILS ON ALL SKINS

[DetailsAllDesc]
Meter=String
MeterStyle=sRowDesc
Y=(4*#PS#)R
Text=Per skin, or hover-only or always shown on every skin.

[DetailsAll3]
Meter=String
MeterStyle=sChoice
X=(#ColR#*#PS#)
Y=(112*#PS#)
FontColor=#Ink#,[&mSettings:ChoiceAlpha('DetailsAll','always')]
Text=ALWAYS
LeftMouseUpAction=[!CommandMeasure mSettings "Set('DetailsAll','always','all')"]

[DetailsAll3Line]
Meter=Image
MeterStyle=sChoiceLine
X=[DetailsAll3:X]
Y=([DetailsAll3:Y]+[DetailsAll3:H])
W=([DetailsAll3:W]-2*#PS#)
SolidColor=#Accent#,[&mSettings:ChoiceLine('DetailsAll','always')]

[DetailsAll2]
Meter=String
MeterStyle=sChoice
X=([DetailsAll3:X]-16*#PS#)
Y=(112*#PS#)
FontColor=#Ink#,[&mSettings:ChoiceAlpha('DetailsAll','hover')]
Text=HOVER
LeftMouseUpAction=[!CommandMeasure mSettings "Set('DetailsAll','hover','all')"]

[DetailsAll2Line]
Meter=Image
MeterStyle=sChoiceLine
X=[DetailsAll2:X]
Y=([DetailsAll2:Y]+[DetailsAll2:H])
W=([DetailsAll2:W]-2*#PS#)
SolidColor=#Accent#,[&mSettings:ChoiceLine('DetailsAll','hover')]

[DetailsAll1]
Meter=String
MeterStyle=sChoice
X=([DetailsAll2:X]-16*#PS#)
Y=(112*#PS#)
FontColor=#Ink#,[&mSettings:ChoiceAlpha('DetailsAll','skin')]
Text=PER SKIN
LeftMouseUpAction=[!CommandMeasure mSettings "Set('DetailsAll','skin','all')"]

[DetailsAll1Line]
Meter=Image
MeterStyle=sChoiceLine
X=[DetailsAll1:X]
Y=([DetailsAll1:Y]+[DetailsAll1:H])
W=([DetailsAll1:W]-2*#PS#)
SolidColor=#Accent#,[&mSettings:ChoiceLine('DetailsAll','skin')]

[HoverAccentLabel]
Meter=String
MeterStyle=sRowLabel
Y=(156*#PS#)
Text=ACCENT ON HOVER

[HoverAccentDesc]
Meter=String
MeterStyle=sRowDesc
Y=(4*#PS#)R
Text=A hovered icon takes the accent colour.

[HoverAccentToggle]
Meter=Shape
MeterStyle=sToggle
X=((#ColR#-30)*#PS#)
Y=(164*#PS#)
Shape=Rectangle 0,0,(30*#PS#),(16*#PS#),(8*#PS#) | StrokeWidth 0 | Fill Color [&mSettings:Fill('HoverAccent')]
Shape2=Ellipse ([&mSettings:Knob('HoverAccent')]*#PS#),(8*#PS#),(6*#PS#) | StrokeWidth 0 | Fill Color 255,255,255,255
LeftMouseUpAction=[!CommandMeasure mSettings "Toggle('HoverAccent','all')"]

[LingerLabel]
Meter=String
MeterStyle=sRowLabel
Y=(208*#PS#)
Text=HOVER LINGER

[LingerDesc]
Meter=String
MeterStyle=sRowDesc
Y=(4*#PS#)R
Text=How long details stay after the mouse leaves. Scroll to change.

[LingerValue]
Meter=String
MeterStyle=sValueText
X=((#ColR#-10)*#PS#)
Y=(214*#PS#)
Text=[&mSettings:Show('HideDelay','ms')]
MouseScrollUpAction=[!CommandMeasure mSettings "Step('HideDelay',100,0,2000,'all')"]
MouseScrollDownAction=[!CommandMeasure mSettings "Step('HideDelay',-100,0,2000,'all')"]

[LingerBox]
Meter=Shape
MeterStyle=sBox
X=([LingerValue:X]-10*#PS#)
Y=([LingerValue:Y]-3*#PS#)
Shape=Rectangle 0.5,0.5,([LingerValue:W]+20*#PS#),([LingerValue:H]+6*#PS#),(6*#PS#) | Extend Box

[FontLabel]
Meter=String
MeterStyle=sRowLabel
Y=(260*#PS#)
Text=FONT

[FontDesc]
Meter=String
MeterStyle=sRowDesc
Y=(4*#PS#)R
Text=Use Segoe UI on Windows 10 or if the Variable font is missing.

[Font2]
Meter=String
MeterStyle=sChoice
X=(#ColR#*#PS#)
Y=(268*#PS#)
FontColor=#Ink#,[&mSettings:ChoiceAlpha('FontFace','Segoe UI Variable Display')]
Text=VARIABLE
LeftMouseUpAction=[!CommandMeasure mSettings "Set('FontFace','Segoe UI Variable Display','all')"]

[Font2Line]
Meter=Image
MeterStyle=sChoiceLine
X=[Font2:X]
Y=([Font2:Y]+[Font2:H])
W=([Font2:W]-2*#PS#)
SolidColor=#Accent#,[&mSettings:ChoiceLine('FontFace','Segoe UI Variable Display')]

[Font1]
Meter=String
MeterStyle=sChoice
X=([Font2:X]-16*#PS#)
Y=(268*#PS#)
FontColor=#Ink#,[&mSettings:ChoiceAlpha('FontFace','Segoe UI')]
Text=SEGOE UI
LeftMouseUpAction=[!CommandMeasure mSettings "Set('FontFace','Segoe UI','all')"]

[Font1Line]
Meter=Image
MeterStyle=sChoiceLine
X=[Font1:X]
Y=([Font1:Y]+[Font1:H])
W=([Font1:W]-2*#PS#)
SolidColor=#Accent#,[&mSettings:ChoiceLine('FontFace','Segoe UI')]

[TipsAllLabel]
Meter=String
MeterStyle=sRowLabel
Y=(312*#PS#)
Text=TOOLTIPS ON ALL SKINS

[TipsAllDesc]
Meter=String
MeterStyle=sRowDesc
Y=(4*#PS#)R
Text=Per skin, or show or hide the hover tips on every skin.

[TipsAll3]
Meter=String
MeterStyle=sChoice
X=(#ColR#*#PS#)
Y=(320*#PS#)
FontColor=#Ink#,[&mSettings:ChoiceAlpha('TooltipsAll','off')]
Text=OFF
LeftMouseUpAction=[!CommandMeasure mSettings "Set('TooltipsAll','off','all')"]

[TipsAll3Line]
Meter=Image
MeterStyle=sChoiceLine
X=[TipsAll3:X]
Y=([TipsAll3:Y]+[TipsAll3:H])
W=([TipsAll3:W]-2*#PS#)
SolidColor=#Accent#,[&mSettings:ChoiceLine('TooltipsAll','off')]

[TipsAll2]
Meter=String
MeterStyle=sChoice
X=([TipsAll3:X]-16*#PS#)
Y=(320*#PS#)
FontColor=#Ink#,[&mSettings:ChoiceAlpha('TooltipsAll','on')]
Text=ON
LeftMouseUpAction=[!CommandMeasure mSettings "Set('TooltipsAll','on','all')"]

[TipsAll2Line]
Meter=Image
MeterStyle=sChoiceLine
X=[TipsAll2:X]
Y=([TipsAll2:Y]+[TipsAll2:H])
W=([TipsAll2:W]-2*#PS#)
SolidColor=#Accent#,[&mSettings:ChoiceLine('TooltipsAll','on')]

[TipsAll1]
Meter=String
MeterStyle=sChoice
X=([TipsAll2:X]-16*#PS#)
Y=(320*#PS#)
FontColor=#Ink#,[&mSettings:ChoiceAlpha('TooltipsAll','skin')]
Text=PER SKIN
LeftMouseUpAction=[!CommandMeasure mSettings "Set('TooltipsAll','skin','all')"]

[TipsAll1Line]
Meter=Image
MeterStyle=sChoiceLine
X=[TipsAll1:X]
Y=([TipsAll1:Y]+[TipsAll1:H])
W=([TipsAll1:W]-2*#PS#)
SolidColor=#Accent#,[&mSettings:ChoiceLine('TooltipsAll','skin')]

[AdvHead]
Meter=String
MeterStyle=sSection
Y=(376*#PS#)
Text=ADVANCED

[BoostLabel]
Meter=String
MeterStyle=sRowLabel
Y=(400*#PS#)
Text=SIZE BOOST

[BoostDesc]
Meter=String
MeterStyle=sRowDesc
Y=(4*#PS#)R
Text=Extra size for app skins. Icons are drawn at 125%, so other values look softer.

[BoostValue]
Meter=String
MeterStyle=sValueText
X=((#ColR#-10)*#PS#)
Y=(406*#PS#)
Text=[&mSettings:Show('SizeBoost','scale')]
MouseScrollUpAction=[!CommandMeasure mSettings "Step('SizeBoost',0.05,0.5,2,'all')"]
MouseScrollDownAction=[!CommandMeasure mSettings "Step('SizeBoost',-0.05,0.5,2,'all')"]

[BoostBox]
Meter=Shape
MeterStyle=sBox
X=([BoostValue:X]-10*#PS#)
Y=([BoostValue:Y]-3*#PS#)
Shape=Rectangle 0.5,0.5,([BoostValue:W]+20*#PS#),([BoostValue:H]+6*#PS#),(6*#PS#) | Extend Box

[MaintHead]
Meter=String
MeterStyle=sSection
Y=(464*#PS#)
Text=MAINTENANCE

[ResetLabel]
Meter=String
MeterStyle=sRowLabel
Y=(488*#PS#)
Text=RESET SETTINGS

[ResetDesc]
Meter=String
MeterStyle=sRowDesc
Y=(4*#PS#)R
Text=Put every setting back to its default.

[ResetBtn]
Meter=String
MeterStyle=sChoice
X=(#ColR#*#PS#)
Y=(496*#PS#)
FontColor=#Ink#,255
Text=[&mSettings:ResetLabel()]
LeftMouseUpAction=[!CommandMeasure mSettings "Reset()"]

[ResetCancel]
Meter=String
MeterStyle=sChoice
X=([ResetBtn:X]-[ResetBtn:W]-16*#PS#)
Y=([ResetBtn:Y])
FontColor=#Ink#,115
Text=[&mSettings:ResetCancelLabel()]
LeftMouseUpAction=[!CommandMeasure mSettings "ResetCancel()"]

[CleanLabel]
Meter=String
MeterStyle=sRowLabel
Y=(540*#PS#)
Text=CLEAN UNKNOWN SETTINGS

[CleanDesc]
Meter=String
MeterStyle=sRowDesc
Y=(4*#PS#)R
Text=[&mSettings:UnknownDesc()]

[CleanBtn]
Meter=String
MeterStyle=sChoice
X=(#ColR#*#PS#)
Y=(548*#PS#)
FontColor=#Ink#,255
Text=[&mSettings:CleanLabel()]
LeftMouseUpAction=[!CommandMeasure mSettings "CleanUnknown()"]

