; Control-Plaine | Settings: POWER
; One page of the Settings window. Each tab is a variant of the Settings
; config; see @Resources\Settings\Controls.inc for how to build rows.
[Rainmeter]
Update=1000
AccurateText=1
Group=ControlPlaineSettings
OnRefreshAction=[!ZPos 1]
ContextTitle=Close settings
ContextAction=[!DeactivateConfig]

[Metadata]
Name=Control-Plaine | Settings
Author=Vishnu A
Information=Settings for the Control-Plaine suite. Opened from any skin's right-click menu.
Version=2.0.0
License=CC BY-NC-SA 4.0

[Variables]
@include=#@#Theme.inc
@include2=#@#Defaults.inc
@include3=#ROOTCONFIGPATH#Power\Defaults.inc
@include4=#@#User.inc
Tab=Power
@include5=#@#Core.inc
@include6=#@#Styles.inc
@include7=#@#Settings\Controls.inc
@include8=#@#Settings\Chrome.inc
TipKey=PowerTooltips
TipY=244
@include9=#@#Settings\Tooltips.inc

; ---------- FIRST BUTTON (choice) ----------

[FirstLabel]
Meter=String
MeterStyle=sRowLabel
Y=(52*#PS#)
Text=FIRST BUTTON

[FirstDesc]
Meter=String
MeterStyle=sRowDesc
Y=(4*#PS#)R
Text=What the first icon does, and what its schedule does.

[FirstSleep]
Meter=String
MeterStyle=sChoice
X=(#ColR#*#PS#)
Y=(60*#PS#)
FontColor=#Ink#,[&mSettings:ChoiceAlpha('PowerFirst','sleep')]
Text=SLEEP
LeftMouseUpAction=[!CommandMeasure mSettings "Set('PowerFirst','sleep','Power')"]

[FirstSleepLine]
Meter=Image
MeterStyle=sChoiceLine
X=[FirstSleep:X]
Y=([FirstSleep:Y]+[FirstSleep:H])
W=[FirstSleep:W]
SolidColor=#Accent#,[&mSettings:ChoiceLine('PowerFirst','sleep')]

[FirstHibernate]
Meter=String
MeterStyle=sChoice
X=([FirstSleep:X]-16*#PS#)
Y=(60*#PS#)
FontColor=#Ink#,[&mSettings:ChoiceAlpha('PowerFirst','hibernate')]
Text=HIBERNATE
LeftMouseUpAction=[!CommandMeasure mSettings "Set('PowerFirst','hibernate','Power')"]

[FirstHibernateLine]
Meter=Image
MeterStyle=sChoiceLine
X=[FirstHibernate:X]
Y=([FirstHibernate:Y]+[FirstHibernate:H])
W=[FirstHibernate:W]
SolidColor=#Accent#,[&mSettings:ChoiceLine('PowerFirst','hibernate')]

; ---------- ASK TO CONFIRM (toggle) ----------

[ConfirmLabel]
Meter=String
MeterStyle=sRowLabel
Y=(116*#PS#)
Text=ASK TO CONFIRM

[ConfirmDesc]
Meter=String
MeterStyle=sRowDesc
Y=(4*#PS#)R
Text=Shut down and restart need a second click within 3 seconds.

[ConfirmToggle]
Meter=Shape
MeterStyle=sToggle
X=((#ColR#-30)*#PS#)
Y=(122*#PS#)
Shape=Rectangle 0,0,(30*#PS#),(16*#PS#),(8*#PS#) | StrokeWidth 0 | Fill Color [&mSettings:Fill('PowerConfirm')]
Shape2=Ellipse ([&mSettings:Knob('PowerConfirm')]*#PS#),(8*#PS#),(6*#PS#) | StrokeWidth 0 | Fill Color 255,255,255,255
LeftMouseUpAction=[!CommandMeasure mSettings "Toggle('PowerConfirm','Power')"]

; ---------- PICKER START (value box) ----------

[PickerLabel]
Meter=String
MeterStyle=sRowLabel
Y=(180*#PS#)
Text=PICKER START

[PickerDesc]
Meter=String
MeterStyle=sRowDesc
Y=(4*#PS#)R
Text=The time SCHEDULE opens on. Scroll to change.

[PickerBox]
Meter=Shape
MeterStyle=sBox
X=([PickerValue:X]-10*#PS#)
Y=([PickerValue:Y]-3*#PS#)
Shape=Rectangle 0.5,0.5,([PickerValue:W]+20*#PS#),([PickerValue:H]+6*#PS#),(6*#PS#) | Extend Box

[PickerValue]
Meter=String
MeterStyle=sValueText
X=((#ColR#-10)*#PS#)
Y=(184*#PS#)
Text=[&mSettings:Show('PowerPickerStart','hm')]
MouseScrollUpAction=[!CommandMeasure mSettings "Step('PowerPickerStart',15,15,1440,'Power')"]
MouseScrollDownAction=[!CommandMeasure mSettings "Step('PowerPickerStart',-15,15,1440,'Power')"]
