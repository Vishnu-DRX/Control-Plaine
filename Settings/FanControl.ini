; Control-Plaine | Settings: FAN CONTROL
; One page of the Settings window. Each tab is a variant of the Settings
; config; see @Resources\Settings\Controls.inc for how to build rows.
[Rainmeter]
Update=1000
AccurateText=1
Group=ControlPlaineSettings
OnRefreshAction=[!ZPos 1]
ContextTitle=Close settings
ContextAction=[!DeactivateConfig]

[Metadata]
Name=Control-Plaine | Settings
Author=Vishnu A
Information=Settings for the Control-Plaine suite. Opened from any skin's right-click menu.
Version=2.0.0
License=CC BY-NC-SA 4.0

[Variables]
@include=#@#Theme.inc
@include2=#@#Defaults.inc
@include3=#ROOTCONFIGPATH#FanControl\Defaults.inc
@include4=#@#User.inc
Tab=FanControl
@include5=#@#Core.inc
@include6=#@#Styles.inc
@include7=#@#Settings\Controls.inc
@include8=#@#Settings\Chrome.inc
AlignKey=FanControlAlign
DetailsKey=FanControlDetails
@include9=#@#Settings\Align.inc
ThemeKey=FanControlTheme
ThemeY=500
@include10=#@#Settings\Theme.inc
TipKey=FanControlTooltips
TipY=552
TipCompact=1
@include11=#@#Settings\Tooltips.inc

[AppLabel]
Meter=String
MeterStyle=sRowLabel
Y=(180*#PS#)
Text=APP

[AppDesc]
Meter=String
MeterStyle=sRowDesc
Y=(4*#PS#)R
Text=FanControl.exe. Its profiles are in the Configurations folder beside it.

[AppPath]
Meter=String
MeterStyle=sPathText
X=((#ColR#-10)*#PS#)
Y=(186*#PS#)
Text=[&mSettings:Show('FanControlPath','plain')]
LeftMouseUpAction=[!CommandMeasure mSettings "EditPath('FanControlPath','FanControl','AppPath')"]

[AppPathBox]
Meter=Shape
MeterStyle=sBox
X=([AppPath:X]-10*#PS#)
Y=([AppPath:Y]-3*#PS#)
Shape=Rectangle 0.5,0.5,([AppPath:W]+20*#PS#),([AppPath:H]+6*#PS#),(6*#PS#) | Extend Box

[NormalLabel]
Meter=String
MeterStyle=sRowLabel
Y=(244*#PS#)
Text=NORMAL PROFILE

[NormalDesc]
Meter=String
MeterStyle=sRowDesc
Y=(4*#PS#)R
Text=Profile used when MAX is off.

[NormalPath]
Meter=String
MeterStyle=sPathText
X=((#ColR#-10)*#PS#)
Y=(250*#PS#)
Text=[&mSettings:Show('FanControlNormal','plain')]
LeftMouseUpAction=[!CommandMeasure mSettings "EditPath('FanControlNormal','FanControl','NormalPath')"]

[NormalPathBox]
Meter=Shape
MeterStyle=sBox
X=([NormalPath:X]-10*#PS#)
Y=([NormalPath:Y]-3*#PS#)
Shape=Rectangle 0.5,0.5,([NormalPath:W]+20*#PS#),([NormalPath:H]+6*#PS#),(6*#PS#) | Extend Box

[MaxLabel]
Meter=String
MeterStyle=sRowLabel
Y=(308*#PS#)
Text=MAX PROFILE

[MaxDesc]
Meter=String
MeterStyle=sRowDesc
Y=(4*#PS#)R
Text=Profile with every fan at 100%. tools\fan-tasks.ps1 can make it.

[MaxPath]
Meter=String
MeterStyle=sPathText
X=((#ColR#-10)*#PS#)
Y=(314*#PS#)
Text=[&mSettings:Show('FanControlMax','plain')]
LeftMouseUpAction=[!CommandMeasure mSettings "EditPath('FanControlMax','FanControl','MaxPath')"]

[MaxPathBox]
Meter=Shape
MeterStyle=sBox
X=([MaxPath:X]-10*#PS#)
Y=([MaxPath:Y]-3*#PS#)
Shape=Rectangle 0.5,0.5,([MaxPath:W]+20*#PS#),([MaxPath:H]+6*#PS#),(6*#PS#) | Extend Box

[StoppedLabel]
Meter=String
MeterStyle=sRowLabel
Y=(372*#PS#)
Text=IGNORE STOPPED FANS

[StoppedDesc]
Meter=String
MeterStyle=sRowDesc
Y=(4*#PS#)R
Text=Leave fans at 0 RPM out of the average.

[StoppedToggle]
Meter=Shape
MeterStyle=sToggle
X=((#ColR#-30)*#PS#)
Y=(380*#PS#)
Shape=Rectangle 0,0,(30*#PS#),(16*#PS#),(8*#PS#) | StrokeWidth 0 | Fill Color [&mSettings:Fill('FanControlIgnoreStopped')]
Shape2=Ellipse ([&mSettings:Knob('FanControlIgnoreStopped')]*#PS#),(8*#PS#),(6*#PS#) | StrokeWidth 0 | Fill Color 255,255,255,255
LeftMouseUpAction=[!CommandMeasure mSettings "Toggle('FanControlIgnoreStopped','FanControl')"]

[TasksLabel]
Meter=String
MeterStyle=sRowLabel
Y=(436*#PS#)
Text=NO UAC PROMPT

[TasksDesc]
Meter=String
MeterStyle=sRowDesc
Y=(4*#PS#)R
Text=Use the tasks from tools\fan-tasks.ps1 (run it once as admin).

[TasksToggle]
Meter=Shape
MeterStyle=sToggle
X=((#ColR#-30)*#PS#)
Y=(444*#PS#)
Shape=Rectangle 0,0,(30*#PS#),(16*#PS#),(8*#PS#) | StrokeWidth 0 | Fill Color [&mSettings:Fill('FanControlUseTasks')]
Shape2=Ellipse ([&mSettings:Knob('FanControlUseTasks')]*#PS#),(8*#PS#),(6*#PS#) | StrokeWidth 0 | Fill Color 255,255,255,255
LeftMouseUpAction=[!CommandMeasure mSettings "Toggle('FanControlUseTasks','FanControl')"]
