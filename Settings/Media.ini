; Control-Plaine | Settings: MEDIA
; One page of the Settings window. Each tab is a variant of the Settings
; config; see @Resources\Settings\Controls.inc for how to build rows.
[Rainmeter]
ToolTipHidden=#TipHide#
Update=1000
AccurateText=1
Group=ControlPlaineSettings
OnRefreshAction=[!ZPos 1]
ContextTitle=Close settings
ContextAction=[!DeactivateConfig]

[Metadata]
Name=Control-Plaine | Settings
Author=Vishnu A
Information=Settings for the Control-Plaine suite. Opened from any skin's right-click menu.
Version=2.0.1
License=MIT

[Variables]
@include=#@#Theme.inc
@include2=#@#Defaults.inc
@include3=#ROOTCONFIGPATH#Media\Defaults.inc
@include4=#@#User.inc
Tab=Media
@include5=#@#Core.inc
; One resolved tooltip switch: hidden only when TooltipsAll is off.
TipHide=#TipHidden1#
@include6=#@#Styles.inc
@include7=#@#Settings\Controls.inc
@include8=#@#Settings\Chrome.inc
AlignKey=MediaAlign
DetailsKey=MediaDetails
@include9=#@#Settings\Align.inc
ThemeKey=MediaTheme
ThemeY=372
@include10=#@#Settings\Theme.inc
TipKey=MediaTooltips
TipY=436
@include11=#@#Settings\Tooltips.inc

[IdleLabel]
Meter=String
MeterStyle=sRowLabel
Y=(180*#PS#)
Text=HIDE WHEN IDLE

[IdleDesc]
Meter=String
MeterStyle=sRowDesc
Y=(4*#PS#)R
Text=Hide the skin while nothing is playing.

[IdleToggle]
Meter=Shape
MeterStyle=sToggle
X=((#ColR#-30)*#PS#)
Y=(186*#PS#)
Shape=Rectangle 0,0,(30*#PS#),(16*#PS#),(8*#PS#) | StrokeWidth 0 | Fill Color [&mSettings:Fill('MediaHideIdle')]
Shape2=Ellipse ([&mSettings:Knob('MediaHideIdle')]*#PS#),(8*#PS#),(6*#PS#) | StrokeWidth 0 | Fill Color 255,255,255,255
LeftMouseUpAction=[!CommandMeasure mSettings "Toggle('MediaHideIdle','Media')"]

[SourceLabel]
Meter=String
MeterStyle=sRowLabel
Y=(244*#PS#)
Text=PLAYER SOURCE

[SourceDesc]
Meter=String
MeterStyle=sRowDesc
Y=(4*#PS#)R
Text=Any player uses MediaPlayer.dll. WebNowPlaying Redux must be installed first.

[SourceWnp]
Meter=String
MeterStyle=sChoice
X=(#ColR#*#PS#)
Y=(252*#PS#)
FontColor=#Ink#,[&mSettings:ChoiceAlpha('MediaSource','wnp')]
Text=WEBNOWPLAYING
LeftMouseUpAction=[!CommandMeasure mSettings "Set('MediaPlugin','WebNowPlaying','none')"][!CommandMeasure mSettings "Set('MediaSource','wnp','Media')"]

[SourceAny]
Meter=String
MeterStyle=sChoice
X=([SourceWnp:X]-16*#PS#)
Y=(252*#PS#)
FontColor=#Ink#,[&mSettings:ChoiceAlpha('MediaSource','any')]
Text=ANY PLAYER
LeftMouseUpAction=[!CommandMeasure mSettings "Set('MediaPlugin','MediaPlayer','none')"][!CommandMeasure mSettings "Set('MediaSource','any','Media')"]

[SourceAnyLine]
Meter=Image
MeterStyle=sChoiceLine
X=[SourceAny:X]
Y=([SourceAny:Y]+[SourceAny:H])
W=([SourceAny:W]-2*#PS#)
SolidColor=#Accent#,[&mSettings:ChoiceLine('MediaSource','any')]

[SourceWnpLine]
Meter=Image
MeterStyle=sChoiceLine
X=[SourceWnp:X]
Y=([SourceWnp:Y]+[SourceWnp:H])
W=([SourceWnp:W]-2*#PS#)
SolidColor=#Accent#,[&mSettings:ChoiceLine('MediaSource','wnp')]

[ScrollLabel]
Meter=String
MeterStyle=sRowLabel
Y=(308*#PS#)
Text=SCROLL LONG TITLES

[ScrollDesc]
Meter=String
MeterStyle=sRowDesc
Y=(4*#PS#)R
Text=Long names slide once when the song changes and on hover. Off cuts them short.

[ScrollToggle]
Meter=Shape
MeterStyle=sToggle
X=((#ColR#-30)*#PS#)
Y=(314*#PS#)
Shape=Rectangle 0,0,(30*#PS#),(16*#PS#),(8*#PS#) | StrokeWidth 0 | Fill Color [&mSettings:Fill('MediaScrollTitles')]
Shape2=Ellipse ([&mSettings:Knob('MediaScrollTitles')]*#PS#),(8*#PS#),(6*#PS#) | StrokeWidth 0 | Fill Color 255,255,255,255
LeftMouseUpAction=[!CommandMeasure mSettings "Toggle('MediaScrollTitles','Media')"]
