; Control-Plaine | Settings: DAY-DATE
; One page of the Settings window. Each tab is a variant of the Settings
; config; see @Resources\Settings\Controls.inc for how to build rows.
[Rainmeter]
Update=1000
AccurateText=1
Group=ControlPlaineSettings
OnRefreshAction=[!ZPos 1]
ContextTitle=Close settings
ContextAction=[!DeactivateConfig]

[Metadata]
Name=Control-Plaine | Settings
Author=Vishnu A
Information=Settings for the Control-Plaine suite. Opened from any skin's right-click menu.
Version=2.0.0
License=CC BY-NC-SA 4.0

[Variables]
@include=#@#Theme.inc
@include2=#@#Defaults.inc
@include3=#ROOTCONFIGPATH#DayDate\Defaults.inc
@include4=#@#User.inc
Tab=DayDate
@include5=#@#Core.inc
@include6=#@#Styles.inc
@include7=#@#Settings\Controls.inc
@include8=#@#Settings\Chrome.inc

[ClockLabel]
Meter=String
MeterStyle=sRowLabel
Y=(52*#PS#)
Text=CLOCK

[ClockDesc]
Meter=String
MeterStyle=sRowDesc
Y=(4*#PS#)R
Text=Time shown on hover.

[Clock24]
Meter=String
MeterStyle=sChoice
X=(#ColR#*#PS#)
Y=(60*#PS#)
FontColor=#Ink#,[&mSettings:ChoiceAlpha('DayDateClock','24')]
Text=24 H
LeftMouseUpAction=[!CommandMeasure mSettings "Set('DayDateClock','24','DayDate')"]

[Clock24Line]
Meter=Image
MeterStyle=sChoiceLine
X=[Clock24:X]
Y=([Clock24:Y]+[Clock24:H])
W=([Clock24:W]-2*#PS#)
SolidColor=#Accent#,[&mSettings:ChoiceLine('DayDateClock','24')]

[Clock12]
Meter=String
MeterStyle=sChoice
X=([Clock24:X]-16*#PS#)
Y=(60*#PS#)
FontColor=#Ink#,[&mSettings:ChoiceAlpha('DayDateClock','12')]
Text=12 H
LeftMouseUpAction=[!CommandMeasure mSettings "Set('DayDateClock','12','DayDate')"]

[Clock12Line]
Meter=Image
MeterStyle=sChoiceLine
X=[Clock12:X]
Y=([Clock12:Y]+[Clock12:H])
W=([Clock12:W]-2*#PS#)
SolidColor=#Accent#,[&mSettings:ChoiceLine('DayDateClock','12')]

[WeekLabel]
Meter=String
MeterStyle=sRowLabel
Y=(116*#PS#)
Text=WEEK NUMBER

[WeekDesc]
Meter=String
MeterStyle=sRowDesc
Y=(4*#PS#)R
Text=Show the week number next to the time on hover.

[WeekToggle]
Meter=Shape
MeterStyle=sToggle
X=((#ColR#-30)*#PS#)
Y=(124*#PS#)
Shape=Rectangle 0,0,(30*#PS#),(16*#PS#),(8*#PS#) | StrokeWidth 0 | Fill Color [&mSettings:Fill('DayDateWeek')]
Shape2=Ellipse ([&mSettings:Knob('DayDateWeek')]*#PS#),(8*#PS#),(6*#PS#) | StrokeWidth 0 | Fill Color 255,255,255,255
LeftMouseUpAction=[!CommandMeasure mSettings "Toggle('DayDateWeek','DayDate')"]

[AlignLabel]
Meter=String
MeterStyle=sRowLabel
Y=(180*#PS#)
Text=ALIGN

[AlignDesc]
Meter=String
MeterStyle=sRowDesc
Y=(4*#PS#)R
Text=Which side the lines line up to.

[AlignRight]
Meter=String
MeterStyle=sChoice
X=(#ColR#*#PS#)
Y=(188*#PS#)
FontColor=#Ink#,[&mSettings:ChoiceAlpha('DayDateAlign','right')]
Text=RIGHT
LeftMouseUpAction=[!CommandMeasure mSettings "Set('DayDateAlign','right','DayDate')"]

[AlignRightLine]
Meter=Image
MeterStyle=sChoiceLine
X=[AlignRight:X]
Y=([AlignRight:Y]+[AlignRight:H])
W=([AlignRight:W]-2*#PS#)
SolidColor=#Accent#,[&mSettings:ChoiceLine('DayDateAlign','right')]

[AlignLeft]
Meter=String
MeterStyle=sChoice
X=([AlignRight:X]-16*#PS#)
Y=(188*#PS#)
FontColor=#Ink#,[&mSettings:ChoiceAlpha('DayDateAlign','left')]
Text=LEFT
LeftMouseUpAction=[!CommandMeasure mSettings "Set('DayDateAlign','left','DayDate')"]

[AlignLeftLine]
Meter=Image
MeterStyle=sChoiceLine
X=[AlignLeft:X]
Y=([AlignLeft:Y]+[AlignLeft:H])
W=([AlignLeft:W]-2*#PS#)
SolidColor=#Accent#,[&mSettings:ChoiceLine('DayDateAlign','left')]
