; Control-Plaine | Settings: DAY-DATE
; One page of the Settings window. Each tab is a variant of the Settings
; config; see @Resources\Settings\Controls.inc for how to build rows.
[Rainmeter]
Update=1000
AccurateText=1
Group=ControlPlaineSettings
OnRefreshAction=[!ZPos 1]
ContextTitle=Close settings
ContextAction=[!DeactivateConfig]

[Metadata]
Name=Control-Plaine | Settings
Author=Vishnu A
Information=Settings for the Control-Plaine suite. Opened from any skin's right-click menu.
Version=2.0.0
License=CC BY-NC-SA 4.0

[Variables]
@include=#@#Theme.inc
@include2=#@#Defaults.inc
@include3=#ROOTCONFIGPATH#DayDate\Defaults.inc
@include4=#@#User.inc
Tab=DayDate
@include5=#@#Core.inc
@include6=#@#Styles.inc
@include7=#@#Settings\Controls.inc
@include8=#@#Settings\Chrome.inc

[AlignLabel]
Meter=String
MeterStyle=sRowLabel
Y=(52*#PS#)
Text=ALIGN

[AlignDesc]
Meter=String
MeterStyle=sRowDesc
Y=(4*#PS#)R
Text=Which side the lines line up to.

[AlignRight]
Meter=String
MeterStyle=sChoice
X=(#ColR#*#PS#)
Y=(60*#PS#)
FontColor=#Ink#,[&mSettings:ChoiceAlpha('DayDateAlign','right')]
Text=RIGHT
LeftMouseUpAction=[!CommandMeasure mSettings "Set('DayDateAlign','right','DayDate')"]

[AlignRightLine]
Meter=Image
MeterStyle=sChoiceLine
X=[AlignRight:X]
Y=([AlignRight:Y]+[AlignRight:H])
W=([AlignRight:W]-2*#PS#)
SolidColor=#Accent#,[&mSettings:ChoiceLine('DayDateAlign','right')]

[AlignLeft]
Meter=String
MeterStyle=sChoice
X=([AlignRight:X]-16*#PS#)
Y=(60*#PS#)
FontColor=#Ink#,[&mSettings:ChoiceAlpha('DayDateAlign','left')]
Text=LEFT
LeftMouseUpAction=[!CommandMeasure mSettings "Set('DayDateAlign','left','DayDate')"]

[AlignLeftLine]
Meter=Image
MeterStyle=sChoiceLine
X=[AlignLeft:X]
Y=([AlignLeft:Y]+[AlignLeft:H])
W=([AlignLeft:W]-2*#PS#)
SolidColor=#Accent#,[&mSettings:ChoiceLine('DayDateAlign','left')]
