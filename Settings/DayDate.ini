; Control-Plaine | Settings: DAY-DATE
; One page of the Settings window. Each tab is a variant of the Settings
; config; see @Resources\Settings\Controls.inc for how to build rows.
[Rainmeter]
Update=1000
AccurateText=1
Group=ControlPlaineSettings
OnRefreshAction=[!ZPos 1]
ContextTitle=Close settings
ContextAction=[!DeactivateConfig]

[Metadata]
Name=Control-Plaine | Settings
Author=Vishnu A
Information=Settings for the Control-Plaine suite. Opened from any skin's right-click menu.
Version=2.0.0
License=CC BY-NC-SA 4.0

[Variables]
@include=#@#Theme.inc
@include2=#@#Defaults.inc
@include3=#ROOTCONFIGPATH#DayDate\Defaults.inc
@include4=#@#User.inc
Tab=DayDate
@include5=#@#Core.inc
@include6=#@#Styles.inc
@include7=#@#Settings\Controls.inc
@include8=#@#Settings\Chrome.inc
AlignKey=DayDateAlign
DetailsKey=DayDateDetails
@include9=#@#Settings\Align.inc

[DateLineLabel]
Meter=String
MeterStyle=sRowLabel
Y=(180*#PS#)
Text=DATE LINE

[DateLineDesc]
Meter=String
MeterStyle=sRowDesc
Y=(4*#PS#)R
Text=The small date line: always shown, or only on hover.

[DateLineHover]
Meter=String
MeterStyle=sChoice
X=(#ColR#*#PS#)
Y=(188*#PS#)
FontColor=#Ink#,[&mSettings:ChoiceAlpha('DayDateDateLine','hover')]
Text=HOVER
LeftMouseUpAction=[!CommandMeasure mSettings "Set('DayDateDateLine','hover','DayDate')"]

[DateLineHoverLine]
Meter=Image
MeterStyle=sChoiceLine
X=[DateLineHover:X]
Y=([DateLineHover:Y]+[DateLineHover:H])
W=([DateLineHover:W]-2*#PS#)
SolidColor=#Accent#,[&mSettings:ChoiceLine('DayDateDateLine','hover')]

[DateLineShow]
Meter=String
MeterStyle=sChoice
X=([DateLineHover:X]-16*#PS#)
Y=(188*#PS#)
FontColor=#Ink#,[&mSettings:ChoiceAlpha('DayDateDateLine','show')]
Text=SHOWN
LeftMouseUpAction=[!CommandMeasure mSettings "Set('DayDateDateLine','show','DayDate')"]

[DateLineShowLine]
Meter=Image
MeterStyle=sChoiceLine
X=[DateLineShow:X]
Y=([DateLineShow:Y]+[DateLineShow:H])
W=([DateLineShow:W]-2*#PS#)
SolidColor=#Accent#,[&mSettings:ChoiceLine('DayDateDateLine','show')]

[ClickLabel]
Meter=String
MeterStyle=sRowLabel
Y=(244*#PS#)
Text=CLICK OPENS

[ClickDesc]
Meter=String
MeterStyle=sRowDesc
Y=(4*#PS#)R
Text=What clicking opens. Click CUSTOM to type a program, file or link.

[ClickCustom]
Meter=String
MeterStyle=sChoice
X=(#ColR#*#PS#)
Y=(252*#PS#)
FontColor=#Ink#,(370-[&mSettings:ChoiceAlpha('DayDateClick','calendar')])
ToolTipText=[&mSettings:Show('DayDateClick','plain')]
Text=CUSTOM
LeftMouseUpAction=[!CommandMeasure mSettings "EditPath('DayDateClick','DayDate','ClickCustom')"]

[ClickCalendar]
Meter=String
MeterStyle=sChoice
X=([ClickCustom:X]-16*#PS#)
Y=(252*#PS#)
FontColor=#Ink#,[&mSettings:ChoiceAlpha('DayDateClick','calendar')]
Text=CALENDAR
LeftMouseUpAction=[!CommandMeasure mSettings "Set('DayDateClick','calendar','DayDate')"]

[ClickCalendarLine]
Meter=Image
MeterStyle=sChoiceLine
X=[ClickCalendar:X]
Y=([ClickCalendar:Y]+[ClickCalendar:H])
W=([ClickCalendar:W]-2*#PS#)
SolidColor=#Accent#,[&mSettings:ChoiceLine('DayDateClick','calendar')]

[ClickCustomLine]
Meter=Image
MeterStyle=sChoiceLine
X=[ClickCustom:X]
Y=([ClickCustom:Y]+[ClickCustom:H])
W=([ClickCustom:W]-2*#PS#)
SolidColor=#Accent#,(255-[&mSettings:ChoiceLine('DayDateClick','calendar')])
