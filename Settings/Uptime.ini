; Control-Plaine | Settings: UPTIME
; One page of the Settings window. Each tab is a variant of the Settings
; config; see @Resources\Settings\Controls.inc for how to build rows.
[Rainmeter]
Update=1000
AccurateText=1
Group=ControlPlaineSettings
OnRefreshAction=[!ZPos 1]
ContextTitle=Close settings
ContextAction=[!DeactivateConfig]

[Metadata]
Name=Control-Plaine | Settings
Author=Vishnu A
Information=Settings for the Control-Plaine suite. Opened from any skin's right-click menu.
Version=2.0.0
License=CC BY-NC-SA 4.0

[Variables]
@include=#@#Theme.inc
@include2=#@#Defaults.inc
@include3=#ROOTCONFIGPATH#Uptime\Defaults.inc
@include4=#@#User.inc
Tab=Uptime
@include5=#@#Core.inc
@include6=#@#Styles.inc
@include7=#@#Settings\Controls.inc
@include8=#@#Settings\Chrome.inc
AlignKey=UptimeAlign
DetailsKey=UptimeDetails
@include9=#@#Settings\Align.inc

; ---------- RESTART REMINDER (value box) ----------

[WarnLabel]
Meter=String
MeterStyle=sRowLabel
Y=(180*#PS#)
Text=RESTART REMINDER

[WarnDesc]
Meter=String
MeterStyle=sRowDesc
Y=(4*#PS#)R
Text=Uptime shows itself in orange after this long. Scroll to change.

[WarnBox]
Meter=Shape
MeterStyle=sBox
X=([WarnValue:X]-10*#PS#)
Y=([WarnValue:Y]-3*#PS#)
Shape=Rectangle 0.5,0.5,([WarnValue:W]+20*#PS#),([WarnValue:H]+6*#PS#),(6*#PS#) | Extend Box

[WarnValue]
Meter=String
MeterStyle=sValueText
X=((#ColR#-10)*#PS#)
Y=(184*#PS#)
Text=[&mSettings:Show('UptimeWarnDays','days')]
MouseScrollUpAction=[!CommandMeasure mSettings "Step('UptimeWarnDays',1,1,30,'Uptime')"]
MouseScrollDownAction=[!CommandMeasure mSettings "Step('UptimeWarnDays',-1,1,30,'Uptime')"]

; ---------- CLICK OPENS (path box) ----------

[ClickLabel]
Meter=String
MeterStyle=sRowLabel
Y=(244*#PS#)
Text=CLICK OPENS

[ClickDesc]
Meter=String
MeterStyle=sRowDesc
Y=(4*#PS#)R
Text=The program a click starts. Task Manager by default.

[ClickValue]
Meter=String
MeterStyle=sPathText
X=((#ColR#-10)*#PS#)
Y=(250*#PS#)
Text=[&mSettings:Show('UptimeClick','plain')]
LeftMouseUpAction=[!CommandMeasure mSettings "EditPath('UptimeClick','Uptime','ClickValue')"]

[ClickBox]
Meter=Shape
MeterStyle=sBox
X=([ClickValue:X]-10*#PS#)
Y=([ClickValue:Y]-3*#PS#)
Shape=Rectangle 0.5,0.5,([ClickValue:W]+20*#PS#),([ClickValue:H]+6*#PS#),(6*#PS#) | Extend Box
