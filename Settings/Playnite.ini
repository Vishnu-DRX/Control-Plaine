; Control-Plaine | Settings: PLAYNITE
; One page of the Settings window. Each tab is a variant of the Settings
; config; see @Resources\Settings\Controls.inc for how to build rows.
[Rainmeter]
Update=1000
AccurateText=1
Group=ControlPlaineSettings
OnRefreshAction=[!ZPos 1]
ContextTitle=Close settings
ContextAction=[!DeactivateConfig]

[Metadata]
Name=Control-Plaine | Settings
Author=Vishnu A
Information=Settings for the Control-Plaine suite. Opened from any skin's right-click menu.
Version=2.0.0
License=CC BY-NC-SA 4.0

[Variables]
@include=#@#Theme.inc
@include2=#@#Defaults.inc
@include3=#ROOTCONFIGPATH#Playnite\Defaults.inc
@include4=#@#User.inc
Tab=Playnite
@include5=#@#Core.inc
@include6=#@#Styles.inc
@include7=#@#Settings\Controls.inc
@include8=#@#Settings\Chrome.inc

[PathLabel]
Meter=String
MeterStyle=sRowLabel
Y=(52*#PS#)
Text=PLAYNITE PATH

[PathDesc]
Meter=String
MeterStyle=sRowDesc
Y=(4*#PS#)R
Text=The program the icon starts. Click to change.

[PathValue]
Meter=String
MeterStyle=sPathText
X=((#ColR#-10)*#PS#)
Y=(58*#PS#)
Text=[&mSettings:Show('PlaynitePath','plain')]
LeftMouseUpAction=[!CommandMeasure mSettings "EditPath('PlaynitePath','Playnite','PathValue')"]

[PathBox]
Meter=Shape
MeterStyle=sBox
X=([PathValue:X]-10*#PS#)
Y=([PathValue:Y]-3*#PS#)
Shape=Rectangle 0.5,0.5,([PathValue:W]+20*#PS#),([PathValue:H]+6*#PS#),(6*#PS#) | Extend Box

[SplashLabel]
Meter=String
MeterStyle=sRowLabel
Y=(116*#PS#)
Text=SKIP SPLASH SCREEN

[SplashDesc]
Meter=String
MeterStyle=sRowDesc
Y=(4*#PS#)R
Text=Open Playnite without its splash screen.

[SplashToggle]
Meter=Shape
MeterStyle=sToggle
X=((#ColR#-30)*#PS#)
Y=(124*#PS#)
Shape=Rectangle 0,0,(30*#PS#),(16*#PS#),(8*#PS#) | StrokeWidth 0 | Fill Color [&mSettings:Fill('PlayniteSkipSplash')]
Shape2=Ellipse ([&mSettings:Knob('PlayniteSkipSplash')]*#PS#),(8*#PS#),(6*#PS#) | StrokeWidth 0 | Fill Color 255,255,255,255
LeftMouseUpAction=[!CommandMeasure mSettings "Toggle('PlayniteSkipSplash','Playnite')"]
