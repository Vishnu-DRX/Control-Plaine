; Control-Plaine | Settings: DEEPCOOL
; One page of the Settings window. Each tab is a variant of the Settings
; config; see @Resources\Settings\Controls.inc for how to build rows.
[Rainmeter]
Update=1000
AccurateText=1
Group=ControlPlaineSettings
OnRefreshAction=[!ZPos 1]
ContextTitle=Close settings
ContextAction=[!DeactivateConfig]

[Metadata]
Name=Control-Plaine | Settings
Author=Vishnu A
Information=Settings for the Control-Plaine suite. Opened from any skin's right-click menu.
Version=2.0.0
License=CC BY-NC-SA 4.0

[Variables]
@include=#@#Theme.inc
@include2=#@#Defaults.inc
@include3=#ROOTCONFIGPATH#DeepCool\Defaults.inc
@include4=#@#User.inc
Tab=DeepCool
@include5=#@#Core.inc
@include6=#@#Styles.inc
@include7=#@#Settings\Controls.inc
@include8=#@#Settings\Chrome.inc

[AppLabel]
Meter=String
MeterStyle=sRowLabel
Y=(52*#PS#)
Text=APP

[AppDesc]
Meter=String
MeterStyle=sRowDesc
Y=(4*#PS#)R
Text=The DeepCool program that drives the case screen.

[AppPath]
Meter=String
MeterStyle=sPathText
X=((#ColR#-10)*#PS#)
Y=(58*#PS#)
Text=[&mSettings:Show('DeepCoolPath','plain')]
LeftMouseUpAction=[!CommandMeasure mSettings "EditPath('DeepCoolPath','DeepCool','AppPath')"]

[AppPathBox]
Meter=Shape
MeterStyle=sBox
X=([AppPath:X]-10*#PS#)
Y=([AppPath:Y]-3*#PS#)
Shape=Rectangle 0.5,0.5,([AppPath:W]+20*#PS#),([AppPath:H]+6*#PS#),(6*#PS#) | Extend Box

[ProcessLabel]
Meter=String
MeterStyle=sRowLabel
Y=(116*#PS#)
Text=PROCESS

[ProcessDesc]
Meter=String
MeterStyle=sRowDesc
Y=(4*#PS#)R
Text=Process name used to tell if it is running.

[ProcessPath]
Meter=String
MeterStyle=sPathText
X=((#ColR#-10)*#PS#)
Y=(122*#PS#)
Text=[&mSettings:Show('DeepCoolProcess','plain')]
LeftMouseUpAction=[!CommandMeasure mSettings "EditPath('DeepCoolProcess','DeepCool','ProcessPath')"]

[ProcessPathBox]
Meter=Shape
MeterStyle=sBox
X=([ProcessPath:X]-10*#PS#)
Y=([ProcessPath:Y]-3*#PS#)
Shape=Rectangle 0.5,0.5,([ProcessPath:W]+20*#PS#),([ProcessPath:H]+6*#PS#),(6*#PS#) | Extend Box

[HiddenLabel]
Meter=String
MeterStyle=sRowLabel
Y=(180*#PS#)
Text=START HIDDEN

[HiddenDesc]
Meter=String
MeterStyle=sRowDesc
Y=(4*#PS#)R
Text=Start straight to the tray, with no window.

[HiddenToggle]
Meter=Shape
MeterStyle=sToggle
X=((#ColR#-30)*#PS#)
Y=(188*#PS#)
Shape=Rectangle 0,0,(30*#PS#),(16*#PS#),(8*#PS#) | StrokeWidth 0 | Fill Color [&mSettings:Fill('DeepCoolStartHidden')]
Shape2=Ellipse ([&mSettings:Knob('DeepCoolStartHidden')]*#PS#),(8*#PS#),(6*#PS#) | StrokeWidth 0 | Fill Color 255,255,255,255
LeftMouseUpAction=[!CommandMeasure mSettings "Toggle('DeepCoolStartHidden','DeepCool')"]

[ArgsLabel]
Meter=String
MeterStyle=sRowLabel
Y=(244*#PS#)
Text=START ARGUMENTS

[ArgsDesc]
Meter=String
MeterStyle=sRowDesc
Y=(4*#PS#)R
Text=Extra arguments when starting (usually none).

[ArgsPath]
Meter=String
MeterStyle=sPathText
X=((#ColR#-10)*#PS#)
Y=(250*#PS#)
Text=[&mSettings:Show('DeepCoolArgs','plain')]
LeftMouseUpAction=[!CommandMeasure mSettings "EditPath('DeepCoolArgs','DeepCool','ArgsPath')"]

[ArgsPathBox]
Meter=Shape
MeterStyle=sBox
X=([ArgsPath:X]-10*#PS#)
Y=([ArgsPath:Y]-3*#PS#)
Shape=Rectangle 0.5,0.5,([ArgsPath:W]+20*#PS#),([ArgsPath:H]+6*#PS#),(6*#PS#) | Extend Box

[LabelLabel]
Meter=String
MeterStyle=sRowLabel
Y=(308*#PS#)
Text=LABEL

[LabelDesc]
Meter=String
MeterStyle=sRowDesc
Y=(4*#PS#)R
Text=What the hover label names: the case screen or the DeepCool app.

[Label1]
Meter=String
MeterStyle=sChoice
X=(#ColR#*#PS#)
Y=(316*#PS#)
FontColor=#Ink#,[&mSettings:ChoiceAlpha('DeepCoolLabel','screen')]
Text=CASE SCREEN
LeftMouseUpAction=[!CommandMeasure mSettings "Set('DeepCoolLabel','screen','DeepCool')"]

[Label1Line]
Meter=Image
MeterStyle=sChoiceLine
X=[Label1:X]
Y=([Label1:Y]+[Label1:H])
W=([Label1:W]-2*#PS#)
SolidColor=#Accent#,[&mSettings:ChoiceLine('DeepCoolLabel','screen')]

[Label0]
Meter=String
MeterStyle=sChoice
X=([Label1:X]-16*#PS#)
Y=(316*#PS#)
FontColor=#Ink#,[&mSettings:ChoiceAlpha('DeepCoolLabel','app')]
Text=DEEPCOOL
LeftMouseUpAction=[!CommandMeasure mSettings "Set('DeepCoolLabel','app','DeepCool')"]

[Label0Line]
Meter=Image
MeterStyle=sChoiceLine
X=[Label0:X]
Y=([Label0:Y]+[Label0:H])
W=([Label0:W]-2*#PS#)
SolidColor=#Accent#,[&mSettings:ChoiceLine('DeepCoolLabel','app')]
