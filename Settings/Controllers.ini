; Control-Plaine | Settings: CONTROLLERS
; One page of the Settings window. Each tab is a variant of the Settings
; config; see @Resources\Settings\Controls.inc for how to build rows.
[Rainmeter]
Update=1000
AccurateText=1
Group=ControlPlaineSettings
OnRefreshAction=[!ZPos 1]
ContextTitle=Close settings
ContextAction=[!DeactivateConfig]

[Metadata]
Name=Control-Plaine | Settings
Author=Vishnu A
Information=Settings for the Control-Plaine suite. Opened from any skin's right-click menu.
Version=2.0.1
License=MIT

[Variables]
@include=#@#Theme.inc
@include2=#@#Defaults.inc
@include3=#ROOTCONFIGPATH#Controllers\Defaults.inc
@include4=#@#User.inc
Tab=Controllers
@include5=#@#Core.inc
@include6=#@#Styles.inc
@include7=#@#Settings\Controls.inc
@include8=#@#Settings\Chrome.inc
AlignKey=ControllersAlign
DetailsKey=ControllersDetails
@include9=#@#Settings\Align.inc
ThemeKey=ControllersTheme
ThemeY=440
@include10=#@#Settings\Theme.inc
TipKey=ControllersTooltips
TipY=622
TipCompact=1
@include11=#@#Settings\Tooltips.inc

; ---------- CONTROLLERS ----------

[BatteryLabel]
Meter=String
MeterStyle=sRowLabel
Y=(180*#PS#)
Text=BATTERY AT REST

[BatteryDesc]
Meter=String
MeterStyle=sRowDesc
Y=(4*#PS#)R
Text=Show a controller's battery without hovering only below this level.

[BatteryValue]
Meter=String
MeterStyle=sValueText
X=((#ColR#-10)*#PS#)
Y=(186*#PS#)
Text=[&mSettings:Show('ControllersBatteryShow','pct')]
MouseScrollUpAction=[!CommandMeasure mSettings "Step('ControllersBatteryShow',5,5,100,'Controllers')"]
MouseScrollDownAction=[!CommandMeasure mSettings "Step('ControllersBatteryShow',-5,5,100,'Controllers')"]

[BatteryValueBox]
Meter=Shape
MeterStyle=sBox
X=([BatteryValue:X]-10*#PS#)
Y=([BatteryValue:Y]-3*#PS#)
Shape=Rectangle 0.5,0.5,([BatteryValue:W]+20*#PS#),([BatteryValue:H]+6*#PS#),(6*#PS#) | Extend Box

[LowLabel]
Meter=String
MeterStyle=sRowLabel
Y=(232*#PS#)
Text=BATTERY LOW

[LowDesc]
Meter=String
MeterStyle=sRowDesc
Y=(4*#PS#)R
Text=A battery under this level turns orange.

[LowValue]
Meter=String
MeterStyle=sValueText
X=((#ColR#-10)*#PS#)
Y=(238*#PS#)
Text=[&mSettings:Show('ControllersBatteryLow','pct')]
MouseScrollUpAction=[!CommandMeasure mSettings "Step('ControllersBatteryLow',5,5,100,'Controllers')"]
MouseScrollDownAction=[!CommandMeasure mSettings "Step('ControllersBatteryLow',-5,5,100,'Controllers')"]

[LowValueBox]
Meter=Shape
MeterStyle=sBox
X=([LowValue:X]-10*#PS#)
Y=([LowValue:Y]-3*#PS#)
Shape=Rectangle 0.5,0.5,([LowValue:W]+20*#PS#),([LowValue:H]+6*#PS#),(6*#PS#) | Extend Box

[DualSenseLabel]
Meter=String
MeterStyle=sRowLabel
Y=(284*#PS#)
Text=DUALSENSE APP

[DualSenseDesc]
Meter=String
MeterStyle=sRowDesc
Y=(4*#PS#)R
Text=What clicking a DualSense opens. DSX by default.

[DualSensePath]
Meter=String
MeterStyle=sPathText
X=((#ColR#-10)*#PS#)
Y=(290*#PS#)
Text=[&mSettings:Show('ControllersDualSenseApp','plain')]
LeftMouseUpAction=[!CommandMeasure mSettings "EditPath('ControllersDualSenseApp','Controllers','DualSensePath')"]

[DualSensePathBox]
Meter=Shape
MeterStyle=sBox
X=([DualSensePath:X]-10*#PS#)
Y=([DualSensePath:Y]-3*#PS#)
Shape=Rectangle 0.5,0.5,([DualSensePath:W]+20*#PS#),([DualSensePath:H]+6*#PS#),(6*#PS#) | Extend Box

[WheelLabel]
Meter=String
MeterStyle=sRowLabel
Y=(336*#PS#)
Text=WHEEL APP

[WheelDesc]
Meter=String
MeterStyle=sRowDesc
Y=(4*#PS#)R
Text=What clicking the Moza wheel opens. Pit House by default.

[WheelPath]
Meter=String
MeterStyle=sPathText
X=((#ColR#-10)*#PS#)
Y=(342*#PS#)
Text=[&mSettings:Show('ControllersWheelApp','plain')]
LeftMouseUpAction=[!CommandMeasure mSettings "EditPath('ControllersWheelApp','Controllers','WheelPath')"]

[WheelPathBox]
Meter=Shape
MeterStyle=sBox
X=([WheelPath:X]-10*#PS#)
Y=([WheelPath:Y]-3*#PS#)
Shape=Rectangle 0.5,0.5,([WheelPath:W]+20*#PS#),([WheelPath:H]+6*#PS#),(6*#PS#) | Extend Box

[OtherLabel]
Meter=String
MeterStyle=sRowLabel
Y=(388*#PS#)
Text=OTHER CONTROLLERS

[OtherDesc]
Meter=String
MeterStyle=sRowDesc
Y=(4*#PS#)R
Text=What clicking any other controller opens.

[OtherPath]
Meter=String
MeterStyle=sPathText
X=((#ColR#-10)*#PS#)
Y=(394*#PS#)
Text=[&mSettings:Show('ControllersOther','plain')]
LeftMouseUpAction=[!CommandMeasure mSettings "EditPath('ControllersOther','Controllers','OtherPath')"]

[OtherPathBox]
Meter=Shape
MeterStyle=sBox
X=([OtherPath:X]-10*#PS#)
Y=([OtherPath:Y]-3*#PS#)
Shape=Rectangle 0.5,0.5,([OtherPath:W]+20*#PS#),([OtherPath:H]+6*#PS#),(6*#PS#) | Extend Box

; ---------- ADVANCED ----------
; Rarely changed. One line each (label and box), no description, so the page
; fits: the label says the unit.

[Advanced]
Meter=String
MeterStyle=sSection
Y=(500*#PS#)
Text=ADVANCED

[PollLabel]
Meter=String
MeterStyle=sRowLabel
Y=(526*#PS#)
Text=SCAN EVERY, SECONDS

[PollValue]
Meter=String
MeterStyle=sValueText
X=((#ColR#-10)*#PS#)
Y=(527*#PS#)
Text=[&mSettings:Show('ControllersPoll','plain')]
