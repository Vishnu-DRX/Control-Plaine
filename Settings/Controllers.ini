; Control-Plaine | Settings: CONTROLLERS
; One page of the Settings window. Each tab is a variant of the Settings
; config; see @Resources\Settings\Controls.inc for how to build rows.
[Rainmeter]
Update=1000
AccurateText=1
Group=ControlPlaineSettings
OnRefreshAction=[!ZPos 1]
ContextTitle=Close settings
ContextAction=[!DeactivateConfig]

[Metadata]
Name=Control-Plaine | Settings
Author=Vishnu A
Information=Settings for the Control-Plaine suite. Opened from any skin's right-click menu.
Version=2.0.0
License=CC BY-NC-SA 4.0

[Variables]
@include=#@#Theme.inc
@include2=#@#Defaults.inc
@include3=#ROOTCONFIGPATH#Controllers\Defaults.inc
@include4=#@#User.inc
Tab=Controllers
@include5=#@#Core.inc
@include6=#@#Styles.inc
@include7=#@#Settings\Controls.inc
@include8=#@#Settings\Chrome.inc

; ---------- CONTROLLERS ----------

; Controller list keys that have no row (low %, polls, DSX port) live in
; Controllers\Defaults.inc and can be overridden in User.inc.

[BatteryLabel]
Meter=String
MeterStyle=sRowLabel
Y=(52*#PS#)
Text=BATTERY AT REST

[BatteryDesc]
Meter=String
MeterStyle=sRowDesc
Y=(4*#PS#)R
Text=Show a controller's battery without hovering only below this level.

[BatteryValue]
Meter=String
MeterStyle=sValueText
X=((#ColR#-10)*#PS#)
Y=(58*#PS#)
Text=[&mSettings:Show('ControllersBatteryShow','pct')]
MouseScrollUpAction=[!CommandMeasure mSettings "Step('ControllersBatteryShow',5,5,100,'Controllers')"]
MouseScrollDownAction=[!CommandMeasure mSettings "Step('ControllersBatteryShow',-5,5,100,'Controllers')"]

[BatteryBox]
Meter=Shape
MeterStyle=sBox
X=([BatteryValue:X]-10*#PS#)
Y=([BatteryValue:Y]-3*#PS#)
Shape=Rectangle 0.5,0.5,([BatteryValue:W]+20*#PS#),([BatteryValue:H]+6*#PS#),(6*#PS#) | Extend Box

[DualSenseLabel]
Meter=String
MeterStyle=sRowLabel
Y=(116*#PS#)
Text=DUALSENSE APP

[DualSenseDesc]
Meter=String
MeterStyle=sRowDesc
Y=(4*#PS#)R
Text=What clicking a DualSense opens. DSX by default.

[DualSensePath]
Meter=String
MeterStyle=sPathText
X=((#ColR#-10)*#PS#)
Y=(122*#PS#)
Text=[&mSettings:Show('ControllersDualSenseApp','plain')]
LeftMouseUpAction=[!CommandMeasure mSettings "EditPath('ControllersDualSenseApp','Controllers','DualSensePath')"]

[DualSensePathBox]
Meter=Shape
MeterStyle=sBox
X=([DualSensePath:X]-10*#PS#)
Y=([DualSensePath:Y]-3*#PS#)
Shape=Rectangle 0.5,0.5,([DualSensePath:W]+20*#PS#),([DualSensePath:H]+6*#PS#),(6*#PS#) | Extend Box

[WheelLabel]
Meter=String
MeterStyle=sRowLabel
Y=(180*#PS#)
Text=WHEEL APP

[WheelDesc]
Meter=String
MeterStyle=sRowDesc
Y=(4*#PS#)R
Text=What clicking the Moza wheel opens. Pit House by default.

[WheelPath]
Meter=String
MeterStyle=sPathText
X=((#ColR#-10)*#PS#)
Y=(186*#PS#)
Text=[&mSettings:Show('ControllersWheelApp','plain')]
LeftMouseUpAction=[!CommandMeasure mSettings "EditPath('ControllersWheelApp','Controllers','WheelPath')"]

[WheelPathBox]
Meter=Shape
MeterStyle=sBox
X=([WheelPath:X]-10*#PS#)
Y=([WheelPath:Y]-3*#PS#)
Shape=Rectangle 0.5,0.5,([WheelPath:W]+20*#PS#),([WheelPath:H]+6*#PS#),(6*#PS#) | Extend Box

[OtherLabel]
Meter=String
MeterStyle=sRowLabel
Y=(244*#PS#)
Text=OTHER CONTROLLERS

[OtherDesc]
Meter=String
MeterStyle=sRowDesc
Y=(4*#PS#)R
Text=What clicking any other controller opens.

[OtherPath]
Meter=String
MeterStyle=sPathText
X=((#ColR#-10)*#PS#)
Y=(250*#PS#)
Text=[&mSettings:Show('ControllersOther','plain')]
LeftMouseUpAction=[!CommandMeasure mSettings "EditPath('ControllersOther','Controllers','OtherPath')"]

[OtherPathBox]
Meter=Shape
MeterStyle=sBox
X=([OtherPath:X]-10*#PS#)
Y=([OtherPath:Y]-3*#PS#)
Shape=Rectangle 0.5,0.5,([OtherPath:W]+20*#PS#),([OtherPath:H]+6*#PS#),(6*#PS#) | Extend Box
