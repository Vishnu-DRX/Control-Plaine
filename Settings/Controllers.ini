[PortLabel]
Meter=String
MeterStyle=sRowLabel
Y=(590*#PS#)
Text=DSX PORT

[PortPath]
Meter=String
MeterStyle=sPathText
X=((#ColR#-10)*#PS#)
Y=(591*#PS#)
Text=[&mSettings:Show('ControllersDsxPort','plain')]
