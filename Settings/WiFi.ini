; Control-Plaine | Settings: WI-FI
; One page of the Settings window. Each tab is a variant of the Settings
; config; see @Resources\Settings\Controls.inc for how to build rows.
[Rainmeter]
Update=1000
AccurateText=1
Group=ControlPlaineSettings
OnRefreshAction=[!ZPos 1]
ContextTitle=Close settings
ContextAction=[!DeactivateConfig]

[Metadata]
Name=Control-Plaine | Settings
Author=Vishnu A
Information=Settings for the Control-Plaine suite. Opened from any skin's right-click menu.
Version=2.0.0
License=CC BY-NC-SA 4.0

[Variables]
@include=#@#Theme.inc
@include2=#@#Defaults.inc
@include3=#ROOTCONFIGPATH#WiFi\Defaults.inc
@include4=#@#User.inc
Tab=WiFi
@include5=#@#Core.inc
@include6=#@#Styles.inc
@include7=#@#Settings\Controls.inc
@include8=#@#Settings\Chrome.inc

; ---------- WI-FI ----------

[ClickLabel]
Meter=String
MeterStyle=sRowLabel
Y=(52*#PS#)
Text=CLICK OPENS

[ClickDesc]
Meter=String
MeterStyle=sRowDesc
Y=(4*#PS#)R
Text=What clicking the icon or network name opens. Click CUSTOM to type a program or link.

[ClickCustom]
Meter=String
MeterStyle=sChoice
X=(#ColR#*#PS#)
Y=(60*#PS#)
FontColor=#Ink#,(370-[&mSettings:ChoiceAlpha('WiFiClick','settings')])
ToolTipText=[&mSettings:Show('WiFiClick','plain')]
Text=CUSTOM
LeftMouseUpAction=[!CommandMeasure mSettings "EditPath('WiFiClick','WiFi','ClickCustom')"]

[ClickSettings]
Meter=String
MeterStyle=sChoice
X=([ClickCustom:X]-16*#PS#)
Y=(60*#PS#)
FontColor=#Ink#,[&mSettings:ChoiceAlpha('WiFiClick','settings')]
Text=WI-FI SETTINGS
LeftMouseUpAction=[!CommandMeasure mSettings "Set('WiFiClick','settings','WiFi')"]

[ClickSettingsLine]
Meter=Image
MeterStyle=sChoiceLine
X=[ClickSettings:X]
Y=([ClickSettings:Y]+[ClickSettings:H])
W=([ClickSettings:W]-2*#PS#)
SolidColor=#Accent#,[&mSettings:ChoiceLine('WiFiClick','settings')]

[ClickCustomLine]
Meter=Image
MeterStyle=sChoiceLine
X=[ClickCustom:X]
Y=([ClickCustom:Y]+[ClickCustom:H])
W=([ClickCustom:W]-2*#PS#)
SolidColor=#Accent#,(255-[&mSettings:ChoiceLine('WiFiClick','settings')])

[SpeedLabel]
Meter=String
MeterStyle=sRowLabel
Y=(116*#PS#)
Text=SPEED TEST

[SpeedDesc]
Meter=String
MeterStyle=sRowDesc
Y=(4*#PS#)R
Text=Where Ookla speedtest.exe is. Click to change.

[SpeedPath]
Meter=String
MeterStyle=sPathText
X=((#ColR#-10)*#PS#)
Y=(122*#PS#)
Text=[&mSettings:Show('WiFiSpeedtestPath','plain')]
LeftMouseUpAction=[!CommandMeasure mSettings "EditPath('WiFiSpeedtestPath','WiFi','SpeedPath')"]

[SpeedPathBox]
Meter=Shape
MeterStyle=sBox
X=([SpeedPath:X]-10*#PS#)
Y=([SpeedPath:Y]-3*#PS#)
Shape=Rectangle 0.5,0.5,([SpeedPath:W]+20*#PS#),([SpeedPath:H]+6*#PS#),(6*#PS#) | Extend Box
