; ---------- One-line rows ----------
; The rows below have no description (the page is full): the label says what
; they do and hovering it shows the longer text. Pitch 24, except around the
; value boxes (28), so boxes do not touch.

[SkinsForLabel]
Meter=String
MeterStyle=sRowLabel
Y=(476*#PS#)
ToolTipText=Which look the skins use. Auto follows the Windows light or dark setting. Dark wallpaper = white skins, light wallpaper = black skins. A skin's own COLOURS row overrides it.
