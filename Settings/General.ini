[ScaleLabel]
Meter=String
MeterStyle=sRowLabel
Y=(268*#PS#)
Text=SCALE

[ScaleDesc]
Meter=String
MeterStyle=sRowDesc
Y=(4*#PS#)R
Text=Size of every skin. Scroll to change.

[ScaleValue]
Meter=String
MeterStyle=sValueText
X=((#ColR#-10)*#PS#)
Y=(274*#PS#)
Text=[&mSettings:Show('Scale','scale')]
MouseScrollUpAction=[!CommandMeasure mSettings "Step('Scale',0.1,0.5,3,'all')"]
MouseScrollDownAction=[!CommandMeasure mSettings "Step('Scale',-0.1,0.5,3,'all')"]

[ScaleBox]
Meter=Shape
MeterStyle=sBox
X=([ScaleValue:X]-10*#PS#)
Y=([ScaleValue:Y]-3*#PS#)
Shape=Rectangle 0.5,0.5,([ScaleValue:W]+20*#PS#),([ScaleValue:H]+6*#PS#),(6*#PS#) | Extend Box

[AccentLabel]
Meter=String
MeterStyle=sRowLabel
Y=(320*#PS#)
Text=ACCENT

[AccentDesc]
Meter=String
MeterStyle=sRowDesc
Y=(4*#PS#)R
Text=Follows Windows, or pick your own. Click the dot to set it.

[AccentMode1]
Meter=String
MeterStyle=sChoice
X=(#ColR#*#PS#)
Y=(328*#PS#)
FontColor=#Ink#,[&mSettings:ChoiceAlpha('AccentFollowWindows','0')]
Text=CUSTOM
LeftMouseUpAction=[!CommandMeasure mSettings "Set('AccentFollowWindows','0','all')"]

[AccentMode0]
Meter=String
MeterStyle=sChoice
X=([AccentMode1:X]-16*#PS#)
Y=(328*#PS#)
FontColor=#Ink#,[&mSettings:ChoiceAlpha('AccentFollowWindows','1')]
Text=WINDOWS
LeftMouseUpAction=[!CommandMeasure mSettings "Set('AccentFollowWindows','1','all')"]

[AccentMode0Line]
Meter=Image
MeterStyle=sChoiceLine
X=[AccentMode0:X]
Y=([AccentMode0:Y]+[AccentMode0:H])
W=([AccentMode0:W]-2*#PS#)
SolidColor=#Accent#,[&mSettings:ChoiceLine('AccentFollowWindows','1')]

[AccentMode1Line]
Meter=Image
MeterStyle=sChoiceLine
X=[AccentMode1:X]
Y=([AccentMode1:Y]+[AccentMode1:H])
W=([AccentMode1:W]-2*#PS#)
SolidColor=#Accent#,[&mSettings:ChoiceLine('AccentFollowWindows','0')]

[AccentSwatch]
Meter=Shape
MeterStyle=sToggle
X=([AccentMode0:X]-26*#PS#)
Y=(328*#PS#)
Shape=Ellipse (7*#PS#),(7*#PS#),(7*#PS#-0.5) | StrokeWidth 1 | Stroke Color #Ink#,77 | Fill Color #AccentColor#,255
ToolTipText=Custom colour (R,G,B or hex). Click to edit.
LeftMouseUpAction=[!CommandMeasure mSettings "EditPath('AccentColor','all','AccentSwatch')"]

