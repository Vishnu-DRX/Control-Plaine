; ---------- Needs marks and setup ----------
; An amber "!" left of a loaded skin's name when something it needs is missing
; (Settings.lua MarkHidden / MarkTip, from Setup\NeedsList.lua). Click opens
; the setup for that skin. Same mark for HIDE IN FULL SCREEN (IsFullScreen
; plugin). Hidden meters show no tooltip.

[ListMarkDayDate]
