Hidden=[&mSettings:MarkHidden('DayDate')]
MouseActionCursor=1
ToolTipText=[&mSettings:MarkTip('DayDate')]
LeftMouseUpAction=[!CommandMeasure mSettings "Fix('DayDate')"]
DynamicVariables=1

