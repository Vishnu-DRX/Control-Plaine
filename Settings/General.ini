; Control-Plaine | Settings: GENERAL
; One page of the Settings window. Each tab is a variant of the Settings
; config; see @Resources\Settings\Controls.inc for how to build rows.
[Rainmeter]
Update=1000
AccurateText=1
Group=ControlPlaineSettings
OnRefreshAction=[!ZPos 1]
ContextTitle=Close settings
ContextAction=[!DeactivateConfig]

[Metadata]
Name=Control-Plaine | Settings
Author=Vishnu A
Information=Settings for the Control-Plaine suite. Opened from any skin's right-click menu.
Version=2.0.0
License=CC BY-NC-SA 4.0

[Variables]
@include=#@#Theme.inc
@include2=#@#Defaults.inc
@include3=#@#User.inc
Tab=General
@include4=#@#Core.inc
@include5=#@#Styles.inc
@include6=#@#Settings\Controls.inc
@include7=#@#Settings\Chrome.inc

[Skins]
Meter=String
MeterStyle=sSection
Y=(52*#PS#)
Text=SKINS

[SkinDayDate]
Meter=String
X=(248*#PS#)
Y=(84*#PS#)
FontFace=#FontFace#
FontSize=(9*#PS#)
FontColor=#Ink#,230
InlineSetting=CharacterSpacing | 0 | (1.8*#PS#)
StringEffect=Shadow
FontEffectColor=#Shadow#
AntiAlias=1
DynamicVariables=1
Text=DAY-DATE

[SkinDayDateToggle]
Meter=Shape
MeterStyle=sToggle
X=(514*#PS#)
Y=(85*#PS#)
Shape=Rectangle 0,0,(30*#PS#),(16*#PS#),(8*#PS#) | StrokeWidth 0 | Fill Color [&mSettings:SkinFill('DayDate')]
Shape2=Ellipse ([&mSettings:SkinKnob('DayDate')]*#PS#),(8*#PS#),(6*#PS#) | StrokeWidth 0 | Fill Color 255,255,255,255
LeftMouseUpAction=[!CommandMeasure mSettings "SkinOn('DayDate')"]

