; Control-Plaine | Settings: FIRST-RUN SETUP
; One file for every step; Onboarding.lua shows the group of meters for the
; step in OnbStep (State.inc). Opened by Settings.lua when State.inc has no
; SetupDone, from General (RUN SETUP AGAIN) and from the amber ! marks.
; Rows reuse the keys, defaults and writers of the skin pages: nothing here
; defines a setting. Groups: OnbWelcome, OnbSkins, OnbSetup, OnbLook, OnbPlace
; (screen and edge), OnbDone.
[Rainmeter]
ToolTipHidden=#TipHide#
Update=1000
AccurateText=1
Group=ControlPlaineSettings
OnRefreshAction=[!ZPos 1]
ContextTitle=Close settings
ContextAction=[!DeactivateConfig]

[Metadata]
Name=Control-Plaine | Settings
Author=Vishnu A
Information=First-run setup for the Control-Plaine suite.
Version=2.0.1
License=MIT

[Variables]
@include=#@#Theme.inc
@include2=#@#Defaults.inc
@include3=#ROOTCONFIGPATH#DayDate\Defaults.inc
@include4=#ROOTCONFIGPATH#Power\Defaults.inc
@include5=#ROOTCONFIGPATH#Uptime\Defaults.inc
@include6=#ROOTCONFIGPATH#Volume\Defaults.inc
@include7=#ROOTCONFIGPATH#RecycleBin\Defaults.inc
@include8=#ROOTCONFIGPATH#Playnite\Defaults.inc
@include9=#ROOTCONFIGPATH#Media\Defaults.inc
@include10=#ROOTCONFIGPATH#WiFi\Defaults.inc
@include11=#ROOTCONFIGPATH#FanControl\Defaults.inc
@include12=#ROOTCONFIGPATH#SignalRGB\Defaults.inc
@include13=#ROOTCONFIGPATH#DeepCool\Defaults.inc
@include14=#ROOTCONFIGPATH#Controllers\Defaults.inc
@include15=#ROOTCONFIGPATH#SettingsButton\Defaults.inc
@include16=#@#User.inc
OnbStep=welcome
OnbOnly=
OnbPre=0
OnbSkip=
OnbSel=
OnbPage=0
OnbScreen=
OnbEdge=
OnbPlaced=0
@include17=#@#State.inc
Tab=Onboarding
@include18=#@#Core.inc
; One resolved tooltip switch: hidden only when TooltipsAll is off.
TipHide=#TipHidden1#
@include19=#@#Styles.inc
@include20=#@#Settings\Controls.inc
@include21=#@#Settings\Chrome.inc

; ---------- Logic ----------

[mOnboarding]
Measure=Script
ScriptFile=#@#Scripts\Onboarding.lua
UpdateDivider=2

[mOS]
Measure=Plugin
Plugin=SysInfo
SysInfoType=OS_VERSION
UpdateDivider=-1

[mRun]
; Onboarding.lua sets Program and Parameter from Setup\Helpers.txt, only for
; the helper of the selected item, only after RUN IT FOR ME.
Measure=Plugin
Plugin=RunCommand
Program=
Parameter=
State=Hide
OutputType=ANSI
Timeout=600000
FinishAction=[!CommandMeasure mOnboarding "RunDone()"]

; ---------- Styles ----------

[sBody]
X=(#ColL#*#PS#)
W=(624*#PS#)
ClipString=2
FontFace=#FontFace#
FontSize=(9.75*#PS#)
FontWeight=400
FontColor=#Ink#,200
StringEffect=Shadow
FontEffectColor=#Shadow#
AntiAlias=1
DynamicVariables=1

[sDet]
X=(#ColL#*#PS#)
W=(624*#PS#)
ClipString=2
FontFace=#FontFace#
FontSize=(9*#PS#)
FontWeight=400
FontColor=#Ink#,170
StringEffect=Shadow
FontEffectColor=#Shadow#
AntiAlias=1
DynamicVariables=1

[sCmd]
