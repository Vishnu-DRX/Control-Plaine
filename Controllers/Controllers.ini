; Control-Plaine | Controllers
; What it shows: connected game controllers in a vertical list, one row each:
;   icon, then battery. At rest a battery shows only when it is under
;   ControllersBatteryShow; hovering the skin shows every battery, and the
;   hovered row brightens, shows its name and dims the others. Low batteries
;   are orange, charging ones accent with a bolt. Hidden while nothing is
;   connected.
; Designed for: an Xbox Wireless Controller over Bluetooth, a DualSense used
;   with DSX (Steam, v3) and a Moza wheel base with Moza Pit House.
; How it works: a hidden PowerShell helper (@Resources\Scripts\Controllers.ps1)
;   finds the controllers and their battery and writes them to a file in
;   %TEMP%; Controllers.lua reads it. Rainmeter stops the helper when the
;   skin is closed or refreshed.
; Adjust: ControllersBatteryShow, ControllersDualSenseApp (what a DualSense
;   click opens), ControllersWheelApp (Moza click), ControllersOther (any
;   other controller), ControllersBatteryLow, ControllersPoll,
;   ControllersBatteryPoll, ControllersDsxPort. See Controllers\Defaults.inc.
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
Group=ControlPlaine
ContextTitle=Control-Plaine settings
ContextAction=[!ActivateConfig "#ROOTCONFIG#\Settings" "Controllers.ini"]
MouseOverAction=[!CommandMeasure mFade "Stop 2"][!CommandMeasure mFade "Execute 1"]
MouseLeaveAction=[!CommandMeasure mFade "Stop 1"][!CommandMeasure mFade "Execute 2"]
OnRefreshAction=[!CommandMeasure mHelper "Run"]

[Metadata]
Name=Control-Plaine | Controllers
Author=Vishnu A
Information=Connected game controllers with their battery. Hover for names and every battery; click a controller to open its app.
Version=2.0.0
License=CC BY-NC-SA 4.0

[Variables]
@include=#@#Theme.inc
@include2=#@#Defaults.inc
@include3=#ROOTCONFIGPATH#Controllers\Defaults.inc
@include4=#@#User.inc
@include5=#@#State.inc
; Hidden until the first read finds a controller.
SelfHidden=1
; Rows shown, and the row last hovered (0 = none yet). Count is set by
; Controllers.lua. The hovered row's name, brightness and the dimming of the
; others all follow #Reveal#, so they fade in and out with the skin.
Count=0
LastRow=0
; Controller icons are one canvas (39 x 40 px at SizeBoost 1.25 = 31.2 x 32 here; each glyph 28 px wide like the
; other row icons, padded 5 px left, centred vertically), so they sit on the same grid as the other skins' icons.
CtlW=31.2
; Battery glyph in whole pixels, so the outline is one crisp pixel line at any
; size: line width, inner width and height of the outline.
BatS=(Max(1,Round(1*#Sz#)))
BatW=(Round(17*#Sz#))
BatH=(Round(9*#Sz#))
Row1Icon=controller-xbox
Row1Bat=-1
Row1Chg=0
Row1Name=
Row1Color=#Ink#
Row1Target=#ControllersOther#
Row1Tip=
Row1Proc=
Row2Icon=controller-xbox
Row2Bat=-1
Row2Chg=0
Row2Name=
Row2Color=#Ink#
Row2Target=#ControllersOther#
Row2Tip=
Row2Proc=
Row3Icon=controller-xbox
Row3Bat=-1
Row3Chg=0
Row3Name=
Row3Color=#Ink#
Row3Target=#ControllersOther#
Row3Tip=
Row3Proc=
Row4Icon=controller-xbox
Row4Bat=-1
Row4Chg=0
Row4Name=
Row4Color=#Ink#
Row4Target=#ControllersOther#
Row4Tip=
Row4Proc=
@include6=#@#Core.inc
Sz=(#Scale#*#SizeBoost#)
@include7=#@#Styles.inc

; ---------- Measures ----------

[mHelper]
; Hidden PowerShell helper. State=Hide makes Rainmeter kill it when the skin
; is refreshed or closed, or Rainmeter exits.
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -NonInteractive -ExecutionPolicy Bypass -WindowStyle Hidden -File "#@#Scripts\Controllers.ps1" -Poll #ControllersPoll# -BatteryPoll #ControllersBatteryPoll# -DsxPort #ControllersDsxPort#
State=Hide

[mControllers]
Measure=Script
ScriptFile=#@#Scripts\Controllers.lua

; ---------- Rows ----------
; Up to four rows, 40 px apart, each IconBox high like the other skins. Each row: icon, battery glyph, percent, name,
; and on top a transparent hit area that takes the hover and the click.

[Row1Icon]
Meter=Image
MeterStyle=sIcon
ImageName=#@#Icons\#Row1Icon#.png
X=0
Y=(0*#Sz#)
W=(#CtlW#*#Sz#)
H=(#IconBox#*#Sz#)
ImageAlpha=(#LastRow#=0 ? #AlphaDetail# : (#AlphaDetail#+((#LastRow#=1 ? #AlphaHover# : #AlphaDim#)-#AlphaDetail#)*#Reveal#))
MouseActionCursor=0
PreserveAspectRatio=1
Group=Reveal | Row1
Hidden=1

[Row1Name]
Meter=String
MeterStyle=sDetail
X=((#CtlW#+4)*#Sz#)
Y=(16*#Sz#)
StringAlign=LeftCenter
InlineSetting=CharacterSpacing | 0 | (#TrackDetail#*#Sz#)
FontColor=#Ink#,(#LastRow#=1 ? #AlphaHover#*#Reveal# : 0)
FontEffectColor=#ShadowRGB#,((#LastRow#=1 ? #AlphaHover#*#Reveal# : 0)*#ShadowK#)
Text=#Row1Name#
Group=Reveal | Row1
Hidden=1

[Row1Bat]
Meter=Shape
X=(Round([Row1Name:XW]+10*#Sz#))
Y=(Round(16*#Sz#-(#BatH#+#BatS#)/2))
Shape=Rectangle (#BatS#/2),(#BatS#/2),#BatW#,#BatH#,(2*#Sz#) | Fill Color 0,0,0,0 | StrokeWidth #BatS# | Stroke Color #Row1Color#,((#Row1Bat# < 0 ? 0 : Max((#Row1Bat# < #ControllersBatteryShow# ? 1 : 0), #Reveal#))*(#LastRow#=0 ? #AlphaValue# : (#AlphaValue#+((#LastRow#=1 ? #AlphaHover# : #AlphaDim#)-#AlphaValue#)*#Reveal#)))
Shape2=Rectangle (#BatW#+#BatS#),((#BatH#+#BatS#)/2-Trunc(2*#Sz#)),Round(1.5*#Sz#),(2*Trunc(2*#Sz#)),(0.5*#Sz#) | StrokeWidth 0 | Fill Color #Row1Color#,((#Row1Bat# < 0 ? 0 : Max((#Row1Bat# < #ControllersBatteryShow# ? 1 : 0), #Reveal#))*(#LastRow#=0 ? #AlphaValue# : (#AlphaValue#+((#LastRow#=1 ? #AlphaHover# : #AlphaDim#)-#AlphaValue#)*#Reveal#)))
Shape3=Rectangle (#BatS#+1),(#BatS#+1),(Max(#Row1Bat#,8)*0.14*#Sz#),(#BatH#-#BatS#-2),(1*#Sz#) | StrokeWidth 0 | Fill Color #Row1Color#,((#Row1Bat# < 0 ? 0 : Max((#Row1Bat# < #ControllersBatteryShow# ? 1 : 0), #Reveal#))*(#LastRow#=0 ? #AlphaValue# : (#AlphaValue#+((#LastRow#=1 ? #AlphaHover# : #AlphaDim#)-#AlphaValue#)*#Reveal#)))
Shape4=Path Bolt | Fill Color 0,0,0,0 | StrokeWidth (1.1*#Sz#) | Stroke Color #Dark#,(#Row1Chg#*(#Row1Bat# < 0 ? 0 : Max((#Row1Bat# < #ControllersBatteryShow# ? 1 : 0), #Reveal#))*(#LastRow#=0 ? #AlphaValue# : (#AlphaValue#+((#LastRow#=1 ? #AlphaHover# : #AlphaDim#)-#AlphaValue#)*#Reveal#))) | StrokeStartCap Round | StrokeEndCap Round | StrokeLineJoin Round
Bolt=(10*#Sz#),(2.2*#Sz#) | LineTo (8*#Sz#),(5.2*#Sz#) | LineTo (10*#Sz#),(5.2*#Sz#) | LineTo (8.4*#Sz#),(7.8*#Sz#)
AntiAlias=1
DynamicVariables=1
Group=Reveal | Row1
Hidden=1

[Row1Pct]
Meter=String
MeterStyle=sDetail
X=([Row1Name:XW]+36*#Sz#)
DynamicVariables=1
Y=(16*#Sz#)
StringAlign=LeftCenter
InlineSetting=CharacterSpacing | 0 | (#TrackDetail#*#Sz#)
FontColor=#Row1Color#,((#Row1Bat# < 0 ? 0 : Max((#Row1Bat# < #ControllersBatteryShow# ? 1 : 0), #Reveal#))*(#LastRow#=0 ? #AlphaValue# : (#AlphaValue#+((#LastRow#=1 ? #AlphaHover# : #AlphaDim#)-#AlphaValue#)*#Reveal#)))
FontEffectColor=#ShadowRGB#,(((#Row1Bat# < 0 ? 0 : Max((#Row1Bat# < #ControllersBatteryShow# ? 1 : 0), #Reveal#))*(#LastRow#=0 ? #AlphaValue# : (#AlphaValue#+((#LastRow#=1 ? #AlphaHover# : #AlphaDim#)-#AlphaValue#)*#Reveal#)))*#ShadowK#)
Text=#Row1Bat#%
Group=Reveal | Row1
Hidden=1

[Row1Hit]
