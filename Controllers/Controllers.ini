MouseOverAction=[!SetVariable LastRow 1][!UpdateMeterGroup Reveal][!Redraw]
Hidden=(#Count# < 1 || (#Row1Kind#=1 ? #ControllersHasDsx# : (#Row1Kind#=2 ? #ControllersHasWheel# : #ControllersHasOther#)) = 0)

