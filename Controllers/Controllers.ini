FontEffectColor=#ShadowRGB#,(((#Row1Bat# < 0 ? 0 : Max((#Row1Bat# < #ControllersBatteryShow# ? 1 : 0), #Reveal#))*(#HoverRow#=0 ? #AlphaValue# : (#HoverRow#=1 ? #AlphaHover# : #AlphaDim#)))*#ShadowK#)
