; Control-Plaine | Controllers
; What it shows: connected game controllers in a vertical list, one row each:
;   icon, then battery. At rest a battery shows only when it is under
;   ControllersBatteryShow; hovering the skin shows every battery, and the
;   hovered row brightens, shows its name and dims the others. Low batteries
;   are orange, charging ones accent with a bolt. Hidden while nothing is
;   connected.
; Designed for: an Xbox Wireless Controller over Bluetooth, a DualSense used
;   with DSX (Steam, v3) and a Moza wheel base with Moza Pit House.
; How it works: a hidden PowerShell helper (@Resources\Scripts\Controllers.ps1)
;   finds the controllers and their battery and writes them to a file in
;   %TEMP%; Controllers.lua reads it. Rainmeter stops the helper when the
;   skin is closed or refreshed.
; Adjust: ControllersBatteryShow, ControllersDualSenseApp (what a DualSense
;   click opens), ControllersWheelApp (Moza click), ControllersOther (any
;   other controller), ControllersBatteryLow, ControllersPoll,
;   ControllersBatteryPoll, ControllersDsxPort. See Controllers\Defaults.inc.
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
Group=ControlPlaine
ContextTitle=Control-Plaine settings
ContextAction=[!ActivateConfig "#ROOTCONFIG#\Settings" "Controllers.ini"]
MouseOverAction=[!CommandMeasure mFade "Stop 2"][!CommandMeasure mFade "Execute 1"]
MouseLeaveAction=[!CommandMeasure mFade "Stop 1"][!CommandMeasure mFade "Execute 2"]
OnRefreshAction=[!CommandMeasure mHelper "Run"]

[Metadata]
Name=Control-Plaine | Controllers
Author=Vishnu A
Information=Connected game controllers with their battery. Hover for names and every battery; click a controller to open its app.
Version=2.0.0
License=CC BY-NC-SA 4.0

[Variables]
@include=#@#Theme.inc
@include2=#@#Defaults.inc
@include3=#ROOTCONFIGPATH#Controllers\Defaults.inc
@include4=#@#User.inc
@include5=#@#State.inc
; Hidden until the first read finds a controller.
SelfHidden=1
; Rows shown, and the hovered row (0 = none). Set by Controllers.lua.
Count=0
HoverRow=0
; Controller icons are drawn larger than the suite's 24 px icons (canvas).
CtlIcon=32
; Space above the first row, so the top icon's baked shadow is not clipped.
Top=4
Row1Icon=controller-xbox
Row1Bat=-1
Row1Chg=0
Row1Name=
Row1Color=#Ink#
Row1Target=#ControllersOther#
Row1Tip=
Row2Icon=controller-xbox
Row2Bat=-1
Row2Chg=0
Row2Name=
Row2Color=#Ink#
Row2Target=#ControllersOther#
Row2Tip=
Row3Icon=controller-xbox
Row3Bat=-1
Row3Chg=0
Row3Name=
Row3Color=#Ink#
Row3Target=#ControllersOther#
Row3Tip=
Row4Icon=controller-xbox
Row4Bat=-1
Row4Chg=0
Row4Name=
Row4Color=#Ink#
Row4Target=#ControllersOther#
Row4Tip=
@include6=#@#Core.inc
@include7=#@#Styles.inc

; ---------- Measures ----------

[mHelper]
; Hidden PowerShell helper. State=Hide makes Rainmeter kill it when the skin
; is refreshed or closed, or Rainmeter exits.
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -NonInteractive -ExecutionPolicy Bypass -WindowStyle Hidden -File "#@#Scripts\Controllers.ps1" -Poll #ControllersPoll# -BatteryPoll #ControllersBatteryPoll# -DsxPort #ControllersDsxPort#
State=Hide

[mControllers]
Measure=Script
ScriptFile=#@#Scripts\Controllers.lua

; ---------- Rows ----------
; Up to four rows, 50 px apart. Each row: icon, battery glyph, percent, name,
; and on top a transparent hit area that takes the hover and the click.

[Row1Icon]
Meter=Image
MeterStyle=sIcon
ImageName=#@#Icons\#Row1Icon#.png
X=(((44-#CtlIcon#)/2-#IconPad#*#CtlIcon#/#IconSize#)*#Scale#)
Y=((#Top#+18)*#Scale#-#CtlIcon#*#IconBox#/#IconSize#/2*#Scale#)
W=(#CtlIcon#*#IconBox#/#IconSize#*#Scale#)
H=(#CtlIcon#*#IconBox#/#IconSize#*#Scale#)
ImageAlpha=(#HoverRow#=0 ? #AlphaDetail# : (#HoverRow#=1 ? #AlphaHover# : #AlphaDim#))
MouseActionCursor=0
Group=Reveal | Row1
Hidden=1

[Row1Bat]
Meter=Shape
X=(56*#Scale#)
Y=((#Top#+18-5)*#Scale#)
Shape=Rectangle (0.5*#Scale#),(0.5*#Scale#),(17*#Scale#),(9*#Scale#),(2*#Scale#) | Fill Color 0,0,0,0 | StrokeWidth (1*#Scale#) | Stroke Color #Row1Color#,((#Row1Bat# < 0 ? 0 : Max((#Row1Bat# < #ControllersBatteryShow# ? 1 : 0), #Reveal#))*(#HoverRow#=0 ? #AlphaValue# : (#HoverRow#=1 ? #AlphaHover# : #AlphaDim#)))
Shape2=Rectangle (18.2*#Scale#),(3*#Scale#),(1.5*#Scale#),(4*#Scale#),(0.5*#Scale#) | StrokeWidth 0 | Fill Color #Row1Color#,((#Row1Bat# < 0 ? 0 : Max((#Row1Bat# < #ControllersBatteryShow# ? 1 : 0), #Reveal#))*(#HoverRow#=0 ? #AlphaValue# : (#HoverRow#=1 ? #AlphaHover# : #AlphaDim#)))
Shape3=Rectangle (2*#Scale#),(2*#Scale#),(Max(#Row1Bat#,8)*0.14*#Scale#),(6*#Scale#),(1*#Scale#) | StrokeWidth 0 | Fill Color #Row1Color#,((#Row1Bat# < 0 ? 0 : Max((#Row1Bat# < #ControllersBatteryShow# ? 1 : 0), #Reveal#))*(#HoverRow#=0 ? #AlphaValue# : (#HoverRow#=1 ? #AlphaHover# : #AlphaDim#)))
Shape4=Path Bolt | Fill Color 0,0,0,0 | StrokeWidth (1.1*#Scale#) | Stroke Color #Dark#,(#Row1Chg#*(#Row1Bat# < 0 ? 0 : Max((#Row1Bat# < #ControllersBatteryShow# ? 1 : 0), #Reveal#))*(#HoverRow#=0 ? #AlphaValue# : (#HoverRow#=1 ? #AlphaHover# : #AlphaDim#))) | StrokeStartCap Round | StrokeEndCap Round | StrokeLineJoin Round
Bolt=(10*#Scale#),(2.2*#Scale#) | LineTo (8*#Scale#),(5.2*#Scale#) | LineTo (10*#Scale#),(5.2*#Scale#) | LineTo (8.4*#Scale#),(7.8*#Scale#)
AntiAlias=1
DynamicVariables=1
Group=Reveal | Row1
Hidden=1

[Row1Pct]
Meter=String
MeterStyle=sDetail
X=(82*#Scale#)
Y=((#Top#+18)*#Scale#)
StringAlign=LeftCenter
InlineSetting=CharacterSpacing | 0 | (#TrackDetail#*#Scale#)
FontColor=#Row1Color#,((#Row1Bat# < 0 ? 0 : Max((#Row1Bat# < #ControllersBatteryShow# ? 1 : 0), #Reveal#))*(#HoverRow#=0 ? #AlphaValue# : (#HoverRow#=1 ? #AlphaHover# : #AlphaDim#)))
Text=#Row1Bat#%
Group=Reveal | Row1
Hidden=1

[Row1Name]
