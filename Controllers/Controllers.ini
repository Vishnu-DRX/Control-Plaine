Meter=Shape
X=(#Mir#*Round(#NameA#-[Row4Name:W]-10*#Sz#-#BatTot#)+(1-#Mir#)*Round([Row4Name:XW]+10*#Sz#))
Y=(Round(136*#Sz#-(#BatH#+#BatS#)/2))
Shape=Rectangle (#BatS#/2),(#BatS#/2),#BatW#,#BatH#,(2*#Sz#) | Fill Color 0,0,0,0 | StrokeWidth #BatS# | Stroke Color #Row4Color#,((#Row4Bat# < 0 ? 0 : Max((#Row4Bat# < #ControllersBatteryShow# ? 1 : 0), #Reveal#))*(#LastRow#=0 ? #AlphaValue# : (#AlphaValue#+((#LastRow#=4 ? #AlphaHover# : #AlphaDim#)-#AlphaValue#)*#Reveal#)))
Shape2=Rectangle (#BatW#+#BatS#),((#BatH#+#BatS#)/2-Trunc(2*#Sz#)),Round(1.5*#Sz#),(2*Trunc(2*#Sz#)),(0.5*#Sz#) | StrokeWidth 0 | Fill Color #Row4Color#,((#Row4Bat# < 0 ? 0 : Max((#Row4Bat# < #ControllersBatteryShow# ? 1 : 0), #Reveal#))*(#LastRow#=0 ? #AlphaValue# : (#AlphaValue#+((#LastRow#=4 ? #AlphaHover# : #AlphaDim#)-#AlphaValue#)*#Reveal#)))
Shape3=Rectangle (#BatS#+1),(#BatS#+1),(Max(#Row4Bat#,8)*0.14*#Sz#),(#BatH#-#BatS#-2),(1*#Sz#) | StrokeWidth 0 | Fill Color #Row4Color#,((#Row4Bat# < 0 ? 0 : Max((#Row4Bat# < #ControllersBatteryShow# ? 1 : 0), #Reveal#))*(#LastRow#=0 ? #AlphaValue# : (#AlphaValue#+((#LastRow#=4 ? #AlphaHover# : #AlphaDim#)-#AlphaValue#)*#Reveal#)))
Shape4=Path Bolt | Fill Color 0,0,0,0 | StrokeWidth (1.1*#Sz#) | Stroke Color #InkContrast#,(#Row4Chg#*((#Row4Bat# < 0 ? 0 : Max((#Row4Bat# < #ControllersBatteryShow# ? 1 : 0), #Reveal#))*(#LastRow#=0 ? #AlphaValue# : (#AlphaValue#+((#LastRow#=4 ? #AlphaHover# : #AlphaDim#)-#AlphaValue#)*#Reveal#)))) | StrokeStartCap Round | StrokeEndCap Round | StrokeLineJoin Round
Bolt=(10*#Sz#),(2.2*#Sz#) | LineTo (8*#Sz#),(5.2*#Sz#) | LineTo (10*#Sz#),(5.2*#Sz#) | LineTo (8.4*#Sz#),(7.8*#Sz#)
AntiAlias=1
DynamicVariables=1
Group=Reveal | Row4
Hidden=1

[Row4Pct]
Meter=String
MeterStyle=sDetail
X=(#Mir#*Round(#NameA#-[Row4Name:W]-36*#Sz#)+(1-#Mir#)*([Row4Name:XW]+36*#Sz#))
DynamicVariables=1
Y=(136*#Sz#)
StringAlign=#TA#
InlineSetting=CharacterSpacing | (#Lead#*#TrackDetail#*#Sz#) | (#Trail#*#TrackDetail#*#Sz#)
FontColor=#Row4Color#,((#Row4Bat# < 0 ? 0 : Max((#Row4Bat# < #ControllersBatteryShow# ? 1 : 0), #Reveal#))*(#LastRow#=0 ? #AlphaValue# : (#AlphaValue#+((#LastRow#=4 ? #AlphaHover# : #AlphaDim#)-#AlphaValue#)*#Reveal#)))
FontEffectColor=#ShadowRGB#,(((#Row4Bat# < 0 ? 0 : Max((#Row4Bat# < #ControllersBatteryShow# ? 1 : 0), #Reveal#))*(#LastRow#=0 ? #AlphaValue# : (#AlphaValue#+((#LastRow#=4 ? #AlphaHover# : #AlphaDim#)-#AlphaValue#)*#Reveal#)))*#ShadowK#)
Text=#Row4Bat#%
Group=Reveal | Row4
Hidden=1

[Row4Hit]
; Hover only. The click and tooltip are on Row4Click, which is hidden when the
; function this row would open is missing (ControllersHas<Dsx|Wheel|Other>).
Meter=Image
MeterStyle=sHit
X=0
Y=(120*#Sz#)
W=#BoxW#
H=(#IconBox#*#Sz#)
MouseActionCursor=0
MouseOverAction=[!SetVariable LastRow 4][!UpdateMeterGroup Reveal][!Redraw]
Group=Row4
Hidden=1

[Row4Click]
; Row4Kind (1 DualSense, 2 wheel, 3 other) is set by Controllers.lua. Hidden
; while the row is not shown or its Has flag is 0: no cursor, tooltip or click.
Meter=Image
MeterStyle=sHit
X=0
Y=(120*#Sz#)
W=#BoxW#
H=(#IconBox#*#Sz#)
MouseActionCursor=1
ToolTipText=#Row4Tip#
LeftMouseUpAction=[powershell.exe -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "#@#Scripts\OpenApp.ps1" -Target "#Row4Target#" -Process "#Row4Proc#"]
MouseOverAction=[!SetVariable LastRow 4][!UpdateMeterGroup Reveal][!Redraw]
Hidden=(#Count# < 4 || (#Row4Kind#=1 ? #ControllersHasDsx# : (#Row4Kind#=2 ? #ControllersHasWheel# : #ControllersHasOther#)) = 0)
