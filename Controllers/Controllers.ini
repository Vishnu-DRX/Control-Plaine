Meter=Image
MeterStyle=sHit
X=0
Y=(0*#Sz#)
W=#BoxW#
H=(#IconBox#*#Sz#)
MouseActionCursor=0
MouseOverAction=[!SetVariable LastRow 1][!UpdateMeterGroup Reveal][!Redraw]
Group=Row1
Hidden=1

[Row1Click]
; Row1Kind (1 DualSense, 2 wheel, 3 other) is set by Controllers.lua. Hidden
