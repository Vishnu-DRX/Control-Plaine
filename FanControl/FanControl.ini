; Control-Plaine | FanControl
; What it shows: a fan icon. On hover, the average fan speed (FANS 55%) and a
;   snowflake.
;   Click the snowflake to switch every fan to 100% and back: the % climbs (or
;   falls) with SPEEDING UP / SLOWING DOWN and a spinner until the fans have
;   got there. While MAX is on the fan icon and snowflake are in the accent
;   colour. Click the fan icon to open Fan Control.
; Designed for: Fan Control by Rem0o, V277 (https://getfancontrol.com), with fan
;   speeds read from Fan Control itself (its local sensor feed, no HWiNFO).
;   Fan Control needs admin, and so does its sensor feed, so MAX, open and the
;   sensor reader go through scheduled tasks made once by tools\fan-tasks.ps1
;   (run it as admin; the reader also needs PowerShell 7). No UAC prompt after
;   that. The reader writes %ProgramData%\ControlPlaine\FanControl\fans.txt and the skin reads it.
; Adjust (Settings > FAN CONTROL, or User.inc):
;   FanControlPath, FanControlNormal, FanControlMax - program and profile names
;   FanControlIgnoreStopped - leave fans that are not turning out of the average
;   FanControlAlign   - left or right: which screen edge it sits on
;   FanControlDetails - hover or always: when the text and snowflake show
;   FanControlTheme   - auto, dark or light: colours for this skin
;   FanControlUseTasks=0 to launch FanControl.exe directly instead.
; Other fan software: point FanControlPath at it and replace the -c commands in
;   tools\fan-tasks.ps1; the sensor part needs Fan Control's feed.
[Rainmeter]
; FanControlTooltips=0 hides every tooltip of this skin (see Core.inc).
ToolTipHidden=#TipHidden[#FanControlTooltips]#
Update=1000
AccurateText=1
DynamicWindowSize=1
Group=ControlPlaine
ContextTitle=Control-Plaine settings
ContextAction=[!ActivateConfig "#ROOTCONFIG#\Settings" "FanControl.ini"]
MouseOverAction=[!CommandMeasure mFade "Stop 2"][!CommandMeasure mFade "Execute 1"]
MouseLeaveAction=[!CommandMeasure mFade "Stop 1"][!CommandMeasure mFade "Execute 2"]

[Metadata]
Name=Control-Plaine | FanControl
Author=Vishnu A
Information=Average fan speed and a MAX switch for Fan Control.
Version=2.0.1
License=MIT

[Variables]
@include=#@#Theme.inc
@include2=#@#Defaults.inc
@include3=#ROOTCONFIGPATH#FanControl\Defaults.inc
@include4=#@#User.inc
@include5=#@#State.inc
; Set by FanControl.lua.
FanText=--
FanTip=
MaxOn=#FanControlMaxOn#
; Busy=1 while the fans speed up or slow down after the snowflake is clicked.
Busy=0
StatusText=
IconTint=#Ink#
SnowTint=#Ink#
SnowTip=Set all fans to 100%
; Read by Core.inc (Scripts\Core.lua) to arrange the skin; see specs/alignment.md.
SkinSide=#FanControlAlign#
SkinTheme=#FanControlTheme#
SkinDetails=#FanControlDetails#
@include6=#@#Core.inc
Sz=(#Scale#*#SizeBoost#)
; The fixed box. Left and right use the same one, so flipping the side never
; changes the skin's footprint or hit area. Whole pixels, so right-anchored
; text and icons land on whole pixels too.
BoxW=(Round(300*#Sz#))
@include7=#@#Styles.inc

; ---------- Measures ----------

[mFanControl]
; Averages the fan duty from the sensor file, keeps MAX in step with Fan
; Control's active config, and starts the sensor reader task.
Measure=Script
ScriptFile=#@#Scripts\FanControl.lua
UpdateDivider=2

[mBlocked]
; A missing required need (FanControlNeedBlocked=1, set by the needs check) hides the whole
; skin through the shared mVisible (Core.inc). Only on a change.
Measure=Calc
Formula=#FanControlNeedBlocked#
DynamicVariables=1
IfCondition=mBlocked = 1
IfTrueAction=[!SetVariable SelfHidden 1][!UpdateMeasure mVisible]
IfFalseAction=[!SetVariable SelfHidden 0][!UpdateMeasure mVisible]

[mTasks]
; 1 while the scheduled tasks are used: FanControlUseTasks=1 and they exist
; (FanControlHasTasks, set by the needs check). Otherwise FanControl.lua
; starts FanControl.exe itself (Windows asks for admin).
Measure=Calc
Formula=(#FanControlUseTasks#*#FanControlHasTasks#)
DynamicVariables=1

[mSpin]
; Turns the spinner while the fans change speed (FanControl.lua).
Measure=Plugin
Plugin=ActionTimer
ActionList1=Repeat Spin,40,100000
Spin=[!CommandMeasure mFanControl "Spin()"]
IgnoreWarnings=1

[mRamp]
; Moves the shown % toward its target while the fans change speed.
Measure=Plugin
Plugin=ActionTimer
ActionList1=Repeat Ramp,200,300
Ramp=[!CommandMeasure mFanControl "Ramp()"]
IgnoreWarnings=1

; Starts the sensor reader task (\ControlPlaine\FanSensors). It is a no-op
; while one is already running (the reader allows one instance).
[mSensors]
Measure=Plugin
Plugin=RunCommand
Program=schtasks.exe
Parameter=/run /tn ControlPlaine\FanSensors
State=Hide

; Runs Fan Control commands. FanControl.lua sets Program/Parameter.
[mRun]
Measure=Plugin
Plugin=RunCommand
Program=schtasks.exe
Parameter=
StartInFolder=
State=Hide
DynamicVariables=1

; ---------- Meters ----------

[Hit]
; The whole box, wide enough for FANS 100%, SLOWING DOWN and the spinner, so
; the window never resizes.
Meter=Image
MeterStyle=sHit
X=0
Y=0
W=#BoxW#
H=(#IconBox#*#Sz#)

[Icon]
; Accent while MAX is on.
Meter=Image
MeterStyle=sIconFade
ImageName=#@#Icons\fan.png
ImageTint=#IconTint#
X=(#Mir#*Round(#BoxW#-#IconBox#*#Sz#))
Y=0
ToolTipText=Open Fan Control
LeftMouseUpAction=[!CommandMeasure mFanControl "Open()"]

[Value]
; Same type as the other app skins' text (sReveal). Stays visible while the
; speed changes. Hidden while the sensor feed is missing (FanControlHasSensors=0).
Meter=String
MeterStyle=sReveal
Hidden=(1-#FanControlHasSensors#)
FontColor=#Ink#,(#AlphaHover#*Max(#Reveal#,#Busy#))
InlineSetting=CharacterSpacing | (#Lead#*#TrackDetail#*#Sz#) | (#Trail#*#TrackDetail#*#Sz#)
X=(#Mir#*Round(#BoxW#-(#IconBox#+4)*#Sz#)+(1-#Mir#)*(#IconBox#+4)*#Sz#)
Y=((#IconBox#/2)*#Sz#)
StringAlign=#TA#
ToolTipText=#FanTip#
Text=Fans #FanText#

[RefValue]
; Invisible "FANS 100%" at the value's place: the SPEEDING UP text sits after
; the widest value, so 100% never runs into it and nothing moves as the value
; changes.
Meter=String
MeterStyle=sReveal
FontColor=0,0,0,0
FontEffectColor=0,0,0,0
InlineSetting=CharacterSpacing | (#Lead#*#TrackDetail#*#Sz#) | (#Trail#*#TrackDetail#*#Sz#)
X=(#Mir#*Round(#BoxW#-(#IconBox#+4)*#Sz#)+(1-#Mir#)*(#IconBox#+4)*#Sz#)
Y=((#IconBox#/2)*#Sz#)
StringAlign=#TA#
Text=Fans 100%

[Snow]
; MAX switch: all fans to 100% and back. Accent while on. Hidden while the MAX
; profile file is missing (FanControlHasMax=0). On the inner side of
; the value, 8 px from it, whichever side the skin sits on. Right: its left edge
; is the value's anchor minus the value's width, the gap and its own width.
Meter=Image
ImageName=#@#Icons\snowflake.png
ImageTint=#SnowTint#
ImageAlpha=(#AlphaHover#*#Reveal#*(1-#Busy#))
Hidden=(1-#FanControlHasMax#)
X=(#Mir#*Round(#BoxW#-(#IconBox#+4)*#Sz#-[Value:W]-8*#Sz#-24*#Sz#)+(1-#Mir#)*([Value:XW]+8*#Sz#))
Y=(((#IconBox#-24)/2)*#Sz#)
W=(24*#Sz#)
H=(24*#Sz#)
SolidColor=0,0,0,1
AntiAlias=1
MouseActionCursor=1
DynamicVariables=1
Group=Reveal
ToolTipText=#SnowTip#
MouseOverAction=[!CommandMeasure mFanControl "HoverSnow(1)"]
MouseLeaveAction=[!CommandMeasure mFanControl "HoverSnow(0)"]
LeftMouseUpAction=[!CommandMeasure mFanControl "ToggleMax()"]

[Status]
; SPEEDING UP / SLOWING DOWN while the speed changes (FanControl.lua). On the
; inner side of the widest value, so it never moves with the number.
Meter=String
MeterStyle=sReveal
FontColor=#Accent#,(#AlphaHover#*#Busy#)
InlineSetting=CharacterSpacing | (#Lead#*#TrackDetail#*#Sz#) | (#Trail#*#TrackDetail#*#Sz#)
X=(#Mir#*Round(#BoxW#-(#IconBox#+4)*#Sz#-[RefValue:W]-10*#Sz#)+(1-#Mir#)*([RefValue:XW]+10*#Sz#))
Y=((#IconBox#/2)*#Sz#)
StringAlign=#TA#
Text=#StatusText#

[Spinner]
; Loader on the inner side of the status text (Spinner.lua draws it). It is
; 2*(Round(5*Sz)+Max(1,Round(1.5*Sz))) px square; on the right its left edge is
; the status text's left edge minus the gap and that width.
Meter=Shape
X=(#Mir#*Round(#BoxW#-(#IconBox#+4)*#Sz#-[RefValue:W]-10*#Sz#-[Status:W]-6*#Sz#-2*(Round(5*#Sz#)+Max(1,Round(1.5*#Sz#))))+(1-#Mir#)*([Status:XW]+6*#Sz#))
Y=(Round(#IconBox#/2*#Sz#)-Round(5*#Sz#)-Max(1,Round(1.5*#Sz#)))
Shape=Ellipse 1,1,1 | StrokeWidth 0
AntiAlias=1
DynamicVariables=1
Hidden=1
