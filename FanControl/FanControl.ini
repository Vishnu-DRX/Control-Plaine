; Control-Plaine | FanControl
; What it shows: a fan icon. On hover, the average fan speed (%) and a MAX
;   bubble. Click MAX to switch every fan to 100% and back; while MAX is on the
;   bubble stays lit in the accent colour. Click the icon to open Fan Control.
; Designed for: Fan Control by Rem0o, V277 (https://getfancontrol.com), with fan
;   speeds read from HWiNFO's Gadget reporting (HWiNFO 7.02 or later).
;   Fan Control needs admin, so MAX and open go through scheduled tasks made
;   once by tools\fan-tasks.ps1 (run it as admin). No UAC prompt after that.
; Adjust (Settings > FAN CONTROL, or User.inc):
;   FanControlPath, FanControlNormal, FanControlMax - program and profile names
;   FanControlIndexes, FanControlMaxRPM, FanControlMode - which HWiNFO sensors
;     to average and how (HWiNFO > Sensors > Configure > HWiNFO Gadget: tick
;     "Enable reporting to Gadget" and "Report value in Gadget" per fan; the
;     index is shown there)
;   FanControlUseTasks=0 to launch FanControl.exe directly instead.
; Other fan software: point FanControlPath at it and replace the -c commands in
;   tools\fan-tasks.ps1; the sensor part only needs HWiNFO.
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
Group=ControlPlaine
ContextTitle=Control-Plaine settings
ContextAction=[!ActivateConfig "#ROOTCONFIG#\Settings" "FanControl.ini"]
MouseOverAction=[!CommandMeasure mFade "Stop 2"][!CommandMeasure mFade "Execute 1"]
MouseLeaveAction=[!CommandMeasure mFade "Stop 1"][!CommandMeasure mFade "Execute 2"]

[Metadata]
Name=Control-Plaine | FanControl
Author=Vishnu A
Information=Average fan speed and a MAX switch for Fan Control.
Version=2.0.0
License=CC BY-NC-SA 4.0

[Variables]
@include=#@#Theme.inc
@include2=#@#Defaults.inc
@include3=#ROOTCONFIGPATH#FanControl\Defaults.inc
@include4=#@#User.inc
@include5=#@#State.inc
; Set by FanControl.lua.
FanText=--
FanTip=Average fan speed
MaxOn=#FanControlMaxOn#
BubbleInk=#Ink#
@include6=#@#Core.inc
@include7=#@#Styles.inc

; ---------- Measures ----------

; HWiNFO Gadget values. FanControl.lua points each one at an index from
; FanControlIndexes and enables the ones in use.
[mFan1]
Measure=Registry
RegHKey=#FanControlRegHKey#
RegKey=SOFTWARE\HWiNFO64\VSB
RegValue=ValueRaw0
Disabled=1
DynamicVariables=1

[mFan2]
Measure=Registry
RegHKey=#FanControlRegHKey#
RegKey=SOFTWARE\HWiNFO64\VSB
RegValue=ValueRaw1
Disabled=1
DynamicVariables=1

[mFan3]
Measure=Registry
RegHKey=#FanControlRegHKey#
RegKey=SOFTWARE\HWiNFO64\VSB
RegValue=ValueRaw2
Disabled=1
DynamicVariables=1

[mFan4]
Measure=Registry
RegHKey=#FanControlRegHKey#
RegKey=SOFTWARE\HWiNFO64\VSB
RegValue=ValueRaw3
Disabled=1
DynamicVariables=1

[mFan5]
Measure=Registry
RegHKey=#FanControlRegHKey#
RegKey=SOFTWARE\HWiNFO64\VSB
RegValue=ValueRaw4
Disabled=1
DynamicVariables=1

[mFan6]
Measure=Registry
RegHKey=#FanControlRegHKey#
RegKey=SOFTWARE\HWiNFO64\VSB
RegValue=ValueRaw5
Disabled=1
DynamicVariables=1

[mFan7]
Measure=Registry
RegHKey=#FanControlRegHKey#
RegKey=SOFTWARE\HWiNFO64\VSB
RegValue=ValueRaw6
Disabled=1
DynamicVariables=1

[mFan8]
Measure=Registry
RegHKey=#FanControlRegHKey#
RegKey=SOFTWARE\HWiNFO64\VSB
RegValue=ValueRaw7
Disabled=1
DynamicVariables=1

[mFanControl]
; Averages the fans, keeps MAX in step with Fan Control's active config.
Measure=Script
ScriptFile=#@#Scripts\FanControl.lua
UpdateDivider=2

; Runs Fan Control commands. FanControl.lua sets Program/Parameter.
[mRun]
Measure=Plugin
Plugin=RunCommand
Program=schtasks.exe
Parameter=
StartInFolder=
State=Hide
DynamicVariables=1

; ---------- Meters ----------

[Hit]
Meter=Image
MeterStyle=sHit
X=0
Y=0
W=([Bubble:X]+38*#Scale#)
H=(#IconBox#*#Scale#)

[Icon]
Meter=Image
MeterStyle=sIconFade
ImageName=#@#Icons\fan.png
X=0
Y=0
ToolTipText=Open Fan Control
LeftMouseUpAction=[!CommandMeasure mFanControl "Open()"]

[Value]
; Detail type, like the other app skins' labels.
Meter=String
MeterStyle=sReveal
InlineSetting=CharacterSpacing | 0 | (#TrackDetail#*#Scale#)
X=((#IconBox#+4)*#Scale#)
Y=((#IconBox#/2)*#Scale#)
StringAlign=LeftCenter
ToolTipText=#FanTip#
Text=#FanText#

[RefValue]
; Invisible "100%" at the value's place: the bubble sits after the widest
; value, so 100% never runs into it and nothing moves as the value changes.
Meter=String
MeterStyle=sReveal
FontColor=0,0,0,0
FontEffectColor=0,0,0,0
InlineSetting=CharacterSpacing | 0 | (#TrackDetail#*#Scale#)
X=((#IconBox#+4)*#Scale#)
Y=((#IconBox#/2)*#Scale#)
StringAlign=LeftCenter
Text=100%

; Pill: outlined grey while off (hover only), filled accent while on (always).
[Bubble]
Meter=Shape
X=([RefValue:XW]+8*#Scale#)
Y=(8*#Scale#)
Shape=Rectangle (0.5*#Scale#),(0.5*#Scale#),(36*#Scale#),(16*#Scale#),(8*#Scale#) | Fill Color #Accent#,(255*#MaxOn#) | StrokeWidth (1*#Scale#) | Stroke Color #Ink#,((1-#MaxOn#)*#AlphaDetail#*#Reveal#)
SolidColor=0,0,0,1
MouseActionCursor=1
ToolTipText=All fans to 100%
LeftMouseUpAction=[!CommandMeasure mFanControl "ToggleMax()"]
AntiAlias=1
DynamicVariables=1
Group=Reveal

[BubbleText]
Meter=String
MeterStyle=sDetail
FontColor=#BubbleInk#,(#MaxOn#=1 ? 255 : #AlphaHover#*#Reveal#)
FontEffectColor=#ShadowRGB#,((#MaxOn#=1 ? 255 : #AlphaHover#*#Reveal#)*#ShadowK#)
InlineSetting=CharacterSpacing | 0 | (#TrackDetail#*#Scale#)
X=([Bubble:X]+18*#Scale#)
Y=(16.5*#Scale#)
StringAlign=CenterCenter
Text=MAX
