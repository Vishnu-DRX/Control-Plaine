; Control-Plaine | DeepCool
; What it shows: the DeepCool logo, which is also a switch. Accent while the
;   DeepCool app is running, grey when it is closed. Hover shows CASE SCREEN and a bulb;
;   on or off is told by the logo.
;   Click: closed -> start the app hidden in the tray; running -> close it.
;   While it starts or closes, STARTING / STOPPING TELEMETRY and a spinner stay;
;   the state changes once the process list confirms it (closing waits a
;   further DeepCoolOffDelay seconds for the case screen to go dark).
; Designed for: DeepCool 1.2.6 (C:\DeepCool\DeepCool.exe, the app that drives
;   the CH270 DIGITAL case screen). The app has no start-minimized option, so
;   Scripts\HideWindow.ps1 starts it and hides its window (the tray icon stays).
;   Closing uses taskkill (the app only hides to the tray when asked politely).
;   Note: DeepCool's "Deep Cool Helper Service" keeps running either way; check
;   whether the screen goes dark with the app closed before using the
;   CASE SCREEN label.
; Adjust (Settings > DEEPCOOL, or User.inc):
;   DeepCoolAlign, DeepCoolDetails - left or right edge; hover or always
;   DeepCoolTheme - auto, dark or light: colours for this skin
;   DeepCoolPath, DeepCoolProcess - program and its process name
;   DeepCoolStartHidden - 0 to show the window when starting
;   DeepCoolArgs - extra start arguments
;   DeepCoolLabel - app (DEEPCOOL) or screen (CASE SCREEN)
; Other apps: any tray app can be toggled by changing the path and process.
[Rainmeter]
; DeepCoolTooltips=0 hides every tooltip of this skin (see Core.inc).
ToolTipHidden=#TipHidden[#DeepCoolTooltips]#
Update=1000
AccurateText=1
DynamicWindowSize=1
Group=ControlPlaine
ContextTitle=Control-Plaine settings
ContextAction=[!ActivateConfig "#ROOTCONFIG#\Settings" "DeepCool.ini"]
MouseOverAction=[!CommandMeasure mFade "Stop 2"][!CommandMeasure mFade "Execute 1"]
MouseLeaveAction=[!CommandMeasure mFade "Stop 1"][!CommandMeasure mFade "Execute 2"]

[Metadata]
Name=Control-Plaine | DeepCool
Author=Vishnu A
Information=Starts or closes the DeepCool case screen app.
Version=2.0.1
License=MIT

[Variables]
@include=#@#Theme.inc
@include2=#@#Defaults.inc
@include3=#ROOTCONFIGPATH#DeepCool\Defaults.inc
@include4=#@#User.inc
@include5=#@#State.inc
; Set by DeepCool.lua. Busy=1 while starting or closing.
IconTint=#Ink#
StateText=
Busy=0
; Read by Core.inc (Scripts\Core.lua) to arrange the skin; see specs/alignment.md.
SkinSide=#DeepCoolAlign#
SkinTheme=#DeepCoolTheme#
SkinDetails=#DeepCoolDetails#
@include6=#@#Core.inc
Sz=(#Scale#*#SizeBoost#)
; The fixed box, wide enough for STOPPING TELEMETRY and the spinner. Left and
; right use the same one, so flipping the side never changes the footprint or
; hit area. Whole pixels, so right-anchored text and icons land on whole pixels.
BoxW=(Round(230*#Sz#))
@include7=#@#Styles.inc

; ---------- Measures ----------

[mProcess]
; 1 while the app runs, -1 when it does not.
Measure=Process
ProcessName=#DeepCoolProcess#

[mDeepCool]
Measure=Script
ScriptFile=#@#Scripts\DeepCool.lua

[mBlocked]
; A missing required need (DeepCoolNeedBlocked=1, set by the needs check) hides
; the whole skin through the shared mVisible (Core.inc). Only on a change.
Measure=Calc
Formula=#DeepCoolNeedBlocked#
DynamicVariables=1
IfCondition=mBlocked = 1
IfTrueAction=[!SetVariable SelfHidden 1][!UpdateMeasure mVisible]
IfFalseAction=[!SetVariable SelfHidden 0][!UpdateMeasure mVisible]

[mStart]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -NonInteractive -ExecutionPolicy Bypass -WindowStyle Hidden -File "#@#Scripts\HideWindow.ps1" -Path "#DeepCoolPath#" -Arguments "#DeepCoolArgs#"
State=Hide
Timeout=30000

[mSpin]
; Turns the spinner while the app starts or closes (DeepCool.lua).
Measure=Plugin
Plugin=ActionTimer
ActionList1=Repeat Spin,40,100000
Spin=[!CommandMeasure mDeepCool "Spin()"]
IgnoreWarnings=1

[mStartShown]
Measure=Plugin
Plugin=RunCommand
Program=#DeepCoolPath#
Parameter=#DeepCoolArgs#
State=Show

[mStop]
Measure=Plugin
Plugin=RunCommand
Program=taskkill.exe
Parameter=/IM "#DeepCoolProcess#" /T /F
State=Hide

; ---------- Meters ----------

[Hit]
Meter=Image
MeterStyle=sHit
; The whole box, so the window never resizes.
X=0
Y=0
W=#BoxW#
H=(#IconBox#*#Sz#)

[Icon]
Meter=Image
MeterStyle=sIconFade
ImageName=#@#Icons\deepcool.png
ImageTint=#IconTint#
X=(#Mir#*Round(#BoxW#-#IconBox#*#Sz#))
Y=0
LeftMouseUpAction=[!CommandMeasure mDeepCool "Toggle()"]

[State]
Meter=String
MeterStyle=sReveal
FontColor=#Ink#,(#AlphaHover#*Max(#Reveal#,#Busy#))
InlineSetting=CharacterSpacing | (#Lead#*#TrackDetail#*#Sz#) | (#Trail#*#TrackDetail#*#Sz#)
X=(#Mir#*Round(#BoxW#-(#IconBox#+4)*#Sz#)+(1-#Mir#)*(#IconBox#+4)*#Sz#)
Y=((#IconBox#/2)*#Sz#)
StringAlign=#TA#
SolidColor=0,0,0,1
MouseActionCursor=1
LeftMouseUpAction=[!CommandMeasure mDeepCool "Toggle()"]
Text=#StateText#

[Bulb]
; Bulb after the label; hidden while starting or closing, and for good when
; there is no process name to check (DeepCoolHasBulb=0).
Meter=Image
Hidden=(1-#DeepCoolHasBulb#)
ImageName=#@#Icons\lightbulb.png
ImageTint=#Ink#
ImageAlpha=(#AlphaHover#*#Reveal#*(1-#Busy#))
X=(#Mir#*Round(#BoxW#-(#IconBox#+4)*#Sz#-[State:W]-8*#Sz#-24*#Sz#)+(1-#Mir#)*([State:XW]+8*#Sz#))
Y=(((#IconBox#-24)/2)*#Sz#)
W=(24*#Sz#)
H=(24*#Sz#)
SolidColor=0,0,0,1
AntiAlias=1
MouseActionCursor=1
DynamicVariables=1
Group=Reveal
MouseOverAction=[!SetOption Bulb ImageTint "#HoverTint#"][!UpdateMeter Bulb][!Redraw]
MouseLeaveAction=[!SetOption Bulb ImageTint "#Ink#"][!UpdateMeter Bulb][!Redraw]
LeftMouseUpAction=[!CommandMeasure mDeepCool "Toggle()"]

[Spinner]
; Loader after the state text while starting or closing (Spinner.lua draws it).
Meter=Shape
; Its width is 2*(radius+stroke) as Spinner.lua draws it, so the right side can anchor to it.
X=(#Mir#*Round(#BoxW#-(#IconBox#+4)*#Sz#-[State:W]-6*#Sz#-2*(Round(5*#Sz#)+Max(1,Round(1.5*#Sz#))))+(1-#Mir#)*Round([State:XW]+6*#Sz#))
Y=(Round(#IconBox#/2*#Sz#)-Round(5*#Sz#)-Max(1,Round(1.5*#Sz#)))
Shape=Ellipse 1,1,1 | StrokeWidth 0
AntiAlias=1
DynamicVariables=1
Hidden=1
