[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
MouseOverAction=[!CommandMeasure mFade "Stop 2"][!CommandMeasure mFade "Execute 1"]
MouseLeaveAction=[!CommandMeasure mFade "Stop 1"][!CommandMeasure mFade "Execute 2"]

[Metadata]
Name=Control-Plaine | Recycle Bin
Author=Vishnu A
Information=Bin icon that shows whether anything is in it. Hover for item count and size. Click the icon to open the bin; click Empty bin to empty it (Windows asks to confirm).
Version=1.0.0
License=CC BY-NC-SA 4.0

[Variables]
@include=#@#Theme.inc
@include2=#@#User.inc
Reveal=0
; Width of the detail text to the left of the icon.
TextW=140

@include3=#@#Styles.inc
@include4=#@#Fade.inc

; ---------- Measures ----------

[mCount]
Measure=Plugin
Plugin=RecycleManager
RecycleType=Count
Drives=ALL
UpdateDivider=5
IfCondition=mCount = 0
IfTrueAction=[!SetOption Icon ImageName "#@#Icons\bin-empty.png"][!SetOption Count Text "Bin is empty"][!HideMeter Size][!HideMeter EmptyBin][!UpdateMeter *][!Redraw]
IfCondition2=mCount = 1
IfTrueAction2=[!SetOption Icon ImageName "#@#Icons\bin-full.png"][!SetOption Count Text "1 item"][!ShowMeter Size][!ShowMeter EmptyBin][!UpdateMeter *][!Redraw]
IfCondition3=mCount > 1
IfTrueAction3=[!SetOption Icon ImageName "#@#Icons\bin-full.png"][!SetOption Count Text "%1 items"][!ShowMeter Size][!ShowMeter EmptyBin][!UpdateMeter *][!Redraw]

[mSize]
Measure=Plugin
Plugin=RecycleManager
RecycleType=Size
Drives=ALL
UpdateDivider=5

; ---------- Meters ----------

[Count]
Meter=String
MeterStyle=sReveal
MeasureName=mCount
StringAlign=Right
X=(#TextW#*#Scale#)
Y=0
SolidColor=0,0,0,1
Text=

[Size]
Meter=String
MeterStyle=sReveal
MeasureName=mSize
StringAlign=Right
AutoScale=1
NumOfDecimals=1
X=(#TextW#*#Scale#)
Y=(2*#Scale#)R
SolidColor=0,0,0,1
Text=%1B

[EmptyBin]
Meter=String
MeterStyle=sReveal
StringAlign=Right
X=(#TextW#*#Scale#)
Y=(6*#Scale#)R
SolidColor=0,0,0,1
MouseActionCursor=1
ToolTipText=Empty the Recycle Bin
LeftMouseUpAction=[!CommandMeasure mCount "EmptyBin"]
Text=Empty bin

[Icon]
Meter=Image
MeterStyle=sIconFade
ImageName=#@#Icons\bin-empty.png
X=((#TextW#+10)*#Scale#)
Y=0
ToolTipText=Open Recycle Bin
LeftMouseUpAction=[!CommandMeasure mCount "OpenBin"]
