; Control-Plaine | RecycleBin
; What it shows: RECYCLE BIN over the item count and total size, with a trash
; icon on the right. Click the title or the icon to open the bin; hover shows
; EMPTY while there is something to empty.
; Designed for: Windows' Recycle Bin on all drives (bundled RecycleManager plugin).
; The count is top-level items: a deleted folder counts as one.
; Adjust (Settings > RECYCLE BIN, or User.inc):
;   RecycleBinShowSize=1 or 0   show the size after the count
;   RecycleBinConfirm=1 or 0    Windows asks before emptying
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
Group=ControlPlaine
ContextTitle=Control-Plaine settings
ContextAction=[!ActivateConfig "#ROOTCONFIG#\Settings" "RecycleBin.ini"]
MouseOverAction=[!CommandMeasure mFade "Stop 2"][!CommandMeasure mFade "Execute 1"]
MouseLeaveAction=[!CommandMeasure mFade "Stop 1"][!CommandMeasure mFade "Execute 2"]

[Metadata]
Name=Control-Plaine | RecycleBin
Author=Vishnu A
Information=Recycle Bin item count and size. Click to open it, hover to empty it.
Version=2.0.0
License=CC BY-NC-SA 4.0

[Variables]
@include=#@#Theme.inc
@include2=#@#Defaults.inc
@include3=#ROOTCONFIGPATH#RecycleBin\Defaults.inc
@include4=#@#User.inc
@include5=#@#State.inc
; Width of the text column: the widest of the title and this sample count.
SampleText=0000 FILES   000.0 GB
ColW=(Max([RefText:W],[Title:W]))
; Icon: 36 px visible, so a 48 px PNG box (icons fill 3/4 of their box).
IconW=48
IconInset=6
IconGap=14
@include6=#@#Core.inc
@include7=#@#Styles.inc

; ---------- Measures ----------

[mCount]
Measure=Plugin
Plugin=RecycleManager
RecycleType=Count
Drives=ALL
UpdateDivider=3

[mSize]
Measure=Plugin
Plugin=RecycleManager
RecycleType=Size
Drives=ALL
UpdateDivider=3

[mScript]
; Sets the count/size text, the icon and the EMPTY link on every run.
Measure=Script
ScriptFile=#@#Scripts\RecycleBin.lua
UpdateDivider=3

; ---------- Meters ----------

[Hit]
Meter=Image
MeterStyle=sHit
X=0
Y=0
W=([Icon:X]+[Icon:W])
H=(Max([Icon:Y]+[Icon:H],[LinkEmpty:Y]+[LinkEmpty:H]))

[RefText]
; Invisible sample count, so the column does not move as numbers change.
Meter=String
MeterStyle=sDetail
FontColor=0,0,0,0
FontEffectColor=0,0,0,0
StringEffect=None
X=0
Y=0
InlineSetting=CharacterSpacing | (#TrackDetail#*#Scale#) | 0
Text=#SampleText#

[Title]
Meter=String
MeterStyle=sTitle
StringAlign=Right
X=#ColW#
Y=0
InlineSetting=CharacterSpacing | (#TrackTitle#*#Scale#) | 0
Text=RECYCLE BIN
SolidColor=0,0,0,1
MouseActionCursor=1
ToolTipText=Open the Recycle Bin
LeftMouseUpAction=[!CommandMeasure mCount "OpenBin"]

[Detail]
Meter=String
MeterStyle=sDetail
StringAlign=Right
X=#ColW#
Y=(4*#Scale#)R
InlineSetting=CharacterSpacing | (#TrackDetail#*#Scale#) | 0
Text=EMPTY
SolidColor=0,0,0,1
MouseActionCursor=1
ToolTipText=Open the Recycle Bin
LeftMouseUpAction=[!CommandMeasure mCount "OpenBin"]

[LinkEmpty]
Meter=String
MeterStyle=sLink
StringAlign=Right
X=#ColW#
Y=(6*#Scale#)R
InlineSetting=CharacterSpacing | (#TrackDetail#*#Scale#) | 0
Text=EMPTY
ToolTipText=Empty the Recycle Bin
LeftMouseUpAction=[!CommandMeasure mScript "Empty()"]

[Icon]
Meter=Image
MeterStyle=sIconFade
ImageName=#@#Icons\trash-empty.png
W=(#IconW#*#Scale#)
H=(#IconW#*#Scale#)
X=(#ColW#+(#IconGap#-#IconInset#)*#Scale#)
Y=(([Detail:Y]+[Detail:H])/2-#IconW#*#Scale#/2)
ToolTipText=Open the Recycle Bin
LeftMouseUpAction=[!CommandMeasure mCount "OpenBin"]
