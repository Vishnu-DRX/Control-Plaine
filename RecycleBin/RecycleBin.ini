; Control-Plaine | RecycleBin
; What it shows: RECYCLE BIN over the total size, with a trash icon on the
; right. The size turns orange above RecycleBinWarnGB. Click the title, size or
; icon to open the bin; hover shows EMPTY beside the size while there is
; something to empty.
; Designed for: Windows' Recycle Bin on all drives (bundled RecycleManager plugin).
; Adjust (Settings > RECYCLE BIN, or User.inc):
;   RecycleBinConfirm=1 or 0    Windows asks before emptying
;   RecycleBinWarnGB=10         size shows in orange above this many GB
[Rainmeter]
; RecycleBinTooltips=0 hides every tooltip of this skin (see Core.inc).
ToolTipHidden=#TipHidden[#RecycleBinTooltips]#
Update=1000
AccurateText=1
DynamicWindowSize=1
Group=ControlPlaine
ContextTitle=Control-Plaine settings
ContextAction=[!ActivateConfig "#ROOTCONFIG#\Settings" "RecycleBin.ini"]
MouseOverAction=[!CommandMeasure mFade "Stop 2"][!CommandMeasure mFade "Execute 1"]
MouseLeaveAction=[!CommandMeasure mFade "Stop 1"][!CommandMeasure mFade "Execute 2"]

[Metadata]
Name=Control-Plaine | RecycleBin
Author=Vishnu A
Information=Recycle Bin size, orange when large. Click to open it, hover to empty it.
Version=2.0.0
License=CC BY-NC-SA 4.0

[Variables]
@include=#@#Theme.inc
@include2=#@#Defaults.inc
@include3=#ROOTCONFIGPATH#RecycleBin\Defaults.inc
@include4=#@#User.inc
@include5=#@#State.inc
; Size colour and rest alpha; RecycleBin.lua switches them to Warn above
; RecycleBinWarnGB.
SizeInk=#Ink#
SizeAlpha=#AlphaDetail#
; Colour of the EMPTY link: the accent while the mouse is over it.
EmptyInk=#Ink#
; Same width as Media and Volume: ColW, then Gap, then the icon centred where
; their ring is.
ColW=170
Gap=12
C=((#RingRadius#+#RingWidth#/2+1)*#Scale#)
; Icon: 42 px visible, so a 56 px PNG box (icons fill 3/4 of their box).
IconW=56
IconTextGap=10
; Text right edge: IconTextGap before the icon's visible edge.
TextRight=(Round((#ColW#+#Gap#-#IconTextGap#-#IconW#*3/8)*#Scale#+#C#))
; Text sizes for this skin (px at scale 1); a bit bigger than the suite's
; Title (9.5) and Detail (7.25) tokens.
BinSizeTitle=11.5
BinSizeDetail=8.5
; Letter spacing for this skin (px at scale 1). Tighter than the suite's Title
; and Detail tokens, which read as stretched on the short bin lines.
BinTrackTitle=2
BinTrackDetail=1.2
@include6=#@#Core.inc
@include7=#@#Styles.inc

; ---------- Measures ----------

[mCount]
Measure=Plugin
Plugin=RecycleManager
RecycleType=Count
Drives=ALL
UpdateDivider=3

[mSize]
Measure=Plugin
Plugin=RecycleManager
RecycleType=Size
Drives=ALL
UpdateDivider=3

[mScript]
; Sets the size text and colour, the icon and the EMPTY link on every run.
Measure=Script
ScriptFile=#@#Scripts\RecycleBin.lua
UpdateDivider=3

; ---------- Meters ----------

[Hit]
Meter=Image
MeterStyle=sHit
X=0
Y=0
W=((#ColW#+#Gap#)*#Scale#+2*#C#)
H=(Max([Icon:Y]+[Icon:H],[Detail:Y]+[Detail:H]))

[Title]
Meter=String
MeterStyle=sTitle
StringAlign=Right
FontSize=(#BinSizeTitle#*#Scale#)
X=#TextRight#
Y=0
InlineSetting=CharacterSpacing | (#BinTrackTitle#*#Scale#) | 0
Text=RECYCLE BIN
SolidColor=0,0,0,1
MouseActionCursor=1
ToolTipText=Open Recycle Bin
LeftMouseUpAction=[!CommandMeasure mCount "OpenBin"]

[Detail]
Meter=String
MeterStyle=sDetail
StringAlign=Right
FontSize=(#BinSizeDetail#*#Scale#)
X=#TextRight#
Y=(5*#Scale#)R
InlineSetting=CharacterSpacing | (#BinTrackDetail#*#Scale#) | 0
FontColor=#SizeInk#,(#SizeAlpha#+(#AlphaHover#-#SizeAlpha#)*#Reveal#)
Text=EMPTY
SolidColor=0,0,0,1
MouseActionCursor=1
ToolTipText=Open Recycle Bin
LeftMouseUpAction=[!CommandMeasure mCount "OpenBin"]

[LinkEmpty]
; On the size line, left of the size.
Meter=String
MeterStyle=sLink
StringAlign=Right
FontSize=(#BinSizeDetail#*#Scale#)
X=([Detail:X]-16*#Scale#)
Y=[Detail:Y]
InlineSetting=CharacterSpacing | (#BinTrackDetail#*#Scale#) | 0
FontColor=#EmptyInk#,(#AlphaHover#*#Reveal#)
Text=EMPTY
ToolTipText=Empty Recycle Bin
MouseOverAction=[!SetVariable EmptyInk "#Accent#"][!UpdateMeter LinkEmpty][!Redraw]
MouseLeaveAction=[!SetVariable EmptyInk "#Ink#"][!UpdateMeter LinkEmpty][!Redraw]
LeftMouseUpAction=[!CommandMeasure mScript "Empty()"]

[Icon]
Meter=Image
MeterStyle=sIconFade
ImageName=#@#Icons\trash-empty.png
W=(#IconW#*#Scale#)
H=(#IconW#*#Scale#)
X=(Round((#ColW#+#Gap#)*#Scale#+#C#-#IconW#/2*#Scale#))
Y=(([Detail:Y]+[Detail:H])/2-#IconW#*#Scale#/2)
ToolTipText=Open Recycle Bin
LeftMouseUpAction=[!CommandMeasure mCount "OpenBin"]
