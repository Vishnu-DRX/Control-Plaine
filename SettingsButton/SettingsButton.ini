; Control-Plaine | SettingsButton
; What it shows: a dim gear; hover brightens it and adds SETTINGS. Click opens
; the Settings window. This skin is the way back into settings, so it never
; hides itself (no SelfHidden) and stays clickable with LockPositions on.
; Adjust (Settings > SETTINGS BUTTON, or User.inc):
;   SettingsButtonAlign=left or right   which screen edge it sits on (gear
;                               first, or label first with the gear last)
;   SettingsButtonDetails=hover or always   when the SETTINGS label shows
;   SettingsButtonTheme=auto, dark or light   colours: auto follows Theme
[Rainmeter]
; SettingsButtonTooltips=0 hides every tooltip of this skin (see Core.inc).
ToolTipHidden=#TipHidden[#SettingsButtonTooltips]#
Update=1000
AccurateText=1
DynamicWindowSize=1
Group=ControlPlaine
ContextTitle=Control-Plaine settings
ContextAction=[!ActivateConfig "#ROOTCONFIG#\Settings" "SettingsButton.ini"]
MouseOverAction=[!CommandMeasure mFade "Stop 2"][!CommandMeasure mFade "Execute 1"]
MouseLeaveAction=[!CommandMeasure mFade "Stop 1"][!CommandMeasure mFade "Execute 2"]

[Metadata]
Name=Control-Plaine | SettingsButton
Author=Vishnu A
Information=A gear that opens the Control-Plaine Settings window.
Version=2.0.1
License=MIT

[Variables]
@include=#@#Theme.inc
@include2=#@#Defaults.inc
@include3=#ROOTCONFIGPATH#SettingsButton\Defaults.inc
@include4=#@#User.inc
@include5=#@#State.inc
; Read by Core.inc (Scripts\Core.lua) to arrange the skin; see specs/alignment.md.
SkinSide=#SettingsButtonAlign#
SkinDetails=#SettingsButtonDetails#
SkinTheme=#SettingsButtonTheme#
@include6=#@#Core.inc
; Sits with the app skins: boosted size.
Sz=(#Scale#*#SizeBoost#)
@include7=#@#Styles.inc

; ---------- First run ----------

[mFirstRun]
; Fallback trigger for first-run setup. Evaluated once when the skin loads
; (UpdateDivider=-1): if SetupDone is not 1, open the Settings window, the same
; bang as a click on the gear. No loop, and nothing happens once SetupDone=1.
Measure=Calc
Formula=(#SetupDone# = 1 ? 1 : 0)
UpdateDivider=-1
IfCondition=mFirstRun = 0
IfTrueAction=[!ActivateConfig "#ROOTCONFIG#\Settings" "General.ini"]

; ---------- Meters ----------

[RefLabel]
; Invisible copy of the label. The label never changes, so its width fixes the
; box: Hit is gear + gap + this width on both sides. Its X keeps the text
; inside the box when right-aligned (an upper bound on the label width), and
; it only sets the width, it is never seen.
Meter=String
MeterStyle=sReveal
FontColor=0,0,0,0
FontEffectColor=0,0,0,0
InlineSetting=CharacterSpacing | (#Lead#*#TrackDetail#*#Sz#) | (#Trail#*#TrackDetail#*#Sz#)
X=(#Mir#*120*#Sz#)
Y=((#IconBox#/2)*#Sz#)
StringAlign=#TA#
Text=SETTINGS

[Hit]
Meter=Image
MeterStyle=sHit
X=0
Y=0
W=(Round((#IconBox#+4)*#Sz#+[RefLabel:W]))
H=(#IconBox#*#Sz#)

[Icon]
; Dim at rest, brighter on hover; accent while the pointer is on the gear.
Meter=Image
MeterStyle=sIconFade
ImageName=#@#Icons\settings.png
X=(#Mir#*Round([Hit:W]-#IconBox#*#Sz#))
Y=0
ToolTipText=Open settings
MouseOverAction=[!SetOption Icon ImageTint "#HoverTint#"][!UpdateMeter Icon][!Redraw]
MouseLeaveAction=[!SetOption Icon ImageTint "#Ink#"][!UpdateMeter Icon][!Redraw]
LeftMouseUpAction=[!ActivateConfig "#ROOTCONFIG#\Settings" "General.ini"]

[Label]
Meter=String
MeterStyle=sReveal
InlineSetting=CharacterSpacing | (#Lead#*#TrackDetail#*#Sz#) | (#Trail#*#TrackDetail#*#Sz#)
X=(#Mir#*Round([Hit:W]-(#IconBox#+4)*#Sz#)+(1-#Mir#)*(#IconBox#+4)*#Sz#)
Y=((#IconBox#/2)*#Sz#)
StringAlign=#TA#
SolidColor=0,0,0,1
MouseActionCursor=1
Text=SETTINGS
ToolTipText=Open settings
LeftMouseUpAction=[!ActivateConfig "#ROOTCONFIG#\Settings" "General.ini"]
