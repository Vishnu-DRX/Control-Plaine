; Control-Plaine | Media
; What it shows: the song playing in any app (title, artist), a ring with the
;   playback progress, play/pause inside the ring and previous/next chevrons
;   at the ends of the line. Hidden while nothing is playing.
; Designed for: the Windows media session, through the MediaPlayer.dll plugin
;   (https://github.com/i2002/RainmeterMediaPlayer, v1.4, 64-bit static build
;   in %APPDATA%\Rainmeter\Plugins; restart Rainmeter after installing it).
;   Works with any player that shows in the Windows media flyout (Spotify,
;   browsers, ...). When several play, Windows decides which one is shown.
;   Some sources (e.g. some websites) give no position: the ring stays empty.
; Adjust (Settings > MEDIA, or Media\Defaults.inc): MediaHideIdle,
;   MediaScrollTitles, MediaSource/MediaPlugin (set MediaPlugin=WebNowPlaying
;   to use WebNowPlaying Redux instead; it must be installed).
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
Group=ControlPlaine
ContextTitle=Control-Plaine settings
ContextAction=[!ActivateConfig "#ROOTCONFIG#\Settings" "Media.ini"]
MouseOverAction=[!CommandMeasure mFade "Stop 2"][!CommandMeasure mFade "Execute 1"]
MouseLeaveAction=[!CommandMeasure mFade "Stop 1"][!CommandMeasure mFade "Execute 2"]
OnRefreshAction=[!CommandMeasure mMedia "Start()"]

[Metadata]
Name=Control-Plaine | Media
Author=Vishnu A
Information=Now playing from any app: title, artist, progress ring, play/pause, previous and next.
Version=2.0.0
License=CC BY-NC-SA 4.0

[Variables]
@include=#@#Theme.inc
@include2=#@#Defaults.inc
@include3=#ROOTCONFIGPATH#Media\Defaults.inc
@include4=#@#User.inc
@include5=#@#State.inc
; Start hidden; mState shows the skin when something plays.
SelfHidden=#MediaHideIdle#
; Text column width and gap to the ring, px at scale 1.
ColW=140
Gap=12
; Ring geometry (px, already scaled): stroke, radius, centre.
SW=(#RingWidth#*#Scale#)
RR=(#RingRadius#*#Scale#)
C=((#RingRadius#+#RingWidth#/2+1)*#Scale#)
; Longest the title/artist may get before clipping: the column when
; MediaScrollTitles=0 (ellipsis), unlimited when 1 (Media.lua slides it).
TitleW=(#ColW#*#Scale#*(1-#MediaScrollTitles#)+4000*#MediaScrollTitles#)
; Rest alpha multiplier: 1 playing, lower while paused (set by mState).
Dim=1
@include6=#@#Core.inc
@include7=#@#Styles.inc

; ---------- Measures ----------

[mState]
; 0 nothing/stopped, 1 playing, 2 paused.
Measure=Plugin
Plugin=#MediaPlugin#
PlayerType=State
Group=Media
IfCondition=(mState = 0) && (#MediaHideIdle# = 1)
IfTrueAction=[!CommandMeasure mIdle "Execute 1"]
IfFalseAction=[!CommandMeasure mIdle "Stop 1"][!SetVariable SelfHidden 0][!UpdateMeasure mVisible]
IfCondition2=mState = 2
IfTrueAction2=[!SetVariable Dim 0.7][!UpdateMeterGroup Media][!Redraw]
IfFalseAction2=[!SetVariable Dim 1][!UpdateMeterGroup Media][!Redraw]

[mIdle]
; Wait a moment before hiding, so track changes don't flicker.
Measure=Plugin
Plugin=ActionTimer
ActionList1=Wait 2000 | GoIdle
GoIdle=[!SetVariable SelfHidden 1][!UpdateMeasure mVisible]
IgnoreWarnings=1

[mTitle]
Measure=Plugin
Plugin=#MediaPlugin#
PlayerType=Title
; DisableCoverCropping only silences a MediaPlayer v1.4 bug: a missing brace in
; its Reload logs "Unknown player action" for title/artist (the measure still
; works). With the option set, that branch is skipped. No effect otherwise.
DisableCoverCropping=1
Substitute="":"NOTHING PLAYING"
OnChangeAction=[!CommandMeasure mMedia "Start()"]
Group=Media

[mArtist]
Measure=Plugin
Plugin=#MediaPlugin#
PlayerType=Artist
DisableCoverCropping=1
Group=Media

[mProgress]
; 0-100; 0 when the source gives no position.
Measure=Plugin
Plugin=#MediaPlugin#
PlayerType=Progress
Group=Media

[mArc]
; Ring fill, 0 to 0.999 (an arc whose ends meet draws nothing).
Measure=Calc
Formula=Clamp(mProgress/100,0,0.999)
Group=Media

[mMedia]
Measure=Script
ScriptFile=#@#Scripts\Media.lua

[mScroll]
; Slides long titles when MediaScrollTitles=1 (Media.lua).
Measure=Plugin
Plugin=ActionTimer
ActionList1=Repeat Tick,40,1000000
Tick=[!CommandMeasure mMedia "Tick()"]
IgnoreWarnings=1

; ---------- Meters ----------

[Back]
; Hover area for the whole skin.
Meter=Image
MeterStyle=sHit
W=((#ColW#+#Gap#)*#Scale#+2*#C#)
H=(2*#C#)

[TitleBox]
; Clips the title (and lets it slide).
Meter=Image
X=0
Y=0
W=(#ColW#*#Scale#)
H=(30*#Scale#)
SolidColor=0,0,0,255
DynamicVariables=1

[Title]
Meter=String
MeterStyle=sValue
MeasureName=mTitle
Container=TitleBox
X=0
Y=(4*#Scale#)
FontSize=(#SizeValueS#*#Scale#)
FontColor=#Ink#,((#AlphaValue#+(#AlphaHover#-#AlphaValue#)*#Reveal#)*#Dim#)
FontEffectColor=#ShadowRGB#,(((#AlphaValue#+(#AlphaHover#-#AlphaValue#)*#Reveal#)*#Dim#)*#ShadowK#)
ClipString=2
ClipStringW=#TitleW#
InlineSetting=CharacterSpacing | 0 | (#TrackValue#*#Scale#)
Text=%1
Group=Reveal | Media

[PrevHit]
Meter=Image
MeterStyle=sHit
X=0
Y=(23*#Scale#)
W=(14*#Scale#)
H=(16*#Scale#)
MouseActionCursor=1
ToolTipText=Previous
LeftMouseUpAction=[!CommandMeasure mState "Previous"][!UpdateMeasureGroup Media][!UpdateMeterGroup Media][!Redraw]

[Prev]
Meter=Shape
X=0
Y=(27*#Scale#)
Shape=Path PrevPath | Fill Color 0,0,0,0 | StrokeWidth (1.5*#Scale#) | Stroke Color #Ink#,((#AlphaDetail#+(#AlphaHover#-#AlphaDetail#)*#Reveal#)*#Dim#) | StrokeStartCap Round | StrokeEndCap Round | StrokeLineJoin Round
PrevPath=(4.5*#Scale#),(1*#Scale#) | LineTo (1*#Scale#),(4*#Scale#) | LineTo (4.5*#Scale#),(7*#Scale#)
AntiAlias=1
DynamicVariables=1
Group=Reveal | Media

[Hairline]
Meter=Image
X=(12*#Scale#)
Y=(30.5*#Scale#)
W=((#ColW#-24)*#Scale#)
H=(1*#Scale#)
SolidColor=#Ink#,#AlphaTrack#
DynamicVariables=1

[NextHit]
Meter=Image
MeterStyle=sHit
X=((#ColW#-14)*#Scale#)
Y=(23*#Scale#)
W=(14*#Scale#)
H=(16*#Scale#)
MouseActionCursor=1
ToolTipText=Next
LeftMouseUpAction=[!CommandMeasure mState "Next"][!UpdateMeasureGroup Media][!UpdateMeterGroup Media][!Redraw]

[Next]
Meter=Shape
X=((#ColW#-6)*#Scale#)
Y=(27*#Scale#)
Shape=Path NextPath | Fill Color 0,0,0,0 | StrokeWidth (1.5*#Scale#) | Stroke Color #Ink#,((#AlphaDetail#+(#AlphaHover#-#AlphaDetail#)*#Reveal#)*#Dim#) | StrokeStartCap Round | StrokeEndCap Round | StrokeLineJoin Round
NextPath=(1*#Scale#),(1*#Scale#) | LineTo (4.5*#Scale#),(4*#Scale#) | LineTo (1*#Scale#),(7*#Scale#)
AntiAlias=1
DynamicVariables=1
Group=Reveal | Media

[ArtistBox]
Meter=Image
X=0
Y=(35*#Scale#)
W=(#ColW#*#Scale#)
H=(16*#Scale#)
SolidColor=0,0,0,255
DynamicVariables=1

[Artist]
Meter=String
MeterStyle=sDetail
MeasureName=mArtist
Container=ArtistBox
X=0
Y=0
FontColor=#Ink#,((#AlphaDetail#+(#AlphaHover#-#AlphaDetail#)*#Reveal#)*#Dim#)
FontEffectColor=#ShadowRGB#,(((#AlphaDetail#+(#AlphaHover#-#AlphaDetail#)*#Reveal#)*#Dim#)*#ShadowK#)
ClipString=2
ClipStringW=#TitleW#
InlineSetting=CharacterSpacing | 0 | (#TrackDetail#*#Scale#)
Text=%1
Group=Reveal | Media

[Ring]
; Track, then progress: accent while playing, grey while paused.
Meter=Shape
MeterStyle=sRing
X=((#ColW#+#Gap#)*#Scale#)
Y=0
Shape=Ellipse #C#,#C#,#RR# | Fill Color 0,0,0,0 | StrokeWidth #SW# | Stroke Color #Ink#,#AlphaTrack#
Shape2=Arc #C#,(#C#-#RR#),(#C#+#RR#*Sin(2*PI*[mArc:4])),(#C#-#RR#*Cos(2*PI*[mArc:4])),#RR#,#RR#,0,0,([mArc:4]>0.5 ? 1 : 0) | Fill Color 0,0,0,0 | StrokeWidth #SW# | Stroke Color #Ink#,([mArc:4]>0 ? #AlphaOff# : 0) | StrokeStartCap Round | StrokeEndCap Round
Shape3=Arc #C#,(#C#-#RR#),(#C#+#RR#*Sin(2*PI*[mArc:4])),(#C#-#RR#*Cos(2*PI*[mArc:4])),#RR#,#RR#,0,0,([mArc:4]>0.5 ? 1 : 0) | Fill Color 0,0,0,0 | StrokeWidth #SW# | Stroke Color #Accent#,(([mArc:4]>0)*(#Dim#=1)*255) | StrokeStartCap Round | StrokeEndCap Round
Group=Media

[PlayPause]
; Pause bars while playing, a play triangle otherwise. Click toggles.
Meter=Shape
X=((#ColW#+#Gap#)*#Scale#)
Y=0
Shape=Ellipse #C#,#C#,(#RR#-#SW#/2) | StrokeWidth 0 | Fill Color 0,0,0,1
Shape2=Rectangle (#C#-5*#Scale#),(#C#-6*#Scale#),(3*#Scale#),(12*#Scale#),(1*#Scale#) | StrokeWidth 0 | Fill Color #Ink#,(([mState:0]=1)*(#AlphaDetail#+(#AlphaHover#-#AlphaDetail#)*#Reveal#))
Shape3=Rectangle (#C#+2*#Scale#),(#C#-6*#Scale#),(3*#Scale#),(12*#Scale#),(1*#Scale#) | StrokeWidth 0 | Fill Color #Ink#,(([mState:0]=1)*(#AlphaDetail#+(#AlphaHover#-#AlphaDetail#)*#Reveal#))
Shape4=Path PlayPath | StrokeWidth (1*#Scale#) | Stroke Color #Ink#,(([mState:0]<>1)*(#AlphaDetail#+(#AlphaHover#-#AlphaDetail#)*#Reveal#)*#Dim#) | StrokeLineJoin Round | Fill Color #Ink#,(([mState:0]<>1)*(#AlphaDetail#+(#AlphaHover#-#AlphaDetail#)*#Reveal#)*#Dim#)
PlayPath=(#C#-4*#Scale#),(#C#-6.5*#Scale#) | LineTo (#C#+6*#Scale#),#C# | LineTo (#C#-4*#Scale#),(#C#+6.5*#Scale#) | ClosePath 1
AntiAlias=1
DynamicVariables=1
MouseActionCursor=1
ToolTipText=Play / pause
LeftMouseUpAction=[!CommandMeasure mState "PlayPause"][!UpdateMeasureGroup Media][!UpdateMeterGroup Media][!Redraw]
Group=Reveal | Media
